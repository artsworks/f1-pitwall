<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>pitwall — radio</title>
  <link rel="stylesheet" href="/static/style.css?v=36">
</head>
<body class="radio connecting">
  <header class="status">
    <span id="live" class="live">CONNECTING…</span>
    <span id="age" class="dim">--</span>
    <span class="spacer"></span>
    <span id="page" class="pill page">RACE</span>
    <span id="lap">LAP --</span>
    <button id="arm-radio" type="button" aria-pressed="false">ARM PHONE RADIO</button>
  </header>

  <section id="banner" class="banner idle">
    <div class="bar"></div>
    <div id="call-life" class="life"></div>
    <div class="body">
      <div class="current">
        <div id="call-text" class="text">— radio quiet —</div>
        <div id="call-meta" class="meta"></div>
        <div id="press" class="press" hidden></div>
      </div>
      <div id="call-evidence" class="evidence" hidden></div>
      <div id="previous" class="previous" hidden></div>
    </div>
  </section>

  <section class="log"><ol id="log"></ol></section>
  <div class="scrim"></div>
  <aside id="drvmenu" class="drvmenu" aria-live="polite">
    <div class="drvmenu-head">RADIO PIT <span id="drvmenu-left" class="left"></span></div>
    <div class="meter"><i id="drvmenu-meter"></i></div>
    <ol id="drvmenu-list"></ol>
  </aside>
  <div id="fx" class="fx"></div>
  <script src="/static/app.js?v=38"></script>
</body>
</html>
