[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pitwall"
version = "0.36.0"
description = "A race engineer for F1 26: UDP telemetry ingest, record, replay, strategy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "numpy",
    "pydantic>=2",
    "pywin32; sys_platform == 'win32'",
    "piper-tts>=1.7,<2",
    "pyyaml",
    "uvicorn",
    "websockets",
    "zstandard",
]

[project.scripts]
pitwall = "pitwall.cli:main"

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-xdist",
    "ruff",
    "mypy",
    "types-PyYAML",
    "python-semantic-release~=10.6.2",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"
# 0.x rule: a breaking change bumps MINOR, not MAJOR. Moving to 1.0.0 is a manual decision.
major_on_zero = false
allow_zero_version = true
build_command = "uv lock"
assets = ["uv.lock"]

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.publish]
upload_to_vcs_release = false

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: replay-heavy or long-running tests",
    "replay: tests that replay recorded fixtures",
]
