name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the older run on the same branch, including main.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Start smoke
        run: uv run python scripts/smoke_start.py

  test-fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Assert libyaml available
        run: uv run python -c "import yaml; assert hasattr(yaml, 'CSafeLoader'), 'libyaml (CSafeLoader) missing in CI'"
      - name: Fast tests
        run: uv run pytest -m "not slow and not replay" -n auto --dist loadfile
      - name: Replay determinism (max vs 10x)
        run: >-
          uv run pytest
          tests/test_engine_replay.py::test_deterministic_across_speeds
          tests/test_m2_replay.py::test_replay_deterministic_across_speeds

  test-replay:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Replay tests
        run: uv run pytest -m "replay and not slow" -n auto --dist loadfile

  test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Fast tests
        run: uv run pytest -m "not slow and not replay" -n auto --dist loadfile
      - name: Replay determinism (max vs 10x)
        run: >-
          uv run pytest
          tests/test_engine_replay.py::test_deterministic_across_speeds
          tests/test_m2_replay.py::test_replay_deterministic_across_speeds

  test-full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Full test suite
        run: uv run pytest -n auto --dist loadfile
