connection:
  udp_host: "0.0.0.0"
  udp_port: 20777
  send_rate_hz: 30
  http_host: "0.0.0.0"
  http_port: 8000
  require_pin: true  # 4-digit PIN for other devices; this PC needs none
  pin_trust_localhost: true  # set false if a tunnel or proxy on this PC serves the dashboard
  https_cert: ""  # optional mkcert PEM path for LAN phone access
  https_key: ""
  shutdown_timeout_s: 3  # close lingering dashboard connections on Ctrl+C
recording:
  enabled: true
  directory: recordings
  profile: lite  # full | lite | minimal (docs/adr/0006); `pitwall start --record full` overrides
  compress_on_close: true
engine:
  tick_hz: 10
  heartbeat_s: 5            # SQLite runtime heartbeat (crash recovery)
  recovery_max_age_s: 300   # a heartbeat newer than this on start = crashed mid-session
  recovery_tail_s: 120      # seconds of the recording tail replayed to rebuild state
  watchdog: true            # start = recorder/supervisor process + restartable engine child
  engine_port: 20787        # loopback port the supervisor forwards telemetry to
  watchdog_stall_s: 20      # engine liveness file older than this = hung, kill + restart
  watchdog_grace_s: 60      # startup time before stall checks (voice load, recovery replay)
  watchdog_backoff_max_s: 10
  watchdog_reset_s: 60      # an engine that ran this long restarts without backoff
persistence:
  enabled: true
  path: ~/.pitwall/pitwall.sqlite
learning:
  auto_calibrate: true  # upkeep refits priors and tunes cooldowns; YAML stays review-only
  pack_dir: learnings  # Learning pack and track ledger. Use another drive or synced folder.
  pack_keep_days: 30  # Number of dated learning packs to retain.

  ema_fast_s: 3.0
  ema_slow_s: 30.0
  straight_hold_s: 1.0
  staleness_s:
    session: 2.0
    lap_data: 0.5
    car_telemetry: 0.5
    car_status: 0.5
    car_damage: 0.5
    motion_ex: 0.5
    participants: 15.0
    car_setups: 5.0
    session_history: 5.0
    tyre_sets: 5.0
    car_telemetry_2: 1.0
policy:
  verbosity: normal
  deadlines_s:
    1: 5.0
    2: 3.0
    3: 1.5
  calls_per_lap: 12
  min_gap_s: 3.0
  min_gap_defer_s: 10.0     # a call inside min_gap waits in the queue up to this long
  dedupe_window_s: 20.0
  quiet: false
  mute_until_lap: 0
  p3_straight_only: true
  p3_straight_wait_s: 8.0   # P3 calls wait this long past their deadline for a straight
speech:
  enabled: true
  engine: "auto"          # auto = piper if its voice is downloaded, else sapi (Windows)
  voice: null             # SAPI voice name filter
  piper_voice: "en_GB-northern_english_male-medium"
  piper_speed: 1.3        # >1 faster; 1.0 = voice natural pace
  voices_dir: "voices"
  rate: 0
  volume: 100
  radio_click: true # soft radio blip before each call
  # Delivery by priority (Piper): speed multiplier and expression (pitch/energy variation).
  tone_urgent_speed: 1.1      # P1: quicker, more urgent
  tone_urgent_expression: 1.2
  tone_calm_speed: 0.95       # P3: unhurried, flatter
  tone_calm_expression: 0.85
mindset:
  active: balanced
thresholds:
  # M3 race engine (docs/18); per-track overlays may override these.
  prior_min_weight: 2          # model_params weight needed to count as a learned prior
  prior_full_weight: 12        # learned deg weight (laps) trusted in full; lighter blends toward the default
  param_weight_cap: 50         # cap on fold_param running-mean weight
  deg_min_laps: 3              # valid laps before an OLS deg fit leaves the prior
  deg_max_ms_per_lap: 600      # clamp on fitted deg/fuel slopes
  deg_rmse_bad_ms: 800         # rmse at which fit confidence floors at 0.2
  deg_default_ms_per_lap: 80   # cold-start deg slope when nothing is known
  learn_base_min_ms: 40000     # stint base lap time outside these bounds never becomes a prior
  learn_base_max_ms: 200000
  fuel_ms_per_lap_default: 30  # pace gained per lap of fuel burn, default
  tyre_cliff_ms: 1500          # pace loss vs age 0 that counts as the tyre cliff
  wear_cliff_pct: 70           # worst-corner wear % that counts as the wear cliff
  wear_per_lap_default_pct: 2.5  # wear %/lap when not measured this stint
  rival_pace_window: 3         # laps in the rival-pace median
  rival_pace_outlier_ratio: 1.07  # drop rival laps slower than this x their best (red flag, SC, pit)
  pit_loss_default_s: 22       # green-flag pit loss when nothing is known
  pit_loss_vsc_default_s: 12
  pit_loss_sc_default_s: 8
  fuel_kg_per_lap_default: 1.7
  energy_over_tolerance_j: 200000  # |lap_delta| above this flags over/under
  ers_store_capacity_j: 4000000    # nominal 4 MJ 2026 ERS store
  # Race phase + rival scope (docs/18)
  sc_exit_hold_s: 5            # session seconds a flicker can't bounce the SC/VSC phase
  neutral_green_s: 6           # "green, green" window after an SC/VSC period ends
  puncture_gap_pct: 40         # tyre damage this far above wear = puncture
  front_wing_lost_pct: 50      # wing damage at or above this = wing gone, box for a nose
  damage_warn_pct: 20          # rear wing / floor / sidepod damage worth a call
  powertrain_damage_warn_pct: 30  # gearbox / engine damage worth a call
  contact_merge_s: 8            # hits this close together are one contact (debounce)
  contact_check_s: 4            # after the last hit, wait this long for the damage data
  contact_report_s: 10          # window for the post-contact damage / "car looks OK" report
  contact_damage_min_pct: 3     # damage rise since the hit worth reporting
  teammate_fight_gap_s: 1.0     # teammate directly ahead/behind within this = team fight
  last_lap_fight_s: 1.0        # last lap: car within this either way = attack/defend call
  fastest_lap_fresh_s: 10      # fastest-lap call window after the FTLP event
  fastest_lap_settle_s: 1.5    # rival fastest lap: wait in case the player beats it at once
  fastest_lap_chase_laps: 5    # rival fastest lap only worth a call this late
  fastest_lap_chase_s: 0.5     # ...and only if the player best is within this
  restricted_detect_laps: 2    # all-zero rival telemetry for this many laps = restricted
  restricted_confidence_factor: 0.7
  pit_exit_clean_gap_s: 2.0    # clean air both ways at pit exit (race threshold)
  thermal_hysteresis_c: 4      # overheat/graining latch hysteresis
  tyre_graining_c: 75          # coldest inner at or below this = graining band
  tyre_graining_inter_c: 55
  tyre_graining_wet_c: 50
  compound_gain_min_cars: 2    # cars needed per compound group for a lap-time crossover
  compound_crossover_s: 1.0    # drier compound this much a lap quicker = switch
  drs_zone_lookahead_m: 300    # zone start this close counts as "DRS ahead"
  drs_detection_gap_s: 1.0     # gap to car ahead inside this = DRS available
  penalty_standing_laps: 3     # time penalty vs position calls from this many laps to go
  penalty_recent_s: 10         # session seconds a PENA stays "recent"
  rain_inter_pct: 60           # forecast rain -> crossover bands
  rain_wet_pct: 85
  rain_dry_pct: 30
  rain_hysteresis_pct: 5       # crossover band hysteresis
  # Pit-window optimiser + race rules (docs/18)
  pit_horizon_laps: 8          # candidate stop laps evaluated ahead
  pit_min_laps_left: 2         # no stop inside the last N laps
  cliff_ms_per_lap: 1000       # extra pace loss per lap past the tyre cliff
  outlap_warmup_s: 0.8         # cold-tyre cost on the out-lap
  undercut_laps: 2
  undercut_max_gap_s: 3.0
  overcut_laps: 2
  overcut_min_laps: 3
  free_stop_margin_s: 1.0
  sc_stop_min_laps_left: 3
  box_in_max_laps: 3
  tyre_life_speak_laps: 10
  blister_warn_pct: 20
  blister_hysteresis_pct: 5
  wear_corner_window_laps: 3    # stint laps the per-corner wear rate is measured over
  wear_corner_ratio: 1.4         # one corner (or axle) wearing this many times the rest = abnormal
  wear_corner_hysteresis: 0.15   # ratio drop before an abnormal-wear flag clears
  wear_corner_min_delta_pct: 0.6 # and at least this many % per lap more than the rest
  fuel_hysteresis_laps: 0.1
  fuel_tight_laps: 0.1          # fuel margin at or below this = 'fuel is tight'
  fuel_spare_laps: 1.0
  gap_hysteresis_s: 0.3
  warnings_warn: 3
  pit_exit_traffic_s: 1.5
  # Named strategy plans A/B/C (docs/03 "Strategy plans")
  plan_max_stops: 2            # candidate strategies up to this many stops
  plan_min_stint_laps: 3       # shortest stint a candidate may contain
  plan_window_s: 1.5           # stop laps within this of the best form the window
  plan_two_compound_rule: 1    # dry race must use two dry compounds
  plan_off_s: 3.0              # active plan this much slower than best = off plan
  plan_off_hysteresis_s: 1.0   # back on plan once inside plan_off_s minus this
  plan_switch_s: 5.0           # switch plans once the active one loses this much
  plan_status_every_laps: 5    # "still on Plan A" cadence (sector 1, P3, budgeted)
  plan_deg_factor_soft: 1.6    # deg vs medium when a compound has no learned prior
  plan_deg_factor_medium: 1.0
  plan_deg_factor_hard: 0.6
  plan_pace_soft_ms: -400      # fresh-set pace vs medium at age 0
  plan_pace_medium_ms: 0
  plan_pace_hard_ms: 400
  # Battle state + racecraft coaching (docs/20 L3); attack range = mindset attack_window_s
  battle_defend_gap_s: 1.0      # car behind within this: defending
  battle_threat_gap_s: 3.0      # car behind within this and closing: under threat
  battle_catch_gap_s: 5.0       # car ahead within this and closing: catching
  battle_closing_min_s: 0.2     # closing rate (s/lap) that counts as a trend
  battle_min_episode_s: 5.0     # shorter attack/defend spells don't train the pass model
  battle_result_hold_s: 20.0    # "passed / held / lost" stays reportable this long
  battle_result_confirm_s: 3.0  # a pass / lost place must stick this long before it's called
  plan_announce_after_m: 300.0  # first plan call once the weekend format and grid order are known
  fuel_final_call_m: 1500.0     # no fuel calls on the last lap inside this distance to the flag
  battle_swap_window_s: 120.0   # place changes inside this window count towards a swap fight
  battle_swap_count: 3          # this many with one rival: "trading places", not pass/lost calls
  battle_scrap_count: 4         # this many across 2+ rivals: multi-car scrap
  battle_prior_weight: 4.0      # pseudo-episodes behind the pass/hold priors
  battle_pass_drs_prior: 0.35
  battle_pass_nodrs_prior: 0.15
  battle_hold_prior: 0.7
  battle_attack_prob_min: 0.3   # below this, attacking is patience + tyres, not "go"
  battle_patience_laps: 2       # laps stuck in attack range before the patience call
  battle_manage_every_laps: 5   # "gaps stable" cadence
  # Feedback loop (pitwall tune): grades -> persisted per-rule cooldown multiplier
  tune_min_grades: 3
  tune_gain: 2.0
  tune_min_cooldown_mult: 0.5
  tune_max_cooldown_mult: 4.0
  tune_auto_weight: 0.5         # a hindsight outcome counts this much of a human grade
  # Hindsight grader (pitwall digest, docs/20)
  hind_stop_window_laps: 1      # a box call counts as taken if the stop is within this
  hind_stop_tol_s: 1.5          # stop lap within this of the hindsight-best is "good"
  hind_extrapolate_laps: 3      # stop-cost search may stretch a stint this far past what was driven
  hind_cliff_sustain_laps: 2    # consecutive laps past tyre_cliff_ms before hindsight calls it a cliff
  hind_lap_tol_ms: 500          # predicted vs actual lap time
  hind_laps_tol: 2              # laps of pace vs the observed cliff
  hind_fuel_tol_laps: 0.5       # predicted vs actual finish fuel margin
  digest_max_findings: 5
  calib_max_sessions: 20 # sessions included in each track fit
  calib_fuel_ms_per_kg_max: 80 # upper bound on fitted fuel sensitivity
  calib_fuel_min_resid_kg: 1.0 # fuel must vary this much (kg) apart from tyre age to fit its effect
  fuel_delta_min_kg: 0 # minimum accepted per-lap fuel burn
  fuel_delta_max_kg: 10 # maximum accepted per-lap fuel burn
  calib_thermal_bin_c: 5 # tyre-inner temperature histogram width
  calib_thermal_min_stint_laps: 3 # green laps required to fit a thermal stint
  calib_thermal_min_laps_per_bin: 3 # samples required for a thermal bin
  calib_thermal_tolerance_ms: 150 # residual range included around best bin
  calib_converge_tol_frac: 0.1 # relative fit delta considered converged
  calib_converge_window: 3 # stable fit deltas required for convergence
  weekend_min_laps: 6 # practice laps required for a weekend prior
  energy_tol_min_j: 100000 # minimum learned energy tolerance
  energy_tol_max_j: 600000 # maximum learned energy tolerance
ui:
  state_hz: 5
  pages: [race, car, track]  # UDP Action 4 cycles in this order
  auto_page: false              # true: battle page in a fight, track page under SC/VSC/formation
  auto_page_manual_hold_s: 60   # a manual page choice holds this long before auto may switch
  auto_page_battle_gap_s: 1.0
  auto_page_call_hold_s: 8       # never auto-switch while a call banner is up
input:
  double_press_ms: 350
  long_press_ms: 800
  bounce_ms: 60
  response_window_s: 3.0   # seconds after a call finishes speaking
  say_again: false          # a late single press does nothing
  say_again_window_s: 30.0  # "say again" only repeats a call spoken this recently
  quiet_minutes: 5
  spoken_replies: true      # pit wall answers a press: "Copy." / "Noted." or the rule's on_ack/on_neg
  bookmark_replies: ["Marked."]
  udp_action_bit: 0x00100000
  long_press: silent        # hold UDP Action 1 (>= long_press_ms): radio silent on/off; "bookmark" to mark instead
  silent_toggle_bit: 0            # dedicated radio-silent toggle; 0 disables
  silent_keeps_p1: true     # urgent (P1) calls still speak while silent
  mindset_toggle_bit: 0x01000000  # UDP Action 5 (stick left): balanced <-> aggressive; 0 disables
  page_cycle_bit: 0x00800000      # UDP Action 4 (stick right): next dashboard page; 0 disables
  # Driver menu (docs/12, menu.yaml): Up/Down open + scroll, Action 1 confirms while open.
  menu_up_bit: 0x00200000         # UDP Action 2 (stick up); 0 disables
  menu_down_bit: 0x00400000       # UDP Action 3 (stick down); 0 disables
  menu_close_bit: 0               # dedicated close button; 0 disables
  menu_open_actions:              # while the menu is open: stick right confirms, left closes
    page: confirm
    mindset: close
  shortcuts:                      # Stream Deck taps: ask one menu item directly
    - {bit: 0x02000000, item: pit}        # UDP Action 6: Pit now?
    - {bit: 0x04000000, item: push}       # UDP Action 7: push or save
    - {bit: 0x08000000, item: fight}      # UDP Action 8: fight + pace briefing
    - {bit: 0x10000000, item: understeer} # UDP Action 9: understeer
    - {bit: 0x20000000, item: oversteer}  # UDP Action 10: oversteer
    - {bit: 0x40000000, item: budget}     # UDP Action 11: radio calls
    - {bit: 0x80000000, item: mindset}    # UDP Action 12: mindset
  negative_mute_laps: 3
