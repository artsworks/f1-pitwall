connection:
  udp_host: "0.0.0.0"
  udp_port: 20777
  send_rate_hz: 30
  http_host: "0.0.0.0"
  http_port: 8000
recording:
  enabled: true
  directory: recordings
  profile: lite  # full | lite | minimal (docs/adr/0006); `pitwall start --record full` overrides
  compress_on_close: true
engine:
  tick_hz: 10
persistence:
  enabled: true
  path: ~/.pitwall/pitwall.sqlite

  ema_fast_s: 3.0
  ema_slow_s: 30.0
  straight_hold_s: 1.0
  staleness_s:
    session: 2.0
    lap_data: 0.5
    car_telemetry: 0.5
    car_status: 0.5
    car_damage: 0.5
    motion_ex: 0.5
    participants: 15.0
    car_setups: 5.0
    session_history: 5.0
    tyre_sets: 5.0
    car_telemetry_2: 1.0
policy:
  verbosity: normal
  deadlines_s:
    1: 5.0
    2: 3.0
    3: 1.5
  calls_per_lap: 4
  min_gap_s: 3.0
  dedupe_window_s: 20.0
  quiet: false
  mute_until_lap: 0
speech:
  enabled: true
  engine: "auto"          # auto = piper if its voice is downloaded, else sapi (Windows)
  voice: null             # SAPI voice name filter
  piper_voice: "en_GB-northern_english_male-medium"
  piper_speed: 1.3        # >1 faster; 1.0 = voice natural pace
  voices_dir: "voices"
  rate: 0
  volume: 100
  radio_click: true # soft radio blip before each call
mindset:
  active: balanced
ui:
  state_hz: 5
input:
  double_press_ms: 350
  long_press_ms: 800
  bounce_ms: 60
  response_window_s: 8.0
  say_again_window_s: 30.0  # "say again" only repeats a call spoken this recently
  quiet_minutes: 5
  udp_action_bit: 0x00100000
  negative_mute_laps: 3
