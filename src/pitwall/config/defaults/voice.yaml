# Driver -> pit wall voice channel (docs/21). The recogniser chooses from this
# closed grammar. The mic listens while the driver menu is open or after V.
# Action 1 keeps its doc-12 gestures.
voice:
  enabled: false
  engine: sapi
  recognizer: ""          # "" = first installed SAPI recogniser (see `pitwall voice devices`)
  device: 0
  early_close_ms: 300
  close_silence_ms: 1000
  max_open_s: 6.0
  key_max_open_s: 2.0
  open_warn_s: 3.0
  confidence_min: 0.7
  priority: below_normal
  affinity_mask: 0
  intents:
    tyres: ["tyres", "how are the tyres", "tyres gone", "are the tyres gone", "tyre wear"]
    pit: ["pit now", "should I pit", "box now", "do we box", "should I box", "plan", "what's the plan", "strategy", "what's the strategy"]
    fight: ["fight", "fight briefing", "battle", "who am I fighting", "gap ahead", "gap in front", "what's the gap", "gap to the car ahead", "gap behind", "who's behind", "gap to the car behind", "race stat", "status", "how are we doing"]
    push: ["push or save", "can I push", "should I save", "fuel", "fuel check", "how's the fuel", "fuel okay"]
    rain: ["rain", "is rain coming", "weather", "how's the weather"]
    understeer: ["understeer", "car is understeering", "I have understeer"]
    oversteer: ["oversteer", "car is oversteering", "I have oversteer"]
    budget: ["radio calls", "call budget", "calls per lap"]
    ack: ["copy", "copy that", "understood", "got it"]
    neg: ["negative", "no way"]
    say_again: ["say again", "repeat that"]
    silent: ["radio silent", "radio silence", "quiet please"]
    mindset_aggressive: ["go aggressive", "attack mode"]
    mindset_balanced: ["go balanced", "calm down"]
    mindset: ["mindset", "change mindset", "toggle mindset"]
    page: ["next page", "change page"]
