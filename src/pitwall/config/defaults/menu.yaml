# Driver -> pit wall menu (docs/12). Up/Down (UDP Action 2/3) open and scroll,
# UDP Action 1 confirms, and a double press closes.
# Down from closed opens on the first item. Up opens on the last scroll item.
# Shortcut-only items stay out of the scroll list.
# Replies are deterministic templates (ADR 0008): the case is picked from the
# snapshot, variants rotate. Placeholders: see pitwall.input.menu.TEMPLATE_KEYS.
# The list is situational: on open, items whose `show_when` is false are hidden
# and those whose `rank_when` holds move to the top (rule expressions on the
# snapshot). Shortcut-only items use a dedicated button or voice command.
# Stick right still cycles pages.
menu:
  enabled: true
  timeout_s: 6.0
  speak_on_scroll: true
  wrap: true
  opinion_hold_laps: 5
  budget_steps: [4, 8, 12, 20]  # "Radio calls" item cycles the calls-per-lap limit
  items:
    - id: tyres
      label: "Tyres gone?"
      rank_when: "laps_of_pace < 4 or wear_max_pct >= 55 or tyre_switch_to != ''"
      related_rules:
        - tyre_life
        - tyre_overheat
        - tyre_overheat_wet
        - tyre_switch
        - tyre_graining
        - tyre_blister
        - wear_front_left
        - wear_front_right
        - wear_rear_left
        - wear_rear_right
        - wear_fronts
        - wear_rears
      replies:
        switch: ["Field says {to}. Box for {to}.", "{to} are quicker now. Box, box."]
        gone: ["Yes, they're done. Worst one {wear} percent.", "They're gone. Box when you can."]
        fading: ["Fading. Worst one {wear} percent, {pace_laps} laps left.", "Dropping off, {pace_laps} laps left in them."]
        ok: ["Tyres are fine. Worst one {wear} percent.", "Still good. {pace_laps} laps of pace."]
        unknown: ["No tyre read yet.", "Not enough data yet."]
    - id: pit
      label: "Pit now?"
      show_when: "session_kind == 'race'"
      rank_when: "pit_window_start > 0 and pit_window_start <= lap_num <= pit_window_end"
      related_rules:
        - plan_announce
        - plan_announce_no_stop
        - plan_status
        - plan_switch
        - plan_switch_no_stop
        - plan_window_open
        - plan_target_lap
        - box_now
        - box_in_n
        - overcut_stay_out
        - plan_sc_box
      replies:
        box_now: ["Yes, box this lap. {reason}.", "Box, box. {reason}."]
        soon:
          - "Not yet. Box in {in_laps}, lap {plan_lap}."
          - "Stay out, box lap {plan_lap}."
          - "Stay out, box lap {plan_lap}. Window {window}."
        stay_out: ["No, stay out. {reason}.", "Negative, stay out."]
        no_stop:
          - "No stop. Tyres make the end."
          - "Stay out to the end. {laps_left} to go."
        tyres_short: ["Yes, box. Tyres have {pace_laps} laps, {laps_left} to go.", "Box, box. Worst tyre {wear} percent, won't last."]
        box_fight: ["Box. Stop costs {loss}, fresh tyres gain {gain}.", "Yes, box. {gain} back for {loss}. Then attack."]
        damage_review: ["Wing {wing} percent. Box if it won't turn.", "Wing {wing} percent. Stay out unless it won't turn."]
        damage_nurse: ["Wing {wing} percent. Too late to stop, nurse it.", "Wing {wing} percent. Stay out, protect the car."]
        hold: ["Stay out. Stop costs {loss}, only {gain} back. Hold P{pos}.", "Negative, hold P{pos}. Tyres make the end."]
        unknown: ["No plan yet. Stay out.", "Still working on it. Stay out."]
    - id: fight
      label: "Fight"
      rank_when: "battle_mode in ('attacking', 'defending')"
      related_rules:
        - overtake_earned
        - overtake_lost
        - overtake_mode
        - battle_catching
        - battle_attack
        - battle_patience
        - battle_defend
        - battle_under_threat
        - battle_manage
        - battle_passed
        - battle_held
        - battle_lost
        - battle_swap_ahead
        - battle_swap_behind
        - battle_scrap
        - teammate_fight
      replies:
        both: ["{ahead} {behind}"]
        ahead: ["{ahead} Clear behind.", "{ahead} Nobody behind."]
        behind: ["Clear ahead. {behind}", "Nobody ahead. {behind}"]
        none: ["P{pos}, {laps_left} to go. Clear air."]
        times: ["P{pos} on the times. Best lap {best}."]
        no_time: ["No clean lap on the board yet."]
        unknown: ["No timing yet.", "Still waiting on timing."]
    - id: overtake
      label: "Overtake?"
      show_when: "session_kind == 'race'"
      rank_when: "overtake_available or overtake_zone_ahead"
      related_rules:
        - overtake_earned
        - overtake_lost
        - overtake_mode
        - battle_attack
      replies:
        active: ["Overtake on. {name} {gap} ahead.", "Overtake's live, {gap} to {name}."]
        earned: ["Overtake earned on {name}, {gap}. Next straight.", "Yes, overtake next straight. {gap} to {name}."]
        losing: ["Overtake ends this straight. {gap} to {name}, get inside a second.", "Last overtake for now. {gap} to {name}, close in."]
        "off": ["No overtake. {gap} to {name}, get inside a second.", "Not yet. {gap} to {name}, need under a second."]
        clear: ["Nobody ahead. No overtake to earn.", "Clear ahead, no overtake."]
        unknown: ["No overtake data.", "No overtake read yet."]
    - id: battery
      label: "Battery?"
      rank_when: "overtake_available or overtake_zone_ahead"
      related_rules:
        - energy_over
        - energy_under
        - energy_charge_for_battle
        - energy_burst
        - overtake_mode
      replies:
        over: ["Battery {battery} percent, {mj} MJ over. Harvest more.", "{mj} MJ over this lap. Battery {battery} percent, harvest."]
        under: ["Battery {battery} percent, {mj} MJ spare. Deploy more.", "{mj} MJ unused. Battery {battery} percent, deploy."]
        attack: ["Battery {battery} percent, spare to attack. Deploy.", "Battery's there, {battery} percent. Deploy on the straight."]
        ok: ["Battery {battery} percent, on budget.", "On budget. Battery {battery} percent."]
        unknown: ["No battery read yet.", "Not enough energy data yet."]
    - id: rain
      label: "Rain coming?"
      show_when: "rain_pct_in_30 > 0 or weather_crossover != '' or weather_now >= 3"
      rank_when: "tyre_switch_to != '' or (weather_crossover != '' and not ((weather_crossover == 'to_inter' and tyre_compound == 7) or (weather_crossover == 'to_wet' and tyre_compound == 8)))"
      related_rules:
        - weather_to_inter
        - weather_to_wet
        - weather_to_dry
      replies:
        switch: ["Box for {to}. The field's quicker on them.", "{to} are the tyre now. Box this lap."]
        right_tyre: ["You're on the right tyre. Stay out.", "{tyre} are right. Stay out, we'll call it."]
        crossover: ["{to} coming. Not yet, we'll call it.", "{to} coming. Stay out for now."]
        coming: ["Rain coming. {in10} percent in ten.", "Yes, {in30} percent in thirty."]
        chance: ["Maybe. {in10} percent in ten.", "Small chance, {in30} percent."]
        dry: ["No, staying dry.", "Dry. No rain expected."]
    - id: push
      label: "Push or save?"
      show_when: "session_kind == 'race'"
      related_rules:
        - fuel_short
        - fuel_marginal
        - fuel_spare
        - energy_over
        - energy_under
        - boost_left_on
        - ers_fault
        - plan_push
        - plan_push_now
        - plan_cool
        - cool_recharge
        - cool_recharge_check
      replies:
        save_fuel: ["Save fuel. Short {margin} laps.", "Save. Lift and coast."]
        save_energy: ["Save battery. Harvest this lap.", "Save energy, you're over."]
        save_tyres: ["Save the tyres.", "Manage tyres, long way to go."]
        fuel_tight: ["Push, fuel's tight. Plus {margin} laps."]
        attack: ["Push. {gap} to the car ahead.", "Attack now."]
        push: ["Push. Nothing to save.", "Free to push."]
    - id: budget
      label: "Radio calls"
      shortcut_only: true
      kind: action
      action: budget
      replies:
        default: ["Copy, up to {budget} calls a lap.", "Understood, {budget} calls a lap."]
    - id: understeer
      label: "Understeer"
      shortcut_only: true
      kind: opinion
      topic: balance
      replies:
        default: ["Copy, understeer. Bias back one, to {bias_to}.", "Understeer. Try bias {bias_to}, lower entry diff."]
        no_bias: ["Copy, understeer. Try bias back one.", "Understeer noted."]
    - id: oversteer
      label: "Oversteer"
      shortcut_only: true
      kind: opinion
      topic: balance
      replies:
        default: ["Copy, oversteer. Bias forward one, to {bias_to}.", "Oversteer. Try bias {bias_to}, ease the diff."]
        no_bias: ["Copy, oversteer. Try bias forward one.", "Oversteer noted."]
    - id: mindset
      label: "Mindset"
      shortcut_only: true
      show_when: "session_kind == 'race'"
      kind: action
      action: mindset
    - id: silent
      label: "Radio silent"
      shortcut_only: true
      kind: action
      action: silent
