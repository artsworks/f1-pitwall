thresholds:
  # Lift and coast / PU thermal management
  # Temperature thresholds are unverified against recordings.
  engine_temp_warn_c: 128
  engine_temp_clear_c: 123
  brake_temp_warn_c: 1000
  brake_temp_clear_c: 900
  pu_dirty_air_gap_s: 1.0
  pu_wear_warn_pct: 60
  pu_wear_clear_pct: 55
  # Race-end and formation-lap radio
  formation_min_speed_kmh: 10
  formation_brakes_cold_c: 200
  race_cool_down_delay_s: 8
  race_cool_down_min_speed_kmh: 10
  # Setup advisor A1 detector thresholds
  trac_slip: 0.08
  trac_throttle: 0.7
  trac_min_kmh: 60
  trac_max_kmh: 200
  trac_min_s: 0.15
  slip_bal_lat_g: 1.5
  slip_bal_throttle_min: 0.2
  slip_bal_throttle_max: 0.8
  snap_entry_throttle: 0.2
  snap_exit_throttle: 0.5
  setup_settle_s: 3
  setup_min_run_laps: 6
  setup_min_event_laps: 2
  setup_wear_axle_ratio: 1.06
  setup_z_band: 0.3
  setup_slip_us_deg: 0.5
  setup_slip_os_deg: 0.5
  setup_trac_per10: 15
  setup_snaps_per10: 1.2
  setup_lockups_rear_per10: 2
  setup_min_events: 2
  setup_rec_cooldown_laps: 5
  setup_base_min_weight: 1.0
  setup_learned_min_weight: 3.0
  setup_grade_min_laps: 5
  setup_grade_track_temp_c: 5
  setup_grade_tol: 0.03
  tyre_inner_cold_c: 80
  tyre_inner_hot_c: 110
  tyre_inner_cold_by_compound_c: {7: 60, 8: 50, 16: 70, 17: 75, 18: 80, 19: 85, 20: 90, 21: 90, 22: 65}
  tyre_inner_hot_by_compound_c: {7: 85, 8: 80, 16: 90, 17: 100, 18: 105, 19: 115, 20: 115, 21: 125, 22: 85}
  tyre_window_min_width_c: 15  # narrower learned bands are widened around their centre
  pressure_window_inset_c: 5
  cool_tyre_hot_margin_c: 1
  front_wing_damage_warn_pct: 15
  boost_warn_s: 3          # boost continuously on for this long...
  boost_warn_brake: 0.3    # ...and the driver brakes
  boost_warn_lift: 0.5     # ...or lifts for a corner
  yellow_warn_ahead_m: 800
  yellow_info_behind_m: 1500
  release_clean_gap_s: 4.0   # gap needed both ways at pit exit for "clean air"
  release_out_lap_s: 0       # 0 = derive: 1.3 x player's best, else fallback
  release_fallback_lap_s: 95.0
  release_garage_settle_s: 10  # seconds in the garage before release calls
  release_closing_s: 30
  out_lap_factor: 1.3        # out lap vs best lap, for "time to start a lap"
  out_lap_pit_s: 40          # garage -> line overhead; Q3 final run: released at 114 s left, flag beat it
  pit_exit_m: 0.0            # lap distance of pit exit (per-track overlay later)
  quali_advance: {5: 15, 6: 10, 7: 0}  # cars through to the next session; 0 = no cut
  abort_safe_margin_ms: 300  # inside this margin of the cut-off = "through"
  quali_through_open_margin_ms: 500  # extra cushion for "through" while rivals can still improve
  quali_through_open_window_s: 300  # extra cushion shrinks to 0 over the last this-many seconds
  abort_deficit_ms: 400      # projected deficit that justifies an abort call
  abort_ers_keep_pct: 60     # ERS above this -> abort earlier (banked for next run)
  quali_safe_margin_ms: 1000 # clear of the cut / P2 by this much = "play it safe"
  pressure_window_low_c: 88  # target carcass (inner) temp window over a flying run
  pressure_window_high_c: 102
  pressure_hot_sign: 1       # +1: hot tyre -> raise (game: lower pressure runs hotter); -1: lower
  pressure_front_min_psi: 22.5  # setup range; advice is clamped to it (0 = unknown)
  pressure_front_max_psi: 29.5
  pressure_rear_min_psi: 20.5
  pressure_rear_max_psi: 26.5
  pressure_size_medium_c: 3  # degrees outside the window for a medium step
  pressure_size_large_c: 6  # ...and for a large step
  pressure_step_small_psi: 0.5
  pressure_step_medium_psi: 1.0
  pressure_step_large_psi: 1.5
  pressure_step_cap_pct_of_range: 50  # one call moves at most this % of the axle pressure range
  setup_scale_aero: 2
  setup_scale_differential: 2
  setup_scale_brakes: 1
  setup_scale_suspension_geometry: 2
  setup_scale_suspension: 2
  setup_scale_tyres: 1  # pressure advisor recs only; tyre size comes from pressure_* keys
  pressure_min_flying_s: 30  # flying time a run needs before advising
  rejoin_traffic_s: 6        # after a spin: car behind closing within this = hold
  pit_exit_traffic_s: 4      # just out of the pit lane: car behind closing within this
  rival_pit_gap_s: 5.0       # only announce the car ahead pitting when it was this close
  prep_gap_m: 800            # out-lap: talk about the gap this far before the line
  prep_traffic_s: 3          # slow car ahead within this (at push pace) = traffic
  traffic_gap_s: 1.5         # race lap within this of the car ahead for most of the lap = traffic
  deg_quad_min_laps: 8       # minimum clean laps for a quadratic degradation fit
  deg_quad_min_t: 2.0        # minimum quadratic coefficient significance in standard errors
  plan_mc_sims: 500          # simulations for pit plan agreement
  plan_mc_risk_quantile: 0.8  # downside quantile for the risk-averse stop lap
  plan_mc_sc_prob_per_lap: 0.03  # safety-car chance per candidate lap
  plan_mc_deg_sd_frac: 0.15  # minimum degradation sampling spread
  plan_mc_pit_loss_sd_s: 1.5 # pit-loss sampling spread without history
  tow_min_s: 0.7             # push-lap car ahead inside this = dirty air
  tow_max_s: 2.0             # ...between min and max = a tow
  prep_clear_s: 5            # nothing ahead within this = clear
  prep_behind_s: 4           # push-lap car behind closing within this = let it by
  # Team orders (docs/research/team-orders.md)
  teammate_hold_laps: 3   # hold position with the teammate ahead in the last N laps
  teammate_split_age_laps: 5   # tyre-age offset (and min stint age) that counts as a different strategy
  # Run plan / cool-down lap (docs/17)
  cool_ers_min_pct: 40       # battery floor at the line to push; raised to what the last hot lap spent
  cool_wet_ers_min_pct: 20   # inters/wets: battery floor at the line to push; a wet hot lap spends ~3-10% (Brazil wet quali)
  cool_ers_need_max_pct: 70  # cap on the learned battery need
  # Interlagos quali recordings: hot laps burn 0.92-1.01 laps. Cool laps
  # burn 0.87-0.95. Require fuel for one hot lap or cool + hot at the line.
  plan_damage_wing_pct: 15  # wing damage that rebuilds strategy plans
  plan_damage_pace_ms: 1500 # valid green lap deficit that rebuilds plans
  plan_rebuild_max_lap: 2   # last lap for incident position-loss rebuilds
  plan_rebuild_positions_lost: 3 # places lost from the grid to rebuild plans
  damage_pace_ms_per_wing_pct: 20 # current-set lap penalty per wing damage point
  damage_tyre_pace_ms: 1500 # tyre damage penalty before a valid measured lap
  pit_wing_change_s: 5.0    # extra pit loss to replace a damaged wing
  fuel_push_need_laps: 1.1   # one more hot lap
  fuel_cool_need_laps: 2.1   # cool + hot lap
  slow_car_warn_s: 5         # hot lap: warn when a slow car ahead is this many seconds from being caught
  slow_car_delta_kmh: 60     # a flying-lap car this much slower counts as slow too
  slow_car_crawl_kmh: 40     # car ahead this slow with all wheels on tarmac or kerb counts as crawling
  cool_tyre_hot_c: 104       # hottest carcass at the line at or above this -> cool
  cool_lap_factor: 1.3       # cool lap length as a multiple of the best lap
  cool_pace_pct: 10          # sector 1 this much slower than best = driver is cooling
  cool_push_check_m: 400     # minimum distance before checking for push pace on a cool lap
  cool_push_throttle_share: 0.4 # minimum full-throttle sample share for a push check
  cool_hot_mode_m: 600       # metres before the line to switch back to hot-lap mode
  cool_car_behind_s: 3       # car on a hot lap this close behind -> get off the line
  ers_recharge_mode: 0       # ers_deploy_mode value for recharge (Q3 recording: battery only rises in 0); -1 = don't check
  cool_recharge_full_pct: 95 # battery at or above this on a cool lap: stop asking for recharge mode
  # Track-limit escalation chain
  track_limits_flag_warnings: 3 # initial black-and-white warning, next offence brings a penalty
  # SC/VSC restart procedures (sc-restart)
  sc_delta_warn_s: -0.1   # SC/VSC delta below this is too fast (penalty risk)
  sc_delta_clear_s: 0.3   # re-arm once the delta is back above this
  # Weather radar and slick/inter crossover calls (docs/research/weather-crossover.md)
  rain_heads_up_pct: 40      # forecast rain chance for the early heads-up (below rain_inter_pct)
  rain_heads_up_max_min: 15  # heads-up looks only at forecast samples up to this many minutes ahead
  track_trend_s: 1.0         # field median lap-over-lap change that counts as wetter or drier
  track_trend_min_cars: 3    # rival cars with a clean lap pair needed for a field trend
  crossover_warn_laps: 3     # projected laps to the lap-time crossover that trigger the heads-up
  crossover_rate_min_s: 0.3  # closing rate per lap below this gives no projection
