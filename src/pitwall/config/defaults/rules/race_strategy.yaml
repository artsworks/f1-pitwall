rules:
  - id: setup_bias
    sessions: [race]
    priority: 3
    urgency: coaching
    when: "setup_call_param == 'brake_bias'"
    clear_when: "setup_call_param == ''"
    cooldown_s: 300
    requires: [lap_data, car_status]
    say:
      - "Bias is on {setup_call_from:.0f}. Try {setup_call_to:.0f}, {setup_call_reason}."
      - "{setup_call_reason}. Bias from {setup_call_from:.0f} to {setup_call_to:.0f}."
      - "Move bias {setup_call_from:.0f} to {setup_call_to:.0f}. {setup_call_reason}."
      - "{setup_call_reason}. Set bias {setup_call_to:.0f}, from {setup_call_from:.0f}."
  - id: setup_on_throttle
    sessions: [race]
    priority: 3
    urgency: coaching
    when: "setup_call_param == 'on_throttle'"
    clear_when: "setup_call_param == ''"
    cooldown_s: 300
    requires: [lap_data, car_setups]
    say:
      - "On-throttle diff is on {setup_call_from:.0f}. Try {setup_call_to:.0f}, {setup_call_reason}."
      - "{setup_call_reason}. On-throttle diff from {setup_call_from:.0f} to {setup_call_to:.0f}."
      - "On-throttle diff {setup_call_from:.0f}. Set {setup_call_to:.0f}, {setup_call_reason}."
      - "{setup_call_reason}. Change on-throttle diff from {setup_call_from:.0f} to {setup_call_to:.0f}."
  - id: setup_stop_wing
    sessions: [race]
    priority: 3
    urgency: coaching
    when: "setup_stop_wing_to > 0"
    clear_when: "setup_stop_wing_to <= 0"
    cooldown_s: 600
    requires: [lap_data, car_setups]
    say:
      - "Front wing {setup_stop_wing_to:.0f} at the stop, from {setup_stop_wing_from:.0f}. Set it in the pit menu."
      - "Set front wing to {setup_stop_wing_to:.0f} at the stop, from {setup_stop_wing_from:.0f}. Use the pit menu."
  # Named strategy plans A/B/C (docs/03 "Strategy plans"). The engine's plan
  # tracker owns the plan state; these rules only phrase it. plan_sc_box sits
  # after box_now in the pit group: it speaks only when box_now is gated out.
  - id: plan_switch
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and plan_switch_reason == 'pace' and plan_switch_lap == lap_num and plan_stops_left > 0"
    clear_when: "plan_switch_lap != lap_num"
    cooldown_s: 30
    cooldown_group: plan_switch
    requires: [lap_data]
    say:
      - "Plan {active_plan} now. {plan_spoken}, lap {plan_target_lap}"
      - "Going Plan {active_plan}. {plan_spoken}, lap {plan_target_lap}"
      - "New plan, {active_plan}. {plan_spoken}. Target lap {plan_target_lap}"
      - "Switch to Plan {active_plan}. {plan_spoken}, lap {plan_target_lap}"
      - "Plan change, {active_plan}. {plan_spoken}. Target lap {plan_target_lap}"
      - "Plan {active_plan} from here. {plan_spoken}, lap {plan_target_lap}"
  - id: plan_switch_no_stop
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and plan_switch_reason == 'pace' and plan_switch_lap == lap_num and plan_stops_left == 0"
    clear_when: "plan_switch_lap != lap_num"
    cooldown_s: 30
    cooldown_group: plan_switch
    requires: [lap_data]
    say:
      - "Plan {active_plan}, {plan_spoken}. No more stops, save tyres"
      - "Change of plan, we're not stopping. {plan_spoken}"
      - "Plan {active_plan} now, {plan_spoken}. Tyres go to the flag"
      - "Plan {active_plan}, {plan_spoken}. No stop now, look after the tyres"
      - "We're staying out. {plan_spoken}, tyres to the flag"
      - "Plan {active_plan} from here, {plan_spoken}. No more stops"
  # A wrong tyre at the stop shows here on the lap after the out lap. Telemetry does
  # not expose the MFD pit-menu tyre choice, so nothing can catch it before the stop.
  # The dashboard EXECUTION card shows the planned tyre as a cross-check before the
  # stop and a FITTED/EXPECTED warning on the out lap.
  - id: plan_invalid
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and plan_switch_reason == 'invalid' and plan_switch_lap == lap_num"
    clear_when: "plan_switch_lap != lap_num"
    cooldown_s: 30
    cooldown_group: plan_switch
    requires: [lap_data]
    say:
      - "We're off Plan {plan_switched_from}. Plan {active_plan}, {plan_spoken}"
      - "Now off Plan {plan_switched_from}. Plan {active_plan}, {plan_spoken}"
      - "Going off Plan {plan_switched_from}. Plan {active_plan}, {plan_spoken}"
      - "Plan {plan_switched_from} is out. Now Plan {active_plan}, {plan_spoken}"
      - "Switching from Plan {plan_switched_from} to Plan {active_plan}. {plan_spoken}"
      - "New call, Plan {active_plan}. {plan_spoken}, leaving Plan {plan_switched_from}"
  - id: plan_off
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and active_plan != '' and not on_plan and plan_off_s >= th.plan_off_s"
    clear_when: "on_plan"
    cooldown_s: 90
    cooldown_group: plan_switch
    requires: [lap_data]
    say:
      - "Off Plan {active_plan}, losing {plan_off_s:.0f} seconds. Reviewing"
      - "Plan {active_plan} costs {plan_off_s:.0f} seconds. New plan coming"
      - "Off Plan {active_plan} by {plan_off_s:.0f} seconds. Checking"
      - "Plan {active_plan}, {plan_off_s:.0f} seconds off. Not ideal, reviewing"
      - "Losing {plan_off_s:.0f} seconds on Plan {active_plan}. Reworking it"
      - "Plan {active_plan}, {plan_off_s:.0f} seconds lost. New plan coming"
  - id: plan_announce
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and active_plan == 'A' and plan_switch_count == 0 and plan_stops_left > 0 and (lap_num > 1 or lap_distance > th.plan_announce_after_m)"
    clear_when: "active_plan == ''"
    cooldown_s: 30
    cooldown_group: plan
    requires: [lap_data]
    say:
      - "Plan A, {plan_spoken}. Window {plan_window_start} to {plan_window_end}. Plan B, {plan_b_spoken}"
      - "Plan A is {plan_spoken}, target lap {plan_target_lap}. Plan B, {plan_b_spoken}"
      - "Plan A, {plan_spoken}. Plan B, {plan_b_spoken}"
      - "Plan A, {plan_spoken}, window {plan_window_start} to {plan_window_end}. Plan B, {plan_b_spoken}"
      - "Plan A, {plan_spoken}, target lap {plan_target_lap}. Plan B, {plan_b_spoken}"
      - "Plan A, {plan_spoken}. Plan B backup, {plan_b_spoken}"
  - id: plan_announce_no_stop
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and active_plan == 'A' and plan_switch_count == 0 and plan_stops_left == 0 and num_pit_stops == 0 and (lap_num > 1 or lap_distance > th.plan_announce_after_m)"
    clear_when: "active_plan == ''"
    cooldown_s: 30
    cooldown_group: plan
    requires: [lap_data]
    say:
      - "We're on Plan A, {plan_spoken}. We're going long"
      - "Plan A, {plan_spoken}. Look after the tyres"
      - "Plan A, {plan_spoken}. Tyres go the distance"
      - "Plan A, {plan_spoken}. Long run, look after the tyres"
      - "Plan A, {plan_spoken}. Long race, bring her home"
      - "Plan A, {plan_spoken}. Make the tyres last"
  - id: plan_status
    sessions: [race]
    priority: 3
    when: "phase == 'racing' and active_plan != '' and on_plan and plan_stops_left > 0 and sector == 1 and lap_num >= 2 and lap_num % th.plan_status_every_laps == 0 and lap_num < plan_window_start"
    clear_when: "sector != 1"
    cooldown_s: 60
    cooldown_group: plan
    requires: [lap_data]
    say:
      - "Still on Plan {active_plan}, window laps {plan_window_start} to {plan_window_end}"
      - "We're on Plan {active_plan}. Target lap {plan_target_lap}"
      - "Plan {active_plan} still good, window {plan_window_start} to {plan_window_end}"
      - "Plan {active_plan} remains. Window {plan_window_start} to {plan_window_end}"
      - "Plan {active_plan} is unchanged. Target lap {plan_target_lap}"
      - "No change, Plan {active_plan}. Window {plan_window_start} to {plan_window_end}"
  - id: plan_window_open
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and plan_window_open and on_plan and plan_target_lap > lap_num and (lap_num > 1 or lap_distance > th.plan_announce_after_m)"
    clear_when: "not plan_window_open"
    cooldown_s: 60
    cooldown_group: plan
    requires: [lap_data]
    say:
      - "Pit window is open. Plan {active_plan}, target lap {plan_target_lap}"
      - "Window open. We're targeting lap {plan_target_lap}, Plan {active_plan}"
      - "Window's open. Lap {plan_target_lap}, Plan {active_plan}"
      - "Open window now. Plan {active_plan}, target lap {plan_target_lap}"
      - "Pit window open, Plan {active_plan}. Aim for lap {plan_target_lap}"
      - "Window's open for Plan {active_plan}. Target lap {plan_target_lap}"
  # {plan_next_compound} is the planned tyre, not the MFD pit-menu choice (not in telemetry).
  - id: plan_target_lap
    sessions: [race]
    priority: 1
    urgency: tactical
    when: "phase == 'racing' and on_plan and plan_stops_left > 0 and plan_target_lap == lap_num and laps_remaining > th.pit_min_laps_left"
    clear_when: "plan_target_lap != lap_num"
    still_true: "phase == 'racing' and plan_target_lap == lap_num"
    cooldown_s: 45
    cooldown_group: pit
    requires: [lap_data]
    say:
      - "Target lap. Plan {active_plan}, box box, {plan_next_compound}s"
      - "Target lap. Box, {plan_next_compound}s, Plan {active_plan}"
      - "Box box, box box. Plan {active_plan}, {plan_next_compound}s"
      - "Target lap. Plan {active_plan}, box for {plan_next_compound}s"
      - "Box this lap. Plan {active_plan}, fit {plan_next_compound}s"
      - "Pit now for {plan_next_compound}s. Plan {active_plan}"
    on_ack:
      - "Copy, box this lap"
      - "Understood, box this lap"
    on_neg:
      - "Understood, extend. We'll look again next lap"
      - "Copy, extend one lap. We'll review next time round"
  # Pit calls read the optimiser's plan (docs/18). The gate fields sit in
  # `when` so the prediction and its confidence land in the decision log.
  - id: box_now
    sessions: [race]
    priority: 1
    urgency: execution
    decision_point: pit_entry
    outcome_score: "pit_plan_gain_s - pit_plan_risk"
    conflict_group: pit_or_stay
    supersedes: [box_in_n]
    contradicts: [weather_to_inter, weather_to_wet, weather_to_dry, battle_held, tyre_life]
    when: "phase in ('racing', 'sc', 'vsc') and pit_plan in ('box_now', 'cheap_stop', 'free_stop', 'undercut') and (pit_plan_confidence >= mode.pit_confidence_min or laps_of_pace < 1) and pit_plan_risk <= mode.position_loss_risk_max and pit_plan_gain_s >= 0 and laps_remaining > th.pit_min_laps_left"
    clear_when: "phase not in ('racing', 'sc', 'vsc') or pit_plan not in ('box_now', 'cheap_stop', 'free_stop', 'undercut')"
    still_true: "phase in ('racing', 'sc', 'vsc') and pit_plan in ('box_now', 'cheap_stop', 'free_stop', 'undercut')"
    cooldown_s: 45
    cooldown_group: pit
    requires: [lap_data, car_status]
    say:
      - "Box, box. Plan {active_plan}. {pit_plan_reason}, {pit_plan_gain_s:.1f} seconds"
      - "Plan {active_plan}, box this lap. {pit_plan_reason}"
      - "Box this lap, box this lap. Plan {active_plan}, {pit_plan_reason}"
      - "Box now. Plan {active_plan}, {pit_plan_reason}. Gain {pit_plan_gain_s:.1f} seconds"
      - "Plan {active_plan}, stop this lap. {pit_plan_reason}, {pit_plan_gain_s:.1f} seconds"
      - "Box, box. Plan {active_plan}, {pit_plan_reason}"
    on_ack:
      - "Copy, box this lap"
      - "Understood, box this lap"
    on_neg:
      - "Copy, staying out. Window {pit_window_start} to {pit_window_end}"
      - "Understood, stay out. Window {pit_window_start} to {pit_window_end}"
  - id: plan_sc_box
    sessions: [race]
    priority: 1
    urgency: execution
    decision_point: pit_entry
    when: "phase in ('sc', 'vsc') and active_plan == 'C' and plan_switch_reason == 'sc' and plan_switch_lap == lap_num and laps_remaining > th.pit_min_laps_left"
    clear_when: "active_plan != 'C' or plan_switch_lap != lap_num"
    still_true: "phase in ('sc', 'vsc') and active_plan == 'C'"
    cooldown_s: 45
    cooldown_group: pit
    requires: [lap_data]
    say:
      - "Plan C, box box. {plan_next_compound}s, cheap stop"
      - "Plan C, Plan C. Box this lap for {plan_next_compound}s"
      - "Box box, Plan C. Cheap stop, {plan_next_compound}s"
      - "Plan C stop. Box this lap for {plan_next_compound}s, cheap"
      - "Cheap stop now. Plan C, fit {plan_next_compound}s"
      - "Box this lap, Plan C. {plan_next_compound}s, low-cost stop"
    on_ack:
      - "Copy, Plan C, box this lap"
      - "Understood, Plan C. Box this lap"
    on_neg:
      - "Understood, staying out. Plan {plan_switched_from} stays open"
      - "Copy, stay out. Plan {plan_switched_from} remains open"
  # The game sends no teammate pit plan, so this uses teammate LapData.
  - id: double_stack
    sessions: [race]
    priority: 1
    urgency: execution
    decision_point: pit_entry
    when: "phase in ('racing', 'in_lap', 'sc', 'vsc') and teammate_stacking and (driver_status == 2 or pit_status != 0)"
    clear_when: "not teammate_stacking"
    cooldown_s: 90
    requires: [lap_data, participants]
    say:
      - "Double stack, {teammate_name} is in ahead. Hold in the lane, slow release"
      - "We're stacking behind {teammate_name}. Hold position in the pit lane, slow release"
      - "Double stack. {teammate_name} {teammate_stack_gap_s:.1f} seconds ahead into the box. Hold in the lane"
      - "{teammate_name} boxes {teammate_stack_gap_s:.1f} seconds ahead. Double stack, slow release"
  - id: box_in_n
    sessions: [race]
    priority: 2
    urgency: execution
    decision_point: line
    when: "phase == 'racing' and pit_plan == 'box_in_n' and pit_plan_confidence >= mode.pit_confidence_min and pit_plan_gain_s >= mode.pit_gain_min_s"
    clear_when: "pit_plan != 'box_in_n'"
    still_true: "pit_plan == 'box_in_n'"
    cooldown_s: 60
    cooldown_group: pit
    requires: [lap_data, car_status]
    say:
      - "Plan is box lap {pit_plan_lap}. Window {pit_window_start} to {pit_window_end}"
      - "We're looking at lap {pit_plan_lap} for the stop"
      - "Stop lap {pit_plan_lap}. Window {pit_window_start} to {pit_window_end}"
      - "Pit stop planned for lap {pit_plan_lap}. Window {pit_window_start} to {pit_window_end}"
      - "Box on lap {pit_plan_lap}. That's the current target"
      - "Targeting lap {pit_plan_lap} for the stop. Window {pit_window_start} to {pit_window_end}"
  - id: overcut_stay_out
    sessions: [race]
    priority: 2
    outcome_score: "overcut_s if laps_of_pace >= th.overcut_laps else -99"
    conflict_group: pit_or_stay
    when: "phase == 'racing' and pit_plan == 'overcut' and pit_plan_confidence >= mode.pit_confidence_min"
    clear_when: "pit_plan != 'overcut'"
    cooldown_s: 60
    cooldown_group: pit
    requires: [lap_data, session_history]
    say:
      - "{pit_plan_rival_name} has boxed. Stay out and push, overcut is on"
      - "{pit_plan_rival_name} pitted. Push now, we go long"
      - "{pit_plan_rival_name}'s in. Stay out, give me some quick laps"
      - "{pit_plan_rival_name} is in. Stay out, push on, overcut available"
      - "{pit_plan_rival_name} boxed. We stay out and push for the overcut"
      - "{pit_plan_rival_name} has stopped. Quick laps now, we're going long"
  - id: cover_box
    sessions: [race]
    priority: 1
    urgency: execution
    decision_point: pit_entry
    outcome_score: "pit_plan_gain_s"
    conflict_group: pit_or_stay
    supersedes: [box_in_n]
    when: "phase == 'racing' and pit_plan == 'cover' and pit_plan_confidence >= mode.pit_confidence_min and pit_plan_risk <= mode.position_loss_risk_max and laps_remaining > th.pit_min_laps_left"
    clear_when: "phase != 'racing' or pit_plan != 'cover'"
    still_true: "phase == 'racing' and pit_plan == 'cover'"
    cooldown_s: 45
    cooldown_group: pit
    requires: [lap_data, car_status]
    say:
      - "Cover the undercut. Box, box"
      - "{pit_plan_rival_name} has boxed. Cover it, box this lap"
      - "Box, box. Cover {pit_plan_rival_name}"
      - "Stop now, cover the undercut"
      - "{pit_plan_rival_name} is in. Box this lap and cover the undercut"
      - "Cover {pit_plan_rival_name}. Box this lap"
    on_ack:
      - "Copy, box this lap"
      - "Understood, box this lap"
    on_neg:
      - "Copy, staying out. Push, {pit_plan_rival_name} is on fresh tyres"
      - "Understood, stay out. Push on, {pit_plan_rival_name} has fresh tyres"
  - id: overcut_defend
    sessions: [race]
    priority: 1
    urgency: tactical
    outcome_score: "pit_plan_gain_s"
    conflict_group: pit_or_stay
    supersedes: [box_in_n]
    when: "phase == 'racing' and pit_plan == 'defend' and pit_plan_confidence >= mode.pit_confidence_min and laps_remaining > th.pit_min_laps_left"
    clear_when: "phase != 'racing' or pit_plan != 'defend'"
    still_true: "phase == 'racing' and pit_plan == 'defend'"
    cooldown_s: 60
    cooldown_group: pit
    requires: [lap_data]
    say:
      - "Stay out, extend. Their tyres need time, push now"
      - "{pit_plan_rival_name}'s in. Stay out and push, we keep the place"
      - "Stay out. {pit_plan_rival_name} needs a lap on those tyres, push now"
      - "Extend the stint. Their tyres need to come in, push now"
      - "{pit_plan_rival_name} has stopped. Stay out, push and hold the place"
      - "Stay out and extend. {pit_plan_rival_name} needs a lap on those tyres"
