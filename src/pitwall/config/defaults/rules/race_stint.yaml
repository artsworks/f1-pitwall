rules:
  - id: tyre_life
    sessions: [race]
    priority: 3
    brief: "{laps_of_pace:.0f} laps in the tyres"
    when: "phase == 'racing' and sector == 1 and laps_of_pace >= 1 and laps_of_pace < laps_remaining and laps_of_pace < th.tyre_life_speak_laps and lap_num % mode.rival_info_every_n_laps == 0"
    clear_when: "sector != 1"
    cooldown_s: 60
    requires: [lap_data, car_damage]
    say:
      - "About {laps_of_pace:.0f} laps left in the tyres"
      - "Tyre check, roughly {laps_of_pace:.0f} laps of pace in them"
      - "About {laps_of_pace:.0f} laps of pace left in this set"
    severity:
      - when: "laps_of_pace < 1.5"
        say:
          - "About a lap left in the tyres"
          - "Tyre check, roughly one lap of pace in them"
  - id: tyre_overheat
    sessions: [race]
    priority: 2
    when: "overheat and tyre_compound not in (7, 8)"
    clear_when: "not overheat"
    cooldown_s: 90
    requires: [car_telemetry]
    say:
      - "Tyres are running hot. Ease the slides"
      - "Temps are high, look after the rears"
      - "Tyre temps are climbing. Smooth on the throttle, fewer slides"
  - id: tyre_overheat_wet
    sessions: [race]
    priority: 2
    when: "overheat and tyre_compound in (7, 8)"
    clear_when: "not overheat"
    cooldown_s: 90
    requires: [car_telemetry]
    say:
      - "Tyres cooking. Find wet patches on the straights"
      - "Tyres overheating. Cool them off the dry line"
      - "Temps are high on these tyres. Use the wet bits to cool them"
  - id: tyre_switch
    sessions: [race]
    priority: 2
    when: "phase in ('racing', 'sc', 'vsc') and tyre_switch_to != '' and laps_remaining > 1"
    clear_when: "tyre_switch_to == ''"
    cooldown_s: 60
    requires: [lap_data]
    say:
      - "Box, box. {tyre_switch_to}. The field's quicker on them"
      - "Crossover. {tyre_switch_to} are the tyre, box this lap"
      - "Box this lap for {tyre_switch_to}. Confirm"
      - "Crossover. {tyre_switch_to} are quicker. Box, box"
  - id: tyre_switch_slicks_traffic
    sessions: [race]
    priority: 2
    when: "phase in ('racing', 'sc', 'vsc') and tyre_switch_to == 'slicks' and not pit_exit_clean and laps_remaining > 1"
    clear_when: "tyre_switch_to != 'slicks' or pit_exit_clean"
    cooldown_s: 60
    supersedes: [tyre_switch]
    requires: [lap_data]
    say:
      - "Box for slicks. Traffic at the exit, careful on cold tyres"
      - "Slicks this lap. You rejoin in traffic, easy on cold tyres"
  - id: tyre_graining
    sessions: [race]
    priority: 2
    when: "graining"
    clear_when: "not graining"
    cooldown_s: 90
    requires: [car_telemetry]
    say:
      - "Tyres are cold and graining. Work them, lean on the fronts"
      - "Graining. Load the fronts, it'll clean up"
      - "Graining on the tyres. Keep working them, it should come back"
  - id: tyre_blister
    sessions: [race]
    priority: 2
    when: "blister_max_pct >= th.blister_warn_pct"
    clear_when: "blister_max_pct < th.blister_warn_pct - th.blister_hysteresis_pct"
    cooldown_s: 120
    requires: [car_damage]
    say:
      - "Blistering at {blister_max_pct} percent. Manage the tyres"
      - "Blisters starting, {blister_max_pct} percent. Look after them"
      - "{blister_max_pct} percent blistering. Easy on the traction zones"
  - id: fuel_short
    sessions: [race]
    priority: 1
    urgency: tactical
    when: "phase == 'racing' and fuel_per_lap_kg > 0 and fuel_margin_laps < -mode.lift_coast_trigger_laps and (laps_remaining > 1 or dist_to_line_m > th.fuel_final_call_m)"
    clear_when: "fuel_margin_laps >= 0"
    cooldown_s: 120
    cooldown_group: fuel
    contradicts: [battle_manage]
    requires: [car_status]
    say:
      - "Fuel {fuel_short_laps:.1f} laps short. Lift and coast"
      - "We're {fuel_short_laps:.1f} laps short on fuel. Start lifting"
      - "Fuel critical, {fuel_short_laps:.1f} laps short. Lift and coast now"
    severity:
      - when: "lap_num * 2 < total_laps"
        priority: 2
        say:
          - "Fuel {fuel_short_laps:.1f} laps short. Lift and coast"
          - "{fuel_short_laps:.1f} laps short on fuel. Lift into the big stops"
  - id: fuel_marginal
    sessions: [race]
    priority: 2
    urgency: tactical
    when: "phase == 'racing' and fuel_per_lap_kg > 0 and fuel_margin_laps <= th.fuel_tight_laps and fuel_margin_laps >= -mode.lift_coast_trigger_laps and (laps_remaining > 1 or dist_to_line_m > th.fuel_final_call_m)"
    clear_when: "fuel_margin_laps > th.fuel_tight_laps + th.fuel_hysteresis_laps"
    cooldown_s: 180
    cooldown_group: fuel
    requires: [car_status]
    say:
      - "Fuel is tight, margin {fuel_margin_r:+.1f} laps. Keep an eye on it"
      - "Fuel's on the edge, {fuel_margin_r:+.1f} laps. Save where you can"
      - "Fuel {fuel_margin_r:+.1f} laps. Lift where it's cheap"
    severity:
      - when: "fuel_margin_laps < 0 and lap_num * 2 >= total_laps"
        priority: 1
        say:
          - "Fuel short now, {fuel_margin_r:+.1f} laps. Lift every straight"
          - "Fuel {fuel_margin_r:+.1f} laps. Save now, lift before big stops"
      - when: "fuel_margin_laps < 0"
        say:
          - "Fuel {fuel_margin_r:+.1f} laps. Early days, save a little"
          - "Fuel a touch short, {fuel_margin_r:+.1f}. Bit of lift and coast"
  - id: fuel_spare
    sessions: [race]
    priority: 3
    obvious_when: "lap_num <= 1"
    brief: "Fuel margin is safe"
    when: "phase == 'racing' and fuel_per_lap_kg > 0 and fuel_margin_laps > th.fuel_spare_laps and sector == 1"
    clear_when: "fuel_margin_laps <= th.fuel_spare_laps"
    cooldown_s: 600
    cooldown_group: fuel
    requires: [car_status]
    say:
      - "Fuel is good, {fuel_margin_laps:.1f} laps spare. Use it"
      - "Fuel {fuel_margin_laps:.1f} laps spare. No saving"
      - "Fuel's fine, {fuel_margin_laps:.1f} laps spare. Push"
  - id: energy_over
    sessions: [race]
    min_lap: 3  # lap 1-2 spend the full launch charge
    priority: 2
    when: "phase == 'racing' and energy_mode == 'over' and sector == 2"
    clear_when: "energy_mode != 'over'"
    cooldown_s: 120
    cooldown_group: energy
    requires: [car_status]
    say:
      - "Energy {energy_lap_delta_mj:+.1f} MJ over. Harvest more"
      - "{energy_lap_delta_mj:+.1f} MJ over this lap. Harvest"
      - "Over energy budget, {energy_lap_delta_mj:+.1f} MJ. Harvest"
  - id: energy_under
    sessions: [race]
    min_lap: 4  # grades the lap before; laps 1-2 spend the launch charge
    priority: 3
    urgency: tactical
    when: "phase == 'racing' and energy_prev_lap_mode == 'under' and sector == 0"
    clear_when: "sector != 0"
    cooldown_s: 180
    cooldown_group: energy
    requires: [car_status]
    say:
      - "{energy_prev_under_mj:.1f} MJ unused last lap. Deploy more"
      - "{energy_prev_under_mj:.1f} MJ left last lap. Use it"
      - "Battery spare last lap, {energy_prev_under_mj:.1f} MJ. Deploy"
  - id: energy_charge_for_battle
    sessions: [race]
    min_lap: 2
    priority: 3
    urgency: tactical
    when: "phase == 'racing' and sector == 0 and battle_mode == 'catching' and battle_catch_laps <= th.battle_charge_catch_laps and ers_store_pct < th.battle_charge_store_pct"
    clear_when: "sector != 0"
    still_true: "battle_mode == 'catching' and ers_store_pct < th.battle_charge_store_pct"
    cooldown_s: 180
    cooldown_group: energy
    requires: [car_status, lap_data]
    say:
      - "On {rival_ahead_name} in {battle_catch_laps:.1f} laps. Battery {ers_store_pct:.0f}, harvest this sector"
      - "Battery {ers_store_pct:.0f}. Harvest now, {rival_ahead_name} in {battle_catch_laps:.1f} laps"
      - "{rival_ahead_name} in {battle_catch_laps:.1f} laps. Charge up, battery {ers_store_pct:.0f}"
  - id: energy_burst
    sessions: [race]
    min_lap: 2
    priority: 3
    urgency: tactical
    when: "phase == 'racing' and sector == 1 and battle_mode == 'attacking' and energy_mode == 'on_budget' and ers_store_pct < th.energy_burst_store_pct"
    clear_when: "sector != 1"
    still_true: "battle_mode == 'attacking' and ers_store_pct < th.energy_burst_store_pct"
    cooldown_s: 180
    cooldown_group: energy
    requires: [car_status, lap_data]
    say:
      - "Battery {ers_store_pct:.0f}. Short bursts on {rival_ahead_name}"
      - "{gap_ahead_s:.1f} to {rival_ahead_name}, battery {ers_store_pct:.0f}. Deploy in bursts"
      - "Short bursts only, battery {ers_store_pct:.0f}. {gap_ahead_s:.1f} to {rival_ahead_name}"
  # 2026 overtake (docs/reference/f1-26-udp-notes.md): the game grants it at a
  # detection point (gap about a second) and switches it on at the activation
  # point. Both are automatic, so the calls give the gap, never a button.
  - id: overtake_mode
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and energy_mode == 'attack_ok' and overtake_active and aero_zone_ahead and gap_ahead_s <= mode.overtake_call_gap_s"
    clear_when: "gap_ahead_s > mode.overtake_call_gap_s + th.gap_hysteresis_s or not overtake_active"
    still_true: "overtake_active and energy_mode == 'attack_ok'"
    cooldown_s: 60
    conflict_group: overtake
    supersedes: [energy_over, energy_charge_for_battle, energy_burst]
    requires: [car_status, lap_data]
    say:
      - "{rival_ahead_name}, {gap_ahead_s:.1f}. Battery's there, deploy"
      - "{gap_ahead_s:.1f} to {rival_ahead_name}. Energy is there, go"
      - "Battery {ers_store_pct:.0f}, {gap_ahead_s:.1f} to {rival_ahead_name}. Deploy"
  - id: overtake_earned
    sessions: [race]
    priority: 3
    urgency: tactical
    when: "phase == 'racing' and overtake_available and not overtake_active"
    clear_when: "not overtake_available or overtake_active"
    still_true: "overtake_available and not overtake_active"
    cooldown_s: 90
    conflict_group: overtake
    supersedes: [energy_over, energy_charge_for_battle, energy_burst]
    requires: [lap_data]
    say:
      - "Overtake earned on {rival_ahead_name}, {gap_ahead_s:.1f}"
      - "{gap_ahead_s:.1f} to {rival_ahead_name}. Overtake next straight"
      - "Overtake next straight. {rival_ahead_name} {gap_ahead_s:.1f} ahead"
  - id: overtake_lost
    sessions: [race]
    priority: 3
    urgency: tactical
    rotate_with: [battle_attack]
    when: "phase == 'racing' and overtake_active and not overtake_available and gap_ahead_s < th.overtake_lost_call_gap_s"
    clear_when: "overtake_available or not overtake_active"
    still_true: "not overtake_available"
    cooldown_s: 120
    conflict_group: overtake
    requires: [lap_data]
    say:
      - "Overtake gone. {gap_ahead_s:.1f} to {rival_ahead_name}, get inside a second"
      - "No overtake next lap. {gap_ahead_s:.1f} to {rival_ahead_name}, close in"
      - "{gap_ahead_s:.1f} to {rival_ahead_name}. Inside a second for overtake"
