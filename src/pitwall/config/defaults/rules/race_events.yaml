rules:
  - id: weather_box_now
    sessions: [race]
    priority: 1
    urgency: safety
    when: "phase in ('racing', 'sc', 'vsc') and laps_remaining > 1 and ((tyre_switch_to == 'inters' and tyre_compound != 8) or tyre_switch_to == 'wets') and slip_trend >= th.wet_slip_trend_min and (rain_pct_in_10 > rain_pct_now or weather_now >= 3)"
    clear_when: "tyre_switch_to == ''"
    cooldown_s: 30
    cooldown_group: weather
    supersedes: [tyre_switch, weather_to_inter, weather_to_wet]
    requires: [lap_data]
    say:
      - "Box, box. Aquaplaning risk, {tyre_switch_to}"
      - "Box, box. Grip's going, {tyre_switch_to} now"
      - "Box this lap. Aquaplaning risk, {tyre_switch_to}"
      - "Aquaplaning risk. Box this lap for {tyre_switch_to}"
      - "Grip is going. Fit {tyre_switch_to}, pit now"
      - "Box now, {tyre_switch_to}. Aquaplaning risk"
  - id: penalty
    sessions: [race]
    priority: 1
    urgency: tactical
    when: "penalty_recent and penalty_kind == 'time' and penalty_time_s > 0 and penalty_infringement not in (7, 8, 9, 21)"
    clear_when: "not penalty_recent"
    cooldown_s: 15
    requires: [event]
    say:
      - "Penalty, {penalty_time_s} seconds. {penalty_s} total on the car now"
      - "We've been given {penalty_time_s} seconds. {penalty_s} total"
      - "{penalty_time_s} second penalty. {penalty_s} total now"
      - "Penalty, {penalty_time_s} seconds. Total penalty is {penalty_s}"
      - "{penalty_time_s} seconds added. {penalty_s} total penalty"
      - "Race penalty, {penalty_time_s} seconds. {penalty_s} total"
  - id: penalty_pit
    sessions: [race]
    priority: 1
    urgency: execution
    decision_point: pit_entry
    when: "penalty_recent and penalty_kind in ('drive_through', 'stop_go')"
    clear_when: "not penalty_recent"
    cooldown_s: 15
    requires: [event]
    say:
      - "We've got a {penalty_kind_text}. Serve it within three laps"
      - "{penalty_kind_text} penalty. We'll serve it, three laps to take it"
      - "{penalty_kind_text}. Three laps to serve it, we'll call it"
      - "{penalty_kind_text} penalty. Serve it within three laps"
      - "Penalty for {penalty_kind_text}. Three laps to serve it"
      - "Serve the {penalty_kind_text} within three laps"
  - id: serve_penalty
    sessions: [race]
    priority: 2
    urgency: execution
    decision_point: pit_entry
    when: "unserved_drive_through + unserved_stop_go > 0 and pit_plan in ('box_now', 'box_in_n', 'cheap_stop')"
    clear_when: "unserved_drive_through + unserved_stop_go == 0"
    cooldown_s: 120
    requires: [lap_data]
    say:
      - "Unserved penalty on the car. We serve it at the stop"
      - "We'll take the penalty at the stop, it's still on the car"
      - "Reminder, penalty's unserved. It comes off at the stop"
      - "Penalty still unserved. Serve it at the stop"
      - "Penalty still to serve. Take it at the stop"
      - "Penalty remains on the car. Serve it in the pits"
  - id: penalty_track_limits
    sessions: [race]
    priority: 1
    urgency: tactical
    when: "penalty_recent and penalty_kind == 'time' and penalty_time_s > 0 and penalty_infringement == 21"
    clear_when: "not penalty_recent"
    cooldown_s: 15
    requires: [event]
    say:
      - "{penalty_time_s} seconds, track limits. {penalty_s} total"
      - "{penalty_time_s} second penalty, track limits. {penalty_s} total"
      - "Track limits penalty, {penalty_time_s} seconds. {penalty_s} total"
      - "Penalty, {penalty_time_s} seconds for track limits. {penalty_s} total"
      - "Track limits, {penalty_time_s} seconds added. {penalty_s} total penalty"
      - "{penalty_time_s} seconds for track limits. Total penalty {penalty_s}"
      - "Track limits penalty, {penalty_time_s} seconds. Total now {penalty_s}"
      - "{penalty_time_s} seconds added for track limits. {penalty_s} total"
  - id: penalty_corner_cut
    sessions: [race]
    priority: 1
    urgency: tactical
    when: "penalty_recent and penalty_kind == 'time' and penalty_time_s > 0 and penalty_infringement in (7, 8, 9)"
    clear_when: "not penalty_recent"
    cooldown_s: 15
    requires: [event]
    say:
      - "{penalty_time_s} seconds, corner cut. {penalty_s} total"
      - "{penalty_time_s} second penalty, cutting. {penalty_s} total"
      - "Corner cut penalty, {penalty_time_s} seconds. {penalty_s} total"
      - "Penalty for cutting, {penalty_time_s} seconds. Total {penalty_s}"
  - id: track_limit_warning
    sessions: [race]
    priority: 2
    urgency: coaching
    when: "track_warning_recent and track_warning_kind == 'limits' and track_warning_count % th.warnings_warn not in (0, th.warnings_warn - 1)"
    clear_when: "not track_warning_recent"
    cooldown_s: 10
    requires: [event]
    say:
      - "Track limits. The track's the grey bit, mate"
      - "Track limits warning. Stay inside the kerbs"
      - "Track limits warning. Lovely bit of grass you found there"
      - "Warning for track limits. Stewards noticed, so did we"
      - "Track limits warning. Keep all four wheels inside"
      - "Warning, track limits. Stay within the white lines"
      - "Track limits. Keep it on the circuit"
      - "Another track limits warning. Don't wander beyond the white lines"
  - id: track_limit_last_warning
    sessions: [race]
    priority: 1
    urgency: tactical
    when: "track_warning_recent and track_warning_kind == 'limits' and track_warning_count % th.warnings_warn == th.warnings_warn - 1"
    clear_when: "not track_warning_recent"
    cooldown_s: 10
    requires: [event]
    say:
      - "Track limits, {track_warning_count} now. Next one's a penalty"
      - "Track limits, {track_warning_count}. Next one costs time"
      - "{track_warning_count} track limits. One more is a penalty"
      - "{track_warning_count} track limits now. Next one is a penalty"
      - "Warning count {track_warning_count}. Another track limit costs time"
      - "Track limits warning number {track_warning_count}. One more brings a penalty"
  - id: corner_cut_warning
    sessions: [race]
    priority: 2
    urgency: coaching
    when: "track_warning_recent and track_warning_kind == 'cut' and track_warning_count % th.warnings_warn not in (0, th.warnings_warn - 1)"
    clear_when: "not track_warning_recent"
    cooldown_s: 10
    requires: [event]
    say:
      - "Corner cut warning. Give the time back"
      - "Warning, cutting the corner. Stay on track"
      - "Corner cut. Return the time"
      - "Corner cut warning. Don't wander off the track. Give the time back"
  - id: corner_cut_last_warning
    sessions: [race]
    priority: 1
    urgency: tactical
    when: "track_warning_recent and track_warning_kind == 'cut' and track_warning_count % th.warnings_warn == th.warnings_warn - 1"
    clear_when: "not track_warning_recent"
    cooldown_s: 10
    requires: [event]
    say:
      - "Corner cuts, {track_warning_count} now. Next one's a penalty"
      - "{track_warning_count} corner cuts. One more costs time"
      - "Corner cut count {track_warning_count}. Next one is a penalty"
      - "{track_warning_count} cuts now. One more costs time"
  - id: blue_flag
    sessions: [race]
    priority: 1
    urgency: safety
    resolved_by: [box_now, plan_sc_box]
    when: "blue_flag and phase not in ('red_flag', 'sc', 'vsc')"
    clear_when: "not blue_flag or phase in ('red_flag', 'sc', 'vsc')"
    cooldown_s: 20
    requires: [car_status]
    say:
      - "Blue flag. Let him by"
      - "Blues, leader behind. Give him the room"
      - "Blue flags. Let him through, cleanly"
      - "Blue flag. Yield to the car behind"
      - "Leader approaching. Blue flag, let him through"
      - "Blue flags. Let the leader pass"
  - id: rival_ahead_pitted
    sessions: [race]
    priority: 2
    brief: "Rival ahead has pitted"
    when: "phase == 'racing' and rival_ahead_in_pit_lane and pit_plan != 'overcut' and gap_ahead_s <= th.rival_pit_gap_s and laps_remaining > th.pit_min_laps_left"
    clear_when: "not rival_ahead_in_pit_lane"
    cooldown_s: 45
    cooldown_group: rival_pit
    requires: [lap_data]
    say:
      - "{rival_ahead_name} ahead has boxed. Was {gap_ahead_s:.1f} up"
      - "{rival_ahead_name} pitted, {gap_ahead_s:.1f} ahead"
      - "Car ahead's boxing, {rival_ahead_name}. He was {gap_ahead_s:.1f} up"
      - "{rival_ahead_name} has pitted. Gap was {gap_ahead_s:.1f}"
      - "Car ahead boxed. {rival_ahead_name} {gap_ahead_s:.1f} in front"
      - "{rival_ahead_name} into the pits. {gap_ahead_s:.1f} ahead"
  - id: rival_behind_pitted
    sessions: [race]
    priority: 2
    brief: "Rival behind has pitted"
    when: "phase == 'racing' and rival_behind_in_pit_lane and tyre_age_laps >= 2 and laps_remaining > th.pit_min_laps_left"
    clear_when: "not rival_behind_in_pit_lane"
    cooldown_s: 45
    cooldown_group: rival_pit
    resolved_by: [box_now, overcut_stay_out, cover_box, overcut_defend]
    requires: [lap_data]
    say:
      - "{rival_behind_name} has boxed. Fresh tyres, expect the undercut"
      - "{rival_behind_name} behind has boxed. Watch the undercut"
      - "{rival_behind_name} pitted. Undercut threat, push"
      - "{rival_behind_name} boxed. Push, cover the undercut"
      - "{rival_behind_name} has stopped. Fresh tyres, watch the undercut"
      - "Car behind boxed, {rival_behind_name}. Cover the undercut"
      - "{rival_behind_name} is in the pits. Push to cover the undercut"
      - "Fresh tyres behind, {rival_behind_name} has boxed. Push now"
  - id: weather_to_inter
    sessions: [race]
    priority: 2
    when: "weather_crossover == 'to_inter' and tyre_compound not in (0, 7)"
    clear_when: "weather_crossover != 'to_inter'"
    cooldown_s: 120
    cooldown_group: weather
    requires: [session]
    say:
      - "Rain {weather_crossover_pct} percent in {weather_crossover_min} minutes. Inters soon"
      - "Rain coming, {weather_crossover_pct} percent. Inters likely"
      - "{weather_crossover_pct} percent rain in {weather_crossover_min} minutes. Thinking inters"
      - "Inters likely. Rain chance {weather_crossover_pct} percent in {weather_crossover_min} minutes"
      - "Rain expected in {weather_crossover_min} minutes, {weather_crossover_pct} percent. Prepare inters"
      - "Crossover to inters, {weather_crossover_pct} percent in {weather_crossover_min} minutes"
  - id: weather_to_wet
    sessions: [race]
    priority: 2
    when: "weather_crossover == 'to_wet' and tyre_compound not in (0, 8)"
    clear_when: "weather_crossover != 'to_wet'"
    cooldown_s: 120
    cooldown_group: weather
    requires: [session]
    say:
      - "Rain {weather_crossover_pct} percent in {weather_crossover_min} minutes. Full wets"
      - "Heavy rain, {weather_crossover_pct} percent. Full wets likely"
      - "Big rain coming, {weather_crossover_pct} percent. Ready for wets"
      - "Full wets expected. Rain chance {weather_crossover_pct} percent in {weather_crossover_min} minutes"
      - "Heavy rain due in {weather_crossover_min} minutes, {weather_crossover_pct} percent. Prepare wets"
      - "Crossover to full wets, {weather_crossover_pct} percent chance"
  - id: weather_to_dry
    sessions: [race]
    priority: 2
    when: "weather_crossover == 'to_dry'"
    clear_when: "weather_crossover != 'to_dry'"
    cooldown_s: 120
    cooldown_group: weather
    requires: [session]
    say:
      - "Track drying, rain {weather_crossover_pct} percent. Slicks soon"
      - "Drying, {weather_crossover_pct} percent rain. Slicks soon"
      - "Drying out. Slicks coming"
      - "Track is drying. Rain chance {weather_crossover_pct} percent, slicks soon"
      - "Drying conditions, {weather_crossover_pct} percent rain. Prepare slicks"
      - "Rain easing. Slicks likely, {weather_crossover_pct} percent rain"
  - id: sc_deployed
    sessions: [race]
    priority: 1
    urgency: safety
    escalates: [vsc_deployed, vsc_ending, vsc_restart]
    when: "phase == 'sc'"
    clear_when: "phase != 'sc'"
    requires: [session]
    say:
      - "Safety car, safety car. Delta positive, stay above it"
      - "Safety car deployed. Keep the delta positive"
      - "Safety car, safety car. Watch the delta"
      - "Safety car deployed. Keep your delta positive"
      - "Safety car. Stay above the delta"
      - "Safety car out. Maintain a positive delta"
  - id: vsc_deployed
    sessions: [race]
    priority: 1
    urgency: safety
    when: "phase == 'vsc'"
    clear_when: "phase != 'vsc'"
    requires: [session]
    say:
      - "Virtual safety car. Stick to the delta"
      - "VSC, VSC. Stay on the delta"
      - "Virtual safety car deployed. Delta, keep it positive"
      - "VSC deployed. Follow the delta"
      - "Virtual safety car. Keep your delta positive"
      - "VSC active. Stay on the delta"
  - id: sc_ending
    cooldown_group: sc_ending
    sessions: [race]
    priority: 1
    urgency: safety
    when: "phase == 'sc' and sc_ending"
    clear_when: "not sc_ending"
    requires: [lap_data]
    say:
      - "Safety car in this lap. Heat the tyres"
      - "Safety car in. Tyres warm, restart coming"
      - "SC in this lap, SC in this lap. Stay close, be ready to go"
      - "Safety car comes in this lap. Warm the tyres"
      - "SC in this lap. Get the tyres ready for the restart"
      - "Safety car ending this lap. Stay close and be ready"
  - id: vsc_ending
    cooldown_group: vsc_ending
    sessions: [race]
    priority: 1
    urgency: safety
    when: "phase == 'vsc' and sc_ending"
    clear_when: "not sc_ending"
    requires: [lap_data]
    say:
      - "VSC ending, VSC ending. Be ready to go"
      - "VSC ending. Stay on the delta until it goes green"
      - "VSC ending. Prepare to race when it goes green"
      - "Virtual safety car ending. Hold the delta until green"
  - id: sc_restart
    sessions: [race]
    priority: 1
    urgency: safety
    when: "phase == 'racing' and neutral_ended_kind == 'sc' and neutral_ended_s < th.neutral_green_s"
    clear_when: "neutral_ended_s >= th.neutral_green_s"
    requires: [lap_data]
    say:
      - "Green flag, green flag. Racing again, push now"
      - "Green, green. We're racing, full attack"
      - "Safety car's in, green flag. Go"
      - "Green flag. Racing again, push now"
      - "Safety car in. Green flag, resume racing"
      - "Green, green. Safety car in, race now"
  - id: vsc_restart
    sessions: [race]
    priority: 1
    urgency: safety
    when: "phase == 'racing' and neutral_ended_kind == 'vsc' and neutral_ended_s < th.neutral_green_s"
    clear_when: "neutral_ended_s >= th.neutral_green_s"
    requires: [lap_data]
    say:
      - "Green, green. VSC's over, full power"
      - "VSC over, go, go, go"
      - "Green flag. VSC is over, race at full pace"
      - "VSC ended. Green flag, resume racing"
  # SC/VSC restart procedures (sc-restart)
  # The SCAR "returning" event (SC lights out / VSC ending) carries tyre temps when a
  # tyre is below its compound window; the plain sc_ending/vsc_ending speak otherwise.
  # The shared cooldown group prevents a second ending call if the tyres cool later.
  - id: sc_ending_tyres_cold
    cooldown_group: sc_ending
    cooldown_s: 180
    sessions: [race]
    priority: 1
    urgency: safety
    supersedes: [sc_ending]
    when: "phase == 'sc' and sc_ending and coldest_tyre_c < (th.tyre_inner_cold_by_compound_c[tyre_compound] if tyre_compound in th.tyre_inner_cold_by_compound_c else th.tyre_inner_cold_c) + mode.thermal_warn_offset_c"
    clear_when: "not sc_ending"
    still_true: "phase == 'sc' and sc_ending"
    requires: [lap_data, car_telemetry]
    say:
      - "Safety car in this lap. {coldest_tyre} coldest at {coldest_tyre_c:.1f}"
      - "SC in this lap. {coldest_tyre} is cold, {coldest_tyre_c:.1f}. Get heat in it"
      - "Lights out on the safety car. {coldest_tyre} at {coldest_tyre_c:.1f}, cold for the restart"
      - "Safety car in. Fronts {tyre_inner_front_c:.1f}, rears {tyre_inner_rear_c:.1f}. {coldest_tyre} is coldest"
  - id: vsc_ending_tyres_cold
    cooldown_group: vsc_ending
    cooldown_s: 180
    sessions: [race]
    priority: 1
    urgency: safety
    supersedes: [vsc_ending]
    when: "phase == 'vsc' and sc_ending and coldest_tyre_c < (th.tyre_inner_cold_by_compound_c[tyre_compound] if tyre_compound in th.tyre_inner_cold_by_compound_c else th.tyre_inner_cold_c) + mode.thermal_warn_offset_c"
    clear_when: "not sc_ending"
    still_true: "phase == 'vsc' and sc_ending"
    requires: [lap_data, car_telemetry]
    say:
      - "VSC ending. {coldest_tyre} coldest at {coldest_tyre_c:.1f}"
      - "VSC ending, cold tyres. {coldest_tyre} at {coldest_tyre_c:.1f}"
      - "Virtual safety car ending. {coldest_tyre} is cold, {coldest_tyre_c:.1f}"
      - "VSC ending. Fronts {tyre_inner_front_c:.1f}, rears {tyre_inner_rear_c:.1f}. {coldest_tyre} is coldest"
  - id: sc_delta_negative
    sessions: [race]
    priority: 1
    urgency: safety
    when: "phase in ('sc', 'vsc') and safety_car_delta_s < th.sc_delta_warn_s"
    clear_when: "phase not in ('sc', 'vsc') or safety_car_delta_s >= th.sc_delta_clear_s"
    still_true: "phase in ('sc', 'vsc') and safety_car_delta_s < 0"
    cooldown_s: 20
    requires: [lap_data]
    say:
      - "Delta negative, {safety_car_delta_s:.1f}. Back off"
      - "Delta's gone negative, {safety_car_delta_s:.1f}. Lift"
      - "Delta {safety_car_delta_s:.1f}. Too fast, get it positive"
      - "Negative delta, {safety_car_delta_s:.1f}. Slow down"
