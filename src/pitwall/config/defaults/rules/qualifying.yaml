rules:
  # Clean-air release at pit exit: speak once when the gap is good, once when a
  # worthwhile wait exists. Shared cooldown group so at most one talks per 30 s.
  - id: release_go
    sessions: [qualifying]
    priority: 2
    when: "phase == 'garage' and release_clean and session_time_left > 60"
    clear_when: "not release_clean or phase != 'garage'"
    cooldown_s: 30
    cooldown_group: release
    requires: [lap_data, session]
    say:
      - "Track's clear at pit exit. Good to go now"
      - "Pit exit is clear. Go when you're ready"
  - id: release_hold
    sessions: [qualifying]
    priority: 2
    when: "phase == 'garage' and not release_clean and release_wait_s < 60 and release_wait_s >= 3 and session_time_left > 60"
    clear_when: "release_clean or phase != 'garage'"
    cooldown_s: 30
    cooldown_group: release
    requires: [lap_data, session]
    say:
      - "Traffic at pit exit. Hold about {release_wait_s:.0f} seconds"
      - "Hold {release_wait_s:.0f} seconds for a gap"
  # Abort advisory: projection is over the cut-off and the lap won't make it.
  - id: abort_lap
    sessions: [qualifying]
    priority: 2
    when: "phase == 'flying' and abort_advised"
    still_true: "abort_advised"
    clear_when: "phase != 'flying'"
    cooldown_s: 90
    requires: [lap_data, session_history]
    say:
      - "Abort the lap, we're {abort_deficit_s:.1f} off the cut. Save the set"
      - "Box this lap, it's not going to be enough"
  - id: quali_through
    sessions: [qualifying]
    priority: 3
    when: "phase == 'flying' and quali_through and sector >= 2"
    clear_when: "not quali_through"
    cooldown_s: 120
    requires: [lap_data, session_history]
    say:
      - "You're safe, that time's through. No need to push"
  # Comfortable margin after a lap: no need to risk the car or a fresh set.
  - id: quali_safe_cut
    sessions: [qualifying]
    priority: 2
    when: "quali_margin_kind == 'cut' and quali_margin_ms >= th.quali_safe_margin_ms and (phase == 'in_lap' or phase == 'pitting' or phase == 'garage')"
    clear_when: "phase == 'out_lap' or quali_margin_ms < th.quali_safe_margin_ms"
    cooldown_s: 120
    requires: [lap_data, session_history]
    say:
      - "You're {quali_margin_s:.1f} clear of the cut. No need to go again, save the set"
      - "That's {quali_margin_s:.1f} inside the cut. Play it safe and keep the tyres"
  - id: quali_safe_pole
    sessions: [qualifying]
    priority: 2
    when: "quali_margin_kind == 'pole' and quali_margin_ms >= th.quali_safe_margin_ms and (phase == 'in_lap' or phase == 'pitting' or phase == 'garage')"
    clear_when: "phase == 'out_lap' or quali_margin_ms < th.quali_safe_margin_ms"
    cooldown_s: 120
    requires: [lap_data, session_history]
    say:
      - "Provisional pole by {quali_margin_s:.1f}. Play it safe, no risks from here"
      - "You're {quali_margin_s:.1f} up on P2. If you go again, a tidy lap is enough"
  # Pressure advice for the next run from the carcass temps on this run's flying laps.
  - id: tyre_pressure_advice
    sessions: [practice, qualifying]
    priority: 2
    when: "(phase == 'in_lap' or phase == 'pitting' or phase == 'garage') and run_flying_s >= th.pressure_min_flying_s and pressure_advice_text != ''"
    clear_when: "phase == 'out_lap'"
    requires: [car_telemetry]
    say:
      - "Pressures for the next run: {pressure_advice_text}"
  - id: tyre_pressure_ok
    sessions: [practice, qualifying]
    priority: 2
    when: "(phase == 'in_lap' or phase == 'pitting' or phase == 'garage') and run_flying_s >= th.pressure_min_flying_s and pressure_advice_text == ''"
    clear_when: "phase == 'out_lap'"
    requires: [car_telemetry]
    say:
      - "Tyre temps were in the window on all four. Leave the pressures"
  # Run plan on crossing the line after a hot lap (docs/17). One per line crossing.
  - id: plan_push
    sessions: [qualifying]
    priority: 2
    when: "phase == 'flying' and run_plan == 'push' and sector == 0"
    clear_when: "sector != 0"
    cooldown_s: 30
    cooldown_group: run_plan
    requires: [lap_data, car_status]
    say:
      - "Go again. Battery {ers_store_pct:.0f}, tyres are fine"
      - "Keep pushing, you've got {ers_store_pct:.0f} percent battery"
  - id: plan_cool
    sessions: [qualifying]
    priority: 2
    when: "phase == 'flying' and run_plan == 'cool' and sector == 0"
    clear_when: "sector != 0"
    cooldown_s: 30
    cooldown_group: run_plan
    requires: [lap_data, car_status]
    say:
      - "{run_plan_why}. Cool this one, recharge mode, then we go again"
      - "{run_plan_why}. Back off for a lap, recharge and cool the tyres"
  - id: plan_push_now
    sessions: [qualifying]
    priority: 2
    when: "phase == 'flying' and run_plan == 'push_now' and sector == 0"
    clear_when: "sector != 0"
    cooldown_s: 30
    cooldown_group: run_plan
    requires: [lap_data, car_status]
    say:
      - "{run_plan_why}, no time to cool. Keep pushing, battery {ers_store_pct:.0f}. Use it on the straights"
      - "{run_plan_why}. We can't afford a cool lap, go again now"
  - id: plan_box
    sessions: [qualifying]
    priority: 2
    when: "phase == 'flying' and run_plan == 'box' and run_plan_reason != 'safe' and sector == 0"
    clear_when: "sector != 0"
    cooldown_s: 30
    cooldown_group: run_plan
    requires: [lap_data, car_status]
    say:
      - "{run_plan_why}. Box this lap"
  - id: plan_box_safe
    sessions: [qualifying]
    priority: 2
    when: "phase == 'flying' and run_plan == 'box' and run_plan_reason == 'safe' and sector == 0"
    clear_when: "sector != 0"
    cooldown_s: 30
    cooldown_group: run_plan
    requires: [lap_data, session_history]
    say:
      - "You're {quali_margin_s:.1f} clear. Bring it in, save the set"
  # Cool-down lap coaching.
  - id: cool_recharge
    sessions: [qualifying]
    priority: 2
    when: "cool_lap and run_plan != 'cool' and not cool_prep and sector <= 1"
    clear_when: "not cool_lap"
    still_true: "cool_lap"
    requires: [lap_data, car_status]
    say:
      - "Recharge mode. Harvest everything, easy on the tyres"
      - "Flick it to recharge. Gentle on the throttle, let the tyres breathe"
  - id: cool_recharge_check
    sessions: [qualifying]
    priority: 2
    when: "cool_lap and not cool_prep and th.ers_recharge_mode >= 0 and ers_deploy_mode != th.ers_recharge_mode and cool_elapsed_s >= 15"
    clear_when: "not cool_lap or ers_deploy_mode == th.ers_recharge_mode"
    still_true: "cool_lap and ers_deploy_mode != th.ers_recharge_mode"
    requires: [car_status]
    say:
      - "Still not in recharge mode. Switch it over"
  - id: cool_status
    sessions: [qualifying]
    priority: 3
    when: "cool_lap and not cool_prep and sector == 1"
    clear_when: "not cool_lap"
    still_true: "cool_lap and not cool_prep"
    requires: [car_status, car_telemetry]
    say:
      - "Battery {ers_store_pct:.0f}. {cool_tyre_hint}"
  - id: cool_vs_pole
    sessions: [qualifying]
    priority: 3
    when: "cool_lap and not cool_prep and sector == 1 and pole_gap_ms > 0 and pole_worst_sector > 0"
    clear_when: "not cool_lap"
    still_true: "cool_lap and not cool_prep"
    requires: [session_history]
    say:
      - "Pole is {pole_gap_s:.1f} up. Most of it is sector {pole_worst_sector}, {pole_worst_sector_s:.1f}"
      - "{pole_gap_s:.1f} to pole, {pole_worst_sector_s:.1f} of that in sector {pole_worst_sector}"
  - id: cool_mistakes
    sessions: [qualifying]
    priority: 3
    when: "cool_lap and not cool_prep and sector >= 1 and last_hot_mistakes != ''"
    clear_when: "not cool_lap"
    still_true: "cool_lap and not cool_prep"
    requires: [lap_data]
    say:
      - "Last lap: {last_hot_mistakes}"
  - id: cool_car_behind
    sessions: [qualifying]
    priority: 1
    when: "(cool_lap or phase == 'out_lap') and hot_car_behind_s <= th.cool_car_behind_s"
    clear_when: "hot_car_behind_s > th.cool_car_behind_s + 2"
    still_true: "hot_car_behind_s <= th.cool_car_behind_s + 1"
    cooldown_s: 20
    requires: [lap_data]
    say:
      - "Car behind on a hot lap, {hot_car_behind_s:.0f} seconds. Off the racing line"
      - "Hot lap behind you. Move over, don't impede"
  - id: cool_hot_mode
    sessions: [qualifying]
    priority: 1
    when: "cool_prep"
    clear_when: "not cool_lap"
    requires: [lap_data, car_status]
    say:
      - "Hot lap mode now. Battery {ers_store_pct:.0f}, fronts {tyre_inner_front_c:.0f}. Push from the line"
      - "Switch back to hot lap mode. Battery {ers_store_pct:.0f}. Go on the line"
