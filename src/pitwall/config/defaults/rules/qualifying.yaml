rules:
  # Clean-air release at pit exit: speak once when the gap is good, once when a
  # worthwhile wait exists. Shared cooldown group so at most one talks per 30 s.
  - id: release_go
    sessions: [practice, qualifying]
    priority: 2
    urgency: execution
    when: "phase == 'garage' and garage_s >= th.release_garage_settle_s and release_clean and time_for_out_lap and session_time_left > 60"
    clear_when: "not release_clean or phase != 'garage'"
    still_true: "phase == 'garage' and release_clean"
    cooldown_s: 30
    cooldown_group: release
    conflict_group: release
    requires: [lap_data, session]
    say:
      - "Pit exit clear. Go now"
      - "Exit clear. Go when ready"
      - "Gap's there at the exit. Off you go"
      - "Clear pit exit. You can go now"
      - "Exit is clear. Release when ready"
      - "There's a gap at the exit. Go"
  - id: release_hold
    sessions: [practice, qualifying]
    priority: 2
    urgency: execution
    when: "phase == 'garage' and garage_s >= th.release_garage_settle_s and not release_clean and release_wait_s < 60 and release_wait_s >= 3 and time_for_out_lap and session_time_left > 60"
    clear_when: "release_clean or phase != 'garage'"
    still_true: "phase == 'garage' and not release_clean"
    cooldown_s: 30
    cooldown_group: release
    conflict_group: release
    requires: [lap_data, session]
    say:
      - "Traffic at exit. Hold {release_wait_s:.0f} seconds"
      - "Hold {release_wait_s:.0f} seconds for a gap"
      - "Cars at exit. Wait {release_wait_s:.0f} seconds"
      - "Hold for {release_wait_s:.0f} seconds. Traffic at the exit"
      - "Wait {release_wait_s:.0f} seconds for the cars to clear"
      - "Cars at pit exit. Hold {release_wait_s:.0f} seconds"
  # Too late to leave: the out lap would reach the line after the flag.
  - id: release_too_late
    sessions: [qualifying]
    priority: 2
    urgency: execution
    when: "phase == 'garage' and not time_for_out_lap and session_time_left > 0"
    clear_when: "phase != 'garage'"
    cooldown_s: 600
    cooldown_group: release
    requires: [lap_data, session]
    say:
      - "No time before the flag. Stay in"
      - "No time for another lap. Done"
      - "Flag is too close. Stay in, no time for a lap"
      - "Another lap won't fit before the flag. Stay in"
  - id: release_window_closing
    sessions: [qualifying]
    priority: 2
    urgency: execution
    when: "phase == 'garage' and time_for_out_lap and release_time_left_s > 0 and release_time_left_s <= th.release_closing_s"
    still_true: "phase == 'garage' and time_for_out_lap"
    clear_when: "phase != 'garage'"
    cooldown_s: 600
    cooldown_group: release_window
    requires: [lap_data, session]
    say:
      - "Window closing. Go now or we miss the lap"
      - "Last chance to go. Out now"
      - "Release now. The window's closing, or we miss the lap"
      - "Last chance for the lap. Go out now"
  # Abort advisory: projection is over the cut-off and the lap won't make it.
  - id: abort_lap
    sessions: [qualifying]
    priority: 2
    urgency: execution
    resolved_by: [quali_through]
    when: "phase == 'flying' and abort_advised"
    still_true: "abort_advised"
    clear_when: "phase != 'flying'"
    cooldown_s: 90
    requires: [lap_data, session_history]
    say:
      - "Abort, {abort_deficit_s:.1f} off the cut. Save the set"
      - "Box this lap, it's not going to be enough"
      - "Lap's gone, {abort_deficit_s:.1f} off the cut. Back off"
      - "Abort this lap, {abort_deficit_s:.1f} off the cut. Save the tyres"
      - "Box now. The lap won't be enough"
      - "{abort_deficit_s:.1f} off the cut. Lap is gone, back off"
    on_ack:
      - "Copy, back it off. Recharge and go again"
      - "Copy. Cool it"
      - "Understood, back off. Recharge for the next lap"
      - "Copy, cool the tyres and go again"
    on_neg:
      - "Understood, keep going. Make it count"
      - "Copy, stay on it"
      - "Understood. Keep pushing and make the lap count"
      - "Copy, continue the lap"
  - id: quali_through
    sessions: [qualifying]
    priority: 3
    when: "phase == 'flying' and quali_through and sector >= 2"
    clear_when: "not quali_through"
    cooldown_s: 120
    requires: [lap_data, session_history]
    say:
      - "You're through. No need to push"
      - "Good enough. Bring it home"
      - "You're safely through. Bring it home"
      - "That's enough to get through. No need to push"
    on_ack:
      - "Copy. Bring it home, nice and easy"
      - "Copy that. Easy in-lap"
      - "Understood. Bring the car home gently"
      - "Copy, easy in-lap from here"
    on_neg:
      - "Understood, your call. Go for it, keep it clean"
      - "Copy, push on. Keep it on track"
      - "Your call. Keep pushing, but keep it clean"
      - "Copy, carry on. Stay on the circuit"
  # Comfortable margin after a lap: no need to risk the car or a fresh set.
  - id: quali_safe_cut
    sessions: [qualifying]
    priority: 2
    when: "quali_margin_kind == 'cut' and quali_margin_ms >= th.quali_safe_margin_ms and (phase == 'in_lap' or phase == 'pitting' or phase == 'garage')"
    clear_when: "phase == 'out_lap' or quali_margin_ms < th.quali_safe_margin_ms"
    cooldown_s: 120
    requires: [lap_data, session_history]
    say:
      - "{quali_margin_s:.1f} clear of the cut. Save the set"
      - "{quali_margin_s:.1f} inside the cut. Keep the tyres"
      - "{quali_margin_s:.1f} clear of the cut. Look after the tyres"
      - "Safe by {quali_margin_s:.1f}. Save the set"
    on_ack:
      - "Copy. Box this lap, we save the set"
      - "Copy that. Bring it in"
      - "Understood, pit this lap and save the tyres"
      - "Copy, bring the car in now"
    on_neg:
      - "Understood, your call. Push on, keep it clean"
      - "Copy, stay out. Don't risk the car"
      - "Your call. Keep pushing, keep it clean"
      - "Copy, stay out. Keep the car safe"
  - id: quali_safe_pole
    sessions: [qualifying]
    priority: 2
    when: "quali_margin_kind == 'pole' and quali_margin_ms >= th.quali_safe_margin_ms and (phase == 'in_lap' or phase == 'pitting' or phase == 'garage')"
    clear_when: "phase == 'out_lap' or quali_margin_ms < th.quali_safe_margin_ms"
    cooldown_s: 120
    requires: [lap_data, session_history]
    say:
      - "Provisional pole by {quali_margin_s:.1f}. No risks"
      - "{quali_margin_s:.1f} up on P2. Tidy lap is enough"
      - "Provisional pole, {quali_margin_s:.1f} clear. No risks"
      - "Ahead of P2 by {quali_margin_s:.1f}. Keep the lap tidy"
    on_ack:
      - "Copy. Bring it home"
      - "Copy that. Easy in-lap"
      - "Understood. Bring her home"
      - "Copy, easy in-lap now"
    on_neg:
      - "Understood, go for it. Keep it clean"
      - "Copy, push on. No risks"
      - "Your call. Push, but keep it clean"
      - "Copy, continue. No risks"
  # Pressure advice for the next run from the carcass temps on this run's flying laps.
  - id: tyre_pressure_advice
    sessions: [practice, qualifying]
    priority: 2
    when: "(phase == 'in_lap' or phase == 'pitting' or phase == 'garage') and run_flying_s >= th.pressure_min_flying_s and pressure_advice_text != ''"
    clear_when: "phase == 'out_lap'"
    requires: [car_telemetry]
    say:
      - "Pressures: {pressure_advice_text}"
      - "On pressures, {pressure_advice_text}"
      - "Tyre pressures, {pressure_advice_text}"
      - "Pressure check. {pressure_advice_text}"
  - id: tyre_pressure_ok
    sessions: [practice, qualifying]
    priority: 2
    when: "(phase == 'in_lap' or phase == 'pitting' or phase == 'garage') and run_flying_s >= th.pressure_min_flying_s and pressure_advice_text == ''"
    clear_when: "phase == 'out_lap'"
    requires: [car_telemetry]
    say:
      - "Temps in window. Leave pressures"
      - "Temps spot on. No changes"
      - "Pressures are fine, temperatures in range"
      - "Tyre temps are right. Leave the pressures as they are"
  # Run plan on crossing the line after a hot lap (docs/17). One per line crossing.
  - id: plan_push
    sessions: [qualifying]
    priority: 2
    when: "phase == 'flying' and run_plan == 'push' and run_plan_reason != 'driver' and sector == 0"
    clear_when: "sector != 0"
    cooldown_s: 30
    cooldown_group: run_plan
    requires: [lap_data, car_status]
    say:
      - "Go again. Battery {ers_store_pct:.0f}, tyres are fine"
      - "Keep pushing, battery {ers_store_pct:.0f}"
      - "Tyres are good. Go again, battery {ers_store_pct:.0f}"
      - "Continue pushing. Battery at {ers_store_pct:.0f}"
    on_ack:
      - "Copy. Go get it"
      - "Copy that. Full send"
      - "Understood. Push on"
      - "Copy, go and get it"
    on_neg:
      - "Understood, your call. Cool this one then"
      - "Copy. Your call"
      - "Your call. Cool the tyres on this lap"
      - "Understood. We'll cool it this lap"
  - id: plan_cool
    sessions: [qualifying]
    priority: 2
    when: "phase == 'flying' and run_plan == 'cool' and run_plan_reason != 'invalid' and sector == 0"
    clear_when: "sector != 0"
    cooldown_s: 30
    cooldown_group: run_plan
    requires: [lap_data, car_status]
    say:
      - "{run_plan_why}. Cool lap, recharge, go again"
      - "{run_plan_why}. Back off, recharge"
      - "{run_plan_why}. Take a cool lap, recharge, then go again"
      - "{run_plan_why}. Ease off and recharge"
    on_ack:
      - "Copy. Recharge mode"
      - "Copy that. Cool it"
      - "Understood. Recharge mode"
      - "Copy, cool lap and recharge"
    on_neg:
      - "Understood, pushing. Watch the battery"
      - "Copy, go again. Battery's low"
      - "Your call, push on. Keep an eye on the battery"
      - "Understood. Go again, battery is low"
  - id: plan_push_now
    sessions: [qualifying]
    priority: 2
    when: "phase == 'flying' and run_plan == 'push_now' and sector == 0"
    clear_when: "sector != 0"
    cooldown_s: 30
    cooldown_group: run_plan
    requires: [lap_data, car_status]
    say:
      - "{run_plan_why}, no time to cool. Push, battery {ers_store_pct:.0f}"
      - "{run_plan_why}. No cool lap, go again"
      - "{run_plan_why}. No time for a cool lap. Push, battery {ers_store_pct:.0f}"
      - "{run_plan_why}. Push again, no time to recharge"
    severity:
      - when: "run_plan_reason == 'fuel'"
        say:
          - "{run_plan_why}. Push, battery {ers_store_pct:.0f}"
          - "{run_plan_why}. Go again"
          - "{run_plan_why}. Battery {ers_store_pct:.0f}, push now"
          - "{run_plan_why}. You're ready to go again"
    on_ack:
      - "Copy. Go get it"
      - "Copy that"
      - "Understood. Push now"
      - "Copy, going again"
    on_neg:
      - "Understood. Your call"
      - "Copy, noted"
      - "Understood, we'll follow your call"
      - "Copy, your decision"
  - id: plan_box
    sessions: [qualifying]
    priority: 2
    when: "phase == 'flying' and run_plan == 'box' and run_plan_reason != 'safe' and sector == 0"
    clear_when: "sector != 0"
    cooldown_s: 120
    cooldown_group: run_plan
    requires: [lap_data, car_status]
    say:
      - "{run_plan_why}. Run done, garage"
      - "{run_plan_why}. Run over, garage"
      - "{run_plan_why}. That's the run, back to the garage"
      - "{run_plan_why}. End of the run, return to the garage"
    on_ack:
      - "Copy. Garage"
      - "Copy that. Good run"
      - "Understood, back to the garage"
      - "Copy, that's the run"
    on_neg:
      - "Understood, staying out. Your call"
      - "Copy, stay out"
      - "Your call. We'll stay out"
      - "Understood, continue the run"
  - id: plan_box_safe
    sessions: [qualifying]
    priority: 2
    when: "phase == 'flying' and run_plan == 'box' and run_plan_reason == 'safe' and sector == 0"
    clear_when: "sector != 0"
    cooldown_s: 30
    cooldown_group: run_plan
    requires: [lap_data, session_history]
    say:
      - "Box, box. You're {quali_margin_s:.1f} clear, save the set"
      - "You're {quali_margin_s:.1f} clear. Bring it in, save the set"
      - "You're clear by {quali_margin_s:.1f}. Box now and save the tyres"
      - "Margin is {quali_margin_s:.1f}. Bring it in, preserve the set"
    on_ack:
      - "Copy, box this lap. We save the set"
      - "Copy that. Bring it in"
      - "Understood, pit this lap and save the tyres"
      - "Copy, box now"
    on_neg:
      - "Understood, staying out. Keep it clean"
      - "Copy, your call. No risks"
      - "Your call, stay out. Keep it clean"
      - "Understood. No risks if you stay out"
  # Cool-down lap coaching.
  # Cool lap by the plan, but the driver is on push pace: ask.
  # No answer within the window counts as a push (docs/17).
  - id: cool_push_check
    sessions: [qualifying]
    priority: 1
    urgency: execution
    when: "cool_push_suspect"
    still_true: "cool_lap"
    clear_when: "not cool_lap"
    response_window_s: 5
    no_response: ack
    requires: [lap_data, car_status, car_telemetry]
    say:
      - "Looks like a push lap. Confirm?"
      - "You're on push pace. Hot lap?"
      - "Push lap now. Confirm?"
      - "You're at hot-lap pace. Shall we go?"
    on_ack:
      - "Copy, hot lap. Go get it"
      - "Copy. Full send"
      - "Understood, hot lap. Push now"
      - "Copy, go for the lap"
    on_neg:
      - "Copy, cool lap. Recharge mode"
      - "Understood, cooling. Back off"
      - "Understood, cool lap and recharge"
      - "Copy, ease off and recharge"
  - id: cool_recharge
    sessions: [qualifying]
    priority: 2
    when: "cool_lap and run_plan != 'cool' and not cool_prep and sector <= 1"
    clear_when: "not cool_lap"
    still_true: "cool_lap"
    requires: [lap_data, car_status]
    say:
      - "Recharge mode. Harvest, easy on tyres"
      - "Recharge mode. Gentle throttle"
      - "Set recharge mode. Harvest and look after the tyres"
      - "Recharge now. Keep the throttle gentle"
  - id: cool_recharge_check
    sessions: [qualifying]
    priority: 2
    # Battery near full or the hot-lap prep zone: the driver is right to be out of recharge.
    when: "cool_lap and not cool_push_suspect and not cool_prep and ers_store_pct < th.cool_recharge_full_pct and lap_distance < track_length_m - th.cool_hot_mode_m and th.ers_recharge_mode >= 0 and ers_deploy_mode != th.ers_recharge_mode and cool_elapsed_s >= 15"
    clear_when: "not cool_lap or ers_deploy_mode == th.ers_recharge_mode or ers_store_pct >= th.cool_recharge_full_pct or lap_distance >= track_length_m - th.cool_hot_mode_m"
    still_true: "cool_lap and not cool_push_suspect and not cool_prep and ers_deploy_mode != th.ers_recharge_mode and ers_store_pct < th.cool_recharge_full_pct and lap_distance < track_length_m - th.cool_hot_mode_m"
    requires: [car_status]
    say:
      - "Not in recharge. Switch it"
      - "Recharge mode, please. Still deploying"
      - "Battery's not charging. Flick it to recharge"
      - "Switch to recharge mode. You're not in it"
      - "Still deploying. Select recharge mode"
      - "Battery isn't charging. Set recharge mode"
  - id: cool_status
    sessions: [qualifying]
    priority: 3
    brief: "Battery {ers_store_pct:.0f} percent, {cool_tyre_hint}"
    when: "cool_lap and not cool_prep and sector == 1"
    clear_when: "not cool_lap"
    still_true: "cool_lap and not cool_prep"
    requires: [car_status, car_telemetry]
    say:
      - "Battery {ers_store_pct:.0f}. {cool_tyre_hint}"
      - "{ers_store_pct:.0f} percent in the battery. {cool_tyre_hint}"
      - "Battery at {ers_store_pct:.0f} percent. {cool_tyre_hint}"
      - "{ers_store_pct:.0f} battery remaining. {cool_tyre_hint}"
  - id: cool_vs_pole
    sessions: [qualifying]
    priority: 3
    brief: "{pole_gap_s:.1f} to pole, sector {pole_worst_sector}"
    when: "cool_lap and not cool_prep and sector == 1 and pole_gap_ms > 0 and pole_worst_sector > 0 and pole_worst_sector_s <= pole_gap_s"
    clear_when: "not cool_lap"
    still_true: "cool_lap and not cool_prep"
    requires: [session_history]
    say:
      - "{pole_gap_s:.1f} to pole. Most in sector {pole_worst_sector}, {pole_worst_sector_s:.1f}"
      - "{pole_gap_s:.1f} to pole. Sector {pole_worst_sector}, {pole_worst_sector_s:.1f}"
      - "Pole is {pole_gap_s:.1f} away. Sector {pole_worst_sector} lost {pole_worst_sector_s:.1f}"
      - "{pole_gap_s:.1f} off pole. Biggest loss in sector {pole_worst_sector}, {pole_worst_sector_s:.1f}"
  - id: cool_vs_pole_split
    sessions: [qualifying]
    priority: 3
    when: "cool_lap and not cool_prep and sector == 1 and pole_gap_ms > 0 and pole_worst_sector > 0 and pole_worst_sector_s > pole_gap_s"
    clear_when: "not cool_lap"
    still_true: "cool_lap and not cool_prep"
    requires: [session_history]
    say:
      - "{pole_gap_s:.1f} to pole. Sector {pole_worst_sector} costs {pole_worst_sector_s:.1f}, you gain elsewhere"
      - "{pole_gap_s:.1f} to pole. Lose {pole_worst_sector_s:.1f} in sector {pole_worst_sector}, gain some back"
      - "{pole_gap_s:.1f} off pole. Sector {pole_worst_sector} costs {pole_worst_sector_s:.1f}, gain it elsewhere"
      - "Pole is {pole_gap_s:.1f} away. Lost {pole_worst_sector_s:.1f} in sector {pole_worst_sector}, gained elsewhere"
  - id: cool_mistakes
    sessions: [qualifying]
    priority: 3
    urgency: coaching
    location_ref: true
    supersedes: [saved_moment]
    when: "cool_lap and not cool_prep and sector >= 1 and last_hot_mistakes != ''"
    clear_when: "not cool_lap"
    still_true: "cool_lap and not cool_prep"
    requires: [lap_data]
    say:
      - "Last lap: {last_hot_mistakes}"
      - "On that lap, {last_hot_mistakes}"
      - "Mistakes on the last lap: {last_hot_mistakes}"
      - "{last_hot_mistakes} on that lap"
  - id: cool_car_behind
    sessions: [qualifying]
    priority: 1
    urgency: safety
    when: "(cool_lap or phase == 'out_lap') and hot_car_behind_s <= th.cool_car_behind_s"
    clear_when: "hot_car_behind_s > th.cool_car_behind_s + 2"
    still_true: "hot_car_behind_s <= th.cool_car_behind_s + 1"
    cooldown_s: 20
    cooldown_group: car_behind
    requires: [lap_data]
    say:
      - "Hot lap behind, {hot_car_behind_s:.1f} seconds. Off the line"
      - "Hot lap behind. Move over"
      - "Fast car behind, {hot_car_behind_s:.1f} seconds. Clear the line"
      - "A car is on a hot lap behind. Move off the line"
  - id: cool_extend
    sessions: [qualifying]
    priority: 1
    urgency: execution
    when: "cool_prep and cool_extend"
    clear_when: "not cool_lap"
    requires: [lap_data, car_status]
    say:
      - "Battery {ers_store_pct:.0f}, need {ers_need_pct:.0f}. One more cool lap"
      - "Battery {ers_store_pct:.0f}. Keep harvesting"
      - "Battery {ers_store_pct:.0f}. One more recharge lap"
      - "Battery at {ers_store_pct:.0f}, target {ers_need_pct:.0f}. Cool one more lap"
      - "{ers_store_pct:.0f} battery. Stay in recharge for another lap"
      - "One more lap harvesting. Battery at {ers_store_pct:.0f}"
    on_ack:
      - "Copy. Stay in recharge"
      - "Copy that. One more cool lap"
      - "Understood. Recharge for another lap"
      - "Copy, one more cool lap"
    on_neg:
      - "Copy, pushing. Battery short"
      - "Copy, go now. Battery's low"
      - "Understood, push now. Battery is short"
      - "Copy, go now with the low battery"
  - id: lap_deleted
    sessions: [qualifying]
    priority: 1
    urgency: execution
    resolved_by: [quali_through]
    when: "phase == 'flying' and run_lap_kind == 'hot' and current_lap_invalid and time_for_cool_and_hot and fuel_for_cool_and_hot"
    clear_when: "not current_lap_invalid"
    requires: [lap_data]
    say:
      - "Lap's deleted, track limits. Back off, recharge, we go again"
      - "Lap gone, track limits. Harvest, reset"
      - "Lap deleted. Cool it, go again"
      - "Track limits, lap deleted. Ease off, recharge, then go again"
      - "Lap is gone for track limits. Harvest and reset"
      - "Invalid lap. Cool down, recharge, and try again"
    on_ack:
      - "Copy. Cool it and go again"
      - "Copy that. Recharge"
      - "Understood. Cool lap, then go again"
      - "Copy, recharge and reset"
    on_neg:
      - "Understood, keep pushing. It won't count"
      - "Copy, stay on it"
      - "Your call, continue pushing. The lap won't count"
      - "Copy, keep going"
  - id: next_lap_invalid
    sessions: [qualifying]
    priority: 1
    urgency: execution
    when: "phase == 'flying' and run_plan == 'cool' and run_plan_reason == 'invalid' and sector == 0"
    clear_when: "sector != 0"
    cooldown_s: 30
    cooldown_group: run_plan
    requires: [lap_data, car_status]
    say:
      - "Next lap's gone too, track limits. Cool lap, recharge, we go again"
      - "That one's deleted as well. Harvest this lap, push next time round"
      - "Track limits again. This lap is gone, recharge and try the next one"
      - "Another lap deleted. Harvest now, push next lap"
    on_ack:
      - "Copy. Recharge, go again after this"
      - "Copy that"
      - "Understood. Recharge, then go again next lap"
      - "Copy, cool this lap"
    on_neg:
      - "Understood, keep pushing. It won't count"
      - "Copy, your call"
      - "Your call. Keep pushing, though the lap won't count"
      - "Copy, continue if you want"
  - id: lap_deleted_last
    sessions: [qualifying]
    priority: 1
    urgency: execution
    resolved_by: [quali_through]
    when: "phase == 'flying' and run_lap_kind == 'hot' and current_lap_invalid and not time_for_cool_and_hot and fuel_for_hot_lap"
    clear_when: "not current_lap_invalid"
    requires: [lap_data]
    say:
      - "Lap deleted, no time to cool. Go again"
      - "Lap gone. Stay flat, go again"
      - "No time for a cool lap. Go again from the line"
      - "Lap is gone. Stay on it and go again"
    on_ack:
      - "Copy. Go again from the line"
      - "Copy that"
      - "Understood. Push again from the line"
      - "Copy, going again"
  - id: cool_hot_mode
    sessions: [qualifying]
    priority: 1
    urgency: execution
    when: "cool_prep and not cool_extend and fuel_for_hot_lap"
    clear_when: "not cool_lap"
    requires: [lap_data, car_status]
    say:
      - "Hot lap mode. Battery {ers_store_pct:.0f}. Push from the line"
      - "Hot lap mode. Battery {ers_store_pct:.0f}. Go"
      - "Hot lap setting. Battery {ers_store_pct:.0f}, push from the line"
      - "Battery at {ers_store_pct:.0f}. Hot lap mode, go"
  # Grid drop picked up in quali or a sprint shootout: it moves the race start.
  - id: grid_penalty
    sessions: [practice, qualifying]
    priority: 2
    when: "grid_penalty_recent and grid_penalty_places > 0"
    clear_when: "not grid_penalty_recent"
    cooldown_s: 15
    requires: [event]
    say:
      - "Grid penalty. {grid_penalty_places} places back for the race"
      - "{grid_penalty_places} place grid penalty for the race"
      - "You have a {grid_penalty_places} place penalty for the race"
      - "Grid penalty of {grid_penalty_places} places. That's for the race"
