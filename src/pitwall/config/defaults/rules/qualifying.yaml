rules:
  # Clean-air release at pit exit: speak once when the gap is good, once when a
  # worthwhile wait exists. Shared cooldown group so at most one talks per 30 s.
  - id: release_go
    sessions: [qualifying]
    priority: 2
    when: "phase == 'garage' and release_clean and session_time_left > 60"
    clear_when: "not release_clean or phase != 'garage'"
    cooldown_s: 30
    cooldown_group: release
    requires: [lap_data, session]
    say:
      - "Track's clear at pit exit. Good to go now"
      - "Pit exit is clear. Go when you're ready"
  - id: release_hold
    sessions: [qualifying]
    priority: 2
    when: "phase == 'garage' and not release_clean and release_wait_s < 60 and release_wait_s >= 3 and session_time_left > 60"
    clear_when: "release_clean or phase != 'garage'"
    cooldown_s: 30
    cooldown_group: release
    requires: [lap_data, session]
    say:
      - "Traffic at pit exit. Hold about {release_wait_s:.0f} seconds"
      - "Hold {release_wait_s:.0f} seconds for a gap"
  # Abort advisory: projection is over the cut-off and the lap won't make it.
  - id: abort_lap
    sessions: [qualifying]
    priority: 2
    when: "phase == 'flying' and abort_advised"
    still_true: "abort_advised"
    clear_when: "phase != 'flying'"
    cooldown_s: 90
    requires: [lap_data, session_history]
    say:
      - "Abort the lap, we're {abort_deficit_s:.1f} off the cut. Save the set"
      - "Box this lap, it's not going to be enough"
  - id: quali_through
    sessions: [qualifying]
    priority: 3
    when: "phase == 'flying' and quali_through and sector >= 2"
    clear_when: "not quali_through"
    cooldown_s: 120
    requires: [lap_data, session_history]
    say:
      - "You're safe, that time's through. No need to push"
  # Comfortable margin after a lap: no need to risk the car or a fresh set.
  - id: quali_safe_cut
    sessions: [qualifying]
    priority: 2
    when: "quali_margin_kind == 'cut' and quali_margin_ms >= th.quali_safe_margin_ms and (phase == 'in_lap' or phase == 'pitting' or phase == 'garage')"
    clear_when: "phase == 'out_lap' or quali_margin_ms < th.quali_safe_margin_ms"
    cooldown_s: 120
    requires: [lap_data, session_history]
    say:
      - "You're {quali_margin_s:.1f} clear of the cut. No need to go again, save the set"
      - "That's {quali_margin_s:.1f} inside the cut. Play it safe and keep the tyres"
  - id: quali_safe_pole
    sessions: [qualifying]
    priority: 2
    when: "quali_margin_kind == 'pole' and quali_margin_ms >= th.quali_safe_margin_ms and (phase == 'in_lap' or phase == 'pitting' or phase == 'garage')"
    clear_when: "phase == 'out_lap' or quali_margin_ms < th.quali_safe_margin_ms"
    cooldown_s: 120
    requires: [lap_data, session_history]
    say:
      - "Provisional pole by {quali_margin_s:.1f}. Play it safe, no risks from here"
      - "You're {quali_margin_s:.1f} up on P2. If you go again, a tidy lap is enough"
  # Pressure advice for the next run from the carcass temps on this run's flying laps.
  - id: tyre_pressure_advice
    sessions: [practice, qualifying]
    priority: 2
    when: "(phase == 'in_lap' or phase == 'pitting' or phase == 'garage') and run_flying_s >= th.pressure_min_flying_s and pressure_advice_text != ''"
    clear_when: "phase == 'out_lap'"
    requires: [car_telemetry]
    say:
      - "Pressures for the next run: {pressure_advice_text}"
  - id: tyre_pressure_ok
    sessions: [practice, qualifying]
    priority: 2
    when: "(phase == 'in_lap' or phase == 'pitting' or phase == 'garage') and run_flying_s >= th.pressure_min_flying_s and pressure_advice_text == ''"
    clear_when: "phase == 'out_lap'"
    requires: [car_telemetry]
    say:
      - "Tyre temps were in the window on all four. Leave the pressures"
