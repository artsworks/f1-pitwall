rules:
  # Out-lap tyre check lands in sector 3 (sector index 2): by then the tyres have
  # had two sectors to come in, and every tyre is cold straight out of the pits.
  # Both read the temperature latched at sector-3 entry, so exactly one speaks.
  - id: out_lap_s3_tyres_cold
    sessions: [practice, qualifying, race]
    priority: 2
    when: "phase == 'out_lap' and sector == 2 and s3_entry_coldest_c < th.tyre_inner_cold_c + mode.thermal_warn_offset_c"
    clear_when: "phase != 'out_lap'"
    still_true: "phase == 'out_lap'"
    requires: [car_telemetry, lap_data]
    say:
      - "Tyres still coming in. {coldest_tyre} coldest at {coldest_tyre_c:.0f}, fronts {tyre_inner_front_c:.0f}, rears {tyre_inner_rear_c:.0f}. Work them to the line."
      - "Not there yet. Fronts {tyre_inner_front_c:.0f}, rears {tyre_inner_rear_c:.0f}, {coldest_tyre} the cold one. Keep working them."
      - "Still cool. {coldest_tyre} at {coldest_tyre_c:.0f}. Lean on it through the last sector."
  - id: out_lap_s3_tyres_ready
    sessions: [practice, qualifying, race]
    priority: 2
    when: "phase == 'out_lap' and sector == 2 and s3_entry_coldest_c >= th.tyre_inner_cold_c + mode.thermal_warn_offset_c"
    clear_when: "phase != 'out_lap'"
    still_true: "phase == 'out_lap'"
    requires: [car_telemetry, lap_data]
    say:
      - "Tyres are in. Fronts {tyre_inner_front_c:.0f}, rears {tyre_inner_rear_c:.0f}. Good to push."
      - "Temps look good, fronts {tyre_inner_front_c:.0f}, rears {tyre_inner_rear_c:.0f}. You can go."
      - "That's them in the window. Push when ready."
  - id: front_wing_damage
    sessions: [practice, qualifying, race]
    priority: 2
    when: "phase != 'garage' and th.front_wing_damage_warn_pct <= max(damage.front_left_wing, damage.front_right_wing) < th.front_wing_lost_pct"
    clear_when: "max(damage.front_left_wing, damage.front_right_wing) < th.front_wing_damage_warn_pct"
    still_true: "max(damage.front_left_wing, damage.front_right_wing) >= th.front_wing_damage_warn_pct"
    cooldown_s: 120
    requires: [car_damage]
    say:
      - "Front wing damage, front left {damage.front_left_wing} percent, front right {damage.front_right_wing} percent. Expect understeer."
      - "We've got wing damage. Left {damage.front_left_wing}, right {damage.front_right_wing} percent. It'll push in the slow corners."
    escalate:
      - after: 2
        say:
          - "More wing damage. Left {damage.front_left_wing}, right {damage.front_right_wing} percent. We'll talk about a new nose."
          - "Wing's getting worse, {damage.front_left_wing} and {damage.front_right_wing} percent. Keep it off the kerbs."
  # Wing gone in a race: box for a nose unless the flag is too close.
  - id: front_wing_lost_box
    sessions: [race]
    priority: 1
    when: "phase in ('racing', 'sc', 'vsc') and max(damage.front_left_wing, damage.front_right_wing) >= th.front_wing_lost_pct and laps_remaining > th.pit_min_laps_left"
    clear_when: "max(damage.front_left_wing, damage.front_right_wing) < th.front_wing_lost_pct"
    still_true: "phase in ('racing', 'sc', 'vsc') and max(damage.front_left_wing, damage.front_right_wing) >= th.front_wing_lost_pct"
    cooldown_s: 60
    requires: [car_damage, lap_data]
    say:
      - "Front wing's gone. Box this lap, box this lap for a new nose"
      - "We've lost the front wing. Box, box, new nose this lap"
      - "Wing's broken, front left {damage.front_left_wing}, front right {damage.front_right_wing}. Box this lap"
  - id: front_wing_lost_nurse
    sessions: [race]
    priority: 1
    when: "phase in ('racing', 'sc', 'vsc') and max(damage.front_left_wing, damage.front_right_wing) >= th.front_wing_lost_pct and laps_remaining <= th.pit_min_laps_left"
    clear_when: "max(damage.front_left_wing, damage.front_right_wing) < th.front_wing_lost_pct"
    cooldown_s: 60
    requires: [car_damage, lap_data]
    say:
      - "Front wing's gone, but it's too late to stop. Stay out, nurse it home, it'll push"
      - "Wing's damaged. Not worth a stop now, bring it home, early on the brakes"
  - id: puncture
    sessions: [practice, qualifying, race]
    priority: 1
    when: "phase not in ('garage', 'in_lap', 'finished') and puncture_corner != ''"
    clear_when: "puncture_corner == ''"
    still_true: "puncture_corner != ''"
    cooldown_s: 60
    requires: [car_damage]
    say:
      - "Puncture, {puncture_corner}. Box, box. Bring it back steady, off the racing line"
      - "We've got a puncture, {puncture_corner}. Box this lap, easy through the fast stuff"
      - "{puncture_corner} tyre's gone. Box, box, nurse it back"
  - id: rear_wing_damage
    sessions: [practice, qualifying, race]
    priority: 2
    when: "phase != 'garage' and damage.rear_wing >= th.damage_warn_pct"
    clear_when: "damage.rear_wing < th.damage_warn_pct"
    cooldown_s: 120
    requires: [car_damage]
    say:
      - "Rear wing damage, {damage.rear_wing} percent. Less rear grip, gentle on the throttle out of the slow corners"
      - "We've got {damage.rear_wing} percent rear wing damage. Watch the rear on corner exit"
  - id: floor_damage
    sessions: [practice, qualifying, race]
    priority: 2
    when: "phase != 'garage' and max(damage.floor, damage.diffuser, damage.sidepod) >= th.damage_warn_pct"
    clear_when: "max(damage.floor, damage.diffuser, damage.sidepod) < th.damage_warn_pct"
    cooldown_s: 120
    requires: [car_damage]
    say:
      - "Floor damage. We've lost downforce, brake a touch earlier into the fast stuff"
      - "Damage on the floor. Less grip in the high-speed corners, adjust your lines"
  - id: gearbox_damage
    sessions: [practice, qualifying, race]
    priority: 2
    when: "phase != 'garage' and damage.gearbox >= th.powertrain_damage_warn_pct"
    clear_when: "damage.gearbox < th.powertrain_damage_warn_pct"
    cooldown_s: 180
    requires: [car_damage]
    say:
      - "Gearbox damage, {damage.gearbox} percent. Short-shift and be gentle on the downshifts"
      - "Gearbox is at {damage.gearbox} percent damage. Smooth shifts, no kerb abuse"
  - id: engine_damage
    sessions: [practice, qualifying, race]
    priority: 2
    when: "phase != 'garage' and damage.engine >= th.powertrain_damage_warn_pct"
    clear_when: "damage.engine < th.powertrain_damage_warn_pct"
    cooldown_s: 180
    requires: [car_damage]
    say:
      - "Engine damage, {damage.engine} percent. Lift and coast into the big stops, look after it"
      - "Engine's at {damage.engine} percent damage. Short-shift where you can"
  - id: drs_fault
    sessions: [practice, qualifying, race]
    priority: 2
    when: "phase != 'garage' and damage.drs_fault != 0"
    clear_when: "damage.drs_fault == 0"
    requires: [car_damage]
    say:
      - "DRS fault. No DRS for us, overtakes have to come on the brakes"
      - "We've lost DRS, it's faulty. Work the exits instead"
  - id: ers_fault
    sessions: [practice, qualifying, race]
    priority: 1
    when: "phase != 'garage' and damage.ers_fault != 0"
    clear_when: "damage.ers_fault == 0"
    requires: [car_damage]
    say:
      - "ERS fault, no deployment. Protect the braking zones, they'll come at you on the straights"
      - "We've got an ERS fault. No battery, defend the inside"
  # Boost still on when the driver lifts or brakes for a corner means full power on the exit.
  - id: boost_left_on
    sessions: [practice, qualifying, race]
    priority: 1
    when: "boost_on_s >= th.boost_warn_s and (brake >= th.boost_warn_brake or throttle <= th.boost_warn_lift or boost_on_s >= th.boost_max_s)"
    clear_when: "boost_on_s == 0"
    still_true: "boost_on_s > 0"
    requires: [car_status, car_telemetry]
    say:
      - "Boost still on. Turn it off for the exit."
      - "Boost is on. Switch it off before you get on the power."
      - "You've left the boost on. Off for the exit."
    escalate:
      - after: 3
        say:
          - "Boost. Again. Off, please."
          - "Boost is still on, that's {repeat} times now. Habit before exits."
          - "Boost. You know the drill."
  - id: yellow_ahead
    sessions: [practice, qualifying, race]
    priority: 1
    when: "yellow_ahead_m <= th.yellow_warn_ahead_m"
    clear_when: "yellow_ahead_m > th.yellow_warn_ahead_m + 300"
    still_true: "yellow_ahead_m <= th.yellow_warn_ahead_m or yellow_here"
    requires: [session, lap_data]
    say:
      - "Yellow ahead, sector {yellow_ahead_sector}, {yellow_ahead_m:.0f} metres. Careful, no overtaking."
      - "Yellow flag coming up in sector {yellow_ahead_sector}, {yellow_ahead_m:.0f} metres. Lift and hold position."
      - "Yellow, {yellow_ahead_m:.0f} metres ahead. No passing, be ready for a car on track."
  - id: yellow_behind
    sessions: [practice, qualifying, race]
    priority: 3
    when: "yellow_behind_m <= th.yellow_info_behind_m and phase not in ('sc', 'vsc', 'red_flag')"
    clear_when: "yellow_behind_m > th.yellow_info_behind_m"
    still_true: "yellow_behind_m <= th.yellow_info_behind_m and phase not in ('sc', 'vsc', 'red_flag')"
    cooldown_s: 30
    requires: [session, lap_data]
    say:
      - "Yellow behind you in sector {yellow_behind_sector}. You're clear, ignore it."
      - "Yellow's behind you, sector {yellow_behind_sector}. Not your problem, keep going."
      - "Someone's off behind, sector {yellow_behind_sector}. You're clear."
  # Same braking zone as on earlier laps: coach the corner, not the event.
  - id: lockup_front_same_spot
    sessions: [practice, qualifying, race]
    priority: 3
    when: "lockup == 'front' and lockup_spot_laps >= 1"
    clear_when: "lockup == ''"
    cooldown_s: 150
    cooldown_group: lockup_front
    requires: [motion_ex]
    say:
      - "Locking up in the same braking zone as last lap. Brake a few metres earlier there."
      - "Same corner, same lock-up, {lockup_wheel}. Move your braking point back."
      - "That's the one you locked last time too. Earlier and softer on the pedal there."
    escalate:
      - after: 3
        say:
          - "That braking zone again, {lockup_spot_laps} laps running now. Brake earlier, or a click of bias rearward from {front_brake_bias}."
          - "Same place, {lockup_spot_laps} laps in a row. Pick a new marker, or take a click of bias back from {front_brake_bias}."
  - id: lockup_front
    sessions: [practice, qualifying, race]
    priority: 3
    when: "lockup == 'front' and lockup_spot_laps == 0"
    clear_when: "lockup == ''"
    cooldown_s: 60
    cooldown_group: lockup_front
    requires: [motion_ex]
    say:
      - "Lock-up, {lockup_wheel}. Ease the brake pressure into the corner, that costs tyre."
      - "Locked the {lockup_wheel} there. Bit less pedal on the way in."
      - "That's a flat spot waiting to happen, {lockup_wheel}. Brake a touch earlier."
      - "{lockup_wheel} locking on entry. Ease off the initial hit."
    escalate:
      - after: 3
        say:
          - "Another lock-up. That's {repeat} in the last ten minutes."
          - "Front's locking again. The tyres are keeping count, even if you aren't."
          - "Lock-up. We brought these tyres to race on, not to sand down."
      - after: 6
        say:
          - "Lock-up number {repeat}. I'll just leave that there."
          - "Again. Brake earlier, it's cheaper than a new set."
          - "You know what I'm going to say."
  - id: lockup_rear
    sessions: [practice, qualifying, race]
    priority: 2
    when: "lockup == 'rear'"
    clear_when: "lockup == ''"
    cooldown_s: 45
    requires: [motion_ex]
    say:
      - "Rears locking, {lockup_wheel}. Move the brake bias forward, you're on {front_brake_bias}."
      - "Rear's locking on entry. Bias forward a click or two from {front_brake_bias}."
      - "{lockup_wheel} locked. Try more front bias, currently {front_brake_bias}."
    escalate:
      - after: 2
        say:
          - "Rears still stepping out on entry. Bias forward from {front_brake_bias}, or more off-throttle diff, you're on {setup_off_throttle_diff} percent."
      - after: 3
        say:
          - "Rears again. Bias forward, you're still on {front_brake_bias}."
          - "That's {repeat} rear lock-ups. The bias won't move itself, {front_brake_bias} now."
  # Spun: first check the mirrors. A car closing from behind means hold the
  # car until it has passed; once clear, rejoin gently on overheated rears.
  - id: spun_rejoin_traffic
    sessions: [practice, qualifying, race]
    priority: 1
    when: "spun and traffic_behind_s <= th.rejoin_traffic_s"
    clear_when: "not spun"
    still_true: "spun and traffic_behind_s <= th.rejoin_traffic_s + 1"
    requires: [motion_ex, lap_data]
    cooldown_s: 8
    say:
      - "Car coming, {traffic_behind_s:.1f} seconds. Hold it there, let it through."
      - "Wait, wait. Traffic behind, {traffic_behind_s:.1f} seconds. Stay put."
      - "Hold the car. One coming through, {traffic_behind_s:.1f} seconds."
  - id: spun_rejoin
    sessions: [practice, qualifying, race]
    priority: 1
    when: "spun and traffic_behind_s > th.rejoin_traffic_s + 2"
    clear_when: "not spun"
    still_true: "spun and traffic_behind_s > th.rejoin_traffic_s + 2"
    requires: [motion_ex]
    cooldown_s: 8
    max_per_stint: 5
    say:
      - "You're clear behind. Easy on the throttle, the rears are cooked."
      - "Clear to rejoin. Gentle on the power, no grip in the rears."
      - "Nobody coming. Short-shift and feather it, the rears are hot."
    escalate:
      - after: 2
        say:
          - "Lost it again. Clear behind, same deal, gentle on the throttle."
          - "That's {repeat} moments now. Clear to rejoin, a bit less throttle on the exits."
          - "Number {repeat}. You're clear. Easy on the power, let the rears cool."
  # Practice: a deleted lap is not a benchmark; say so once and give the reset.
  - id: practice_lap_invalid
    sessions: [practice]
    priority: 2
    when: "phase == 'flying' and current_lap_invalid and not cool_lap and not driving_wrong_way"
    clear_when: "not current_lap_invalid"
    requires: [lap_data]
    say:
      - "Lap's deleted, track limits. Won't count as a benchmark. Finish it for the tyre data and go again next lap."
      - "That one's invalid. Keep it for practice, not the timesheet. Next lap, two wheels inside the white line."
      - "Lap deleted. Don't chase this one. Reset and give me a clean one next time round."
  # Just out of the pit lane: a car closing on the merge.
  - id: pit_exit_traffic
    sessions: [practice, qualifying, race]
    priority: 1
    when: "pit_exit_s <= 3 and traffic_behind_s <= th.pit_exit_traffic_s"
    clear_when: "pit_exit_s > 10"
    still_true: "traffic_behind_s <= th.pit_exit_traffic_s + 1"
    cooldown_s: 30
    cooldown_group: car_behind
    requires: [lap_data]
    say:
      - "Car coming as you exit, {traffic_behind_s:.1f} seconds. Stay off the line."
      - "Watch the merge, one closing, {traffic_behind_s:.1f} seconds behind."
      - "Traffic on the exit. Keep right of the line and let it go."
  # Out-lap, last sector: what the hot lap will start into. One per out-lap.
  - id: prep_car_behind
    sessions: [practice, qualifying]
    priority: 2
    when: "phase == 'out_lap' and dist_to_line_m <= th.prep_gap_m and traffic_behind_kind == 'flying' and traffic_behind_s <= th.prep_behind_s"
    clear_when: "phase != 'out_lap'"
    still_true: "phase == 'out_lap' and traffic_behind_kind == 'flying'"
    cooldown_s: 60
    cooldown_group: prep_gap
    requires: [lap_data]
    say:
      - "Car behind on a push lap, {traffic_behind_s:.1f} seconds. Let it go, then start yours."
      - "Push lap coming up behind. Move over, let it by before the line."
      - "Someone's on a lap behind you. Give them the track, then go."
  - id: slow_car_ahead
    sessions: [practice, qualifying]
    priority: 1
    when: "phase == 'flying' and run_lap_kind != 'cool' and (traffic_ahead_kind != 'flying' or traffic_ahead_slow) and traffic_ahead_closing_s <= th.slow_car_warn_s and traffic_ahead_m >= 80"
    clear_when: "traffic_ahead_m > 400 or traffic_ahead_kind == ''"
    cooldown_s: 30
    requires: [lap_data, car_telemetry]
    say:
      - "Slow car ahead, {traffic_ahead_m:.0f} metres"
      - "Traffic ahead, {traffic_ahead_m:.0f} metres. Watch your line"
      - "Heads up, slow car {traffic_ahead_m:.0f} metres up the road"
  - id: prep_traffic_ahead
    sessions: [practice, qualifying]
    priority: 2
    when: "phase == 'out_lap' and dist_to_line_m <= th.prep_gap_m and traffic_ahead_kind != 'flying' and traffic_ahead_s <= th.prep_traffic_s"
    clear_when: "phase != 'out_lap'"
    still_true: "phase == 'out_lap' and traffic_ahead_s <= th.prep_traffic_s + 1"
    cooldown_s: 60
    cooldown_group: prep_gap
    requires: [lap_data]
    say:
      - "Slow car {traffic_ahead_s:.1f} ahead. Back off and make a gap before the line."
      - "Traffic ahead, {traffic_ahead_s:.1f} seconds, on a slow lap. Drop back a bit."
      - "You'll catch the car ahead. Ease off, give yourself some room."
  - id: prep_dirty_air
    sessions: [practice, qualifying]
    priority: 2
    when: "phase == 'out_lap' and dist_to_line_m <= th.prep_gap_m and traffic_ahead_kind == 'flying' and traffic_ahead_s < th.tow_min_s"
    clear_when: "phase != 'out_lap'"
    still_true: "phase == 'out_lap' and traffic_ahead_s < th.tow_min_s + 0.3"
    cooldown_s: 60
    cooldown_group: prep_gap
    requires: [lap_data]
    say:
      - "Too close to the car ahead, {traffic_ahead_s:.1f}. Drop back, you'll be in dirty air."
      - "Only {traffic_ahead_s:.1f} to the car in front. Let it go a bit more."
  - id: prep_tow
    sessions: [practice, qualifying]
    priority: 2
    when: "phase == 'out_lap' and dist_to_line_m <= th.prep_gap_m and traffic_ahead_kind == 'flying' and traffic_ahead_s >= th.tow_min_s and traffic_ahead_s <= th.tow_max_s"
    clear_when: "phase != 'out_lap'"
    still_true: "phase == 'out_lap' and traffic_ahead_kind == 'flying'"
    cooldown_s: 60
    cooldown_group: prep_gap
    requires: [lap_data]
    say:
      - "Car {traffic_ahead_s:.1f} ahead on a push lap. That's a tow, use it on the straights."
      - "Nice gap, {traffic_ahead_s:.1f} to the car ahead. You'll get a tow."
      - "Tow's there, {traffic_ahead_s:.1f} ahead. Stay in it down the straights."
  - id: prep_clear
    sessions: [practice, qualifying]
    priority: 3
    when: "phase == 'out_lap' and dist_to_line_m <= th.prep_gap_m and traffic_ahead_s > th.prep_clear_s and not (traffic_behind_kind == 'flying' and traffic_behind_s <= th.prep_behind_s)"
    clear_when: "phase != 'out_lap'"
    still_true: "phase == 'out_lap' and traffic_ahead_s > th.prep_clear_s"
    cooldown_s: 60
    cooldown_group: prep_gap
    requires: [lap_data]
    say:
      - "Clear ahead. Good gap for your lap."
      - "Nobody in front, clean air. It's all yours."
      - "Track's clear ahead. Good spacing."
  # Red flag: all sessions; repeats on cooldown while the flag stays out.
  - id: red_flag
    priority: 1
    when: "red_flag"
    clear_when: "not red_flag"
    cooldown_s: 60
    say:
      - "Red flag. Red flag. Slow down and return to the pits"
      - "Red flag, red flag. Back to the pits, careful on the way in"

  # Abnormal per-corner / per-axle wear (SessionState._note_corner_wear).
  # Loaded corner: front left and rear left carry the load in right-handers.
  - id: wear_front_left
    sessions: [practice, race]
    priority: 2
    when: "wear_hot_corner == 'front left'"
    clear_when: "wear_hot_corner != 'front left'"
    cooldown_s: 300
    requires: [car_damage, lap_data]
    say:
      - "Front left is wearing {wear_hot_ratio:.1f} times the others, {wear_hot_pct:.0f} percent. Protect it in the right-handers, less entry speed, no sliding"
      - "Front left's taking a beating, {wear_hot_ratio:.1f} times the rest. Brake a touch earlier into the right-handers, don't slide it"
      - "Watch the front left, it's wearing {wear_hot_ratio:.1f} times faster. Slow in, fast out in the right-handers"
  - id: wear_front_right
    sessions: [practice, race]
    priority: 2
    when: "wear_hot_corner == 'front right'"
    clear_when: "wear_hot_corner != 'front right'"
    cooldown_s: 300
    requires: [car_damage, lap_data]
    say:
      - "Front right is wearing {wear_hot_ratio:.1f} times the others, {wear_hot_pct:.0f} percent. Protect it in the left-handers, less entry speed, no sliding"
      - "Front right's taking a beating, {wear_hot_ratio:.1f} times the rest. Brake a touch earlier into the left-handers, don't slide it"
      - "Watch the front right, it's wearing {wear_hot_ratio:.1f} times faster. Slow in, fast out in the left-handers"
  - id: wear_rear_left
    sessions: [practice, race]
    priority: 2
    when: "wear_hot_corner == 'rear left'"
    clear_when: "wear_hot_corner != 'rear left'"
    cooldown_s: 300
    requires: [car_damage, lap_data]
    say:
      - "Rear left is wearing {wear_hot_ratio:.1f} times the others, {wear_hot_pct:.0f} percent. Smooth on the throttle out of the right-handers, short-shift"
      - "Rear left's going, {wear_hot_ratio:.1f} times the rest. Easy with boost out of the right-handers, no wheelspin"
      - "Look after the rear left, {wear_hot_ratio:.1f} times faster wear. Short-shift out of the slow right-handers"
  - id: wear_rear_right
    sessions: [practice, race]
    priority: 2
    when: "wear_hot_corner == 'rear right'"
    clear_when: "wear_hot_corner != 'rear right'"
    cooldown_s: 300
    requires: [car_damage, lap_data]
    say:
      - "Rear right is wearing {wear_hot_ratio:.1f} times the others, {wear_hot_pct:.0f} percent. Smooth on the throttle out of the left-handers, short-shift"
      - "Rear right's going, {wear_hot_ratio:.1f} times the rest. Easy with boost out of the left-handers, no wheelspin"
      - "Look after the rear right, {wear_hot_ratio:.1f} times faster wear. Short-shift out of the slow left-handers"
  - id: wear_fronts
    sessions: [practice, race]
    priority: 2
    when: "wear_hot_corner == 'fronts'"
    clear_when: "wear_hot_corner != 'fronts'"
    cooldown_s: 300
    requires: [car_damage, lap_data]
    say:
      - "Fronts are wearing {wear_hot_ratio:.1f} times the rears. That's understeer eating them. Slow in, fast out"
      - "Front tyres going {wear_hot_ratio:.1f} times faster than the rears. Less entry speed, don't push through the understeer"
      - "We're front limited, {wear_hot_ratio:.1f} times the rears. Brake straighter and let the car rotate"
  - id: wear_rears
    sessions: [practice, race]
    priority: 2
    when: "wear_hot_corner == 'rears'"
    clear_when: "wear_hot_corner != 'rears'"
    cooldown_s: 300
    requires: [car_damage, lap_data]
    say:
