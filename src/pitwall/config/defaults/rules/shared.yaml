rules:
  # Out-lap tyre check lands in sector 3 (sector index 2): by then the tyres have
  # had two sectors to come in, and every tyre is cold straight out of the pits.
  # Both read the temperature latched at sector-3 entry, so exactly one speaks.
  - id: out_lap_s3_tyres_cold
    sessions: [practice, qualifying, race]
    priority: 2
    when: "phase == 'out_lap' and sector == 2 and s3_entry_coldest_c < (th.tyre_inner_cold_by_compound_c[tyre_compound] if tyre_compound in th.tyre_inner_cold_by_compound_c else th.tyre_inner_cold_c) + mode.thermal_warn_offset_c"
    clear_when: "phase != 'out_lap'"
    still_true: "phase == 'out_lap'"
    requires: [car_telemetry, lap_data]
    say:
      - "Tyres still coming in. {coldest_tyre} coldest at {coldest_tyre_c:.0f}. Keep working them."
      - "Fronts {tyre_inner_front_c:.0f}, rears {tyre_inner_rear_c:.0f}. {coldest_tyre} is cold."
      - "{coldest_tyre} still cool, {coldest_tyre_c:.0f}. Lean on it."
  - id: out_lap_s3_tyres_ready
    sessions: [practice, qualifying, race]
    priority: 2
    when: "phase == 'out_lap' and sector == 2 and s3_entry_coldest_c >= (th.tyre_inner_cold_by_compound_c[tyre_compound] if tyre_compound in th.tyre_inner_cold_by_compound_c else th.tyre_inner_cold_c) + mode.thermal_warn_offset_c"
    clear_when: "phase != 'out_lap'"
    still_true: "phase == 'out_lap'"
    requires: [car_telemetry, lap_data]
    say:
      - "Tyres are in, {tyre_inner_front_c:.0f} and {tyre_inner_rear_c:.0f}. Push."
      - "Temps good. Fronts {tyre_inner_front_c:.0f}, rears {tyre_inner_rear_c:.0f}. Go."
      - "Tyres in the window. Push."
  - id: front_wing_damage
    sessions: [practice, qualifying, race]
    priority: 2
    when: "phase != 'garage' and th.front_wing_damage_warn_pct <= max(damage.front_left_wing, damage.front_right_wing) < th.front_wing_lost_pct"
    clear_when: "max(damage.front_left_wing, damage.front_right_wing) < th.front_wing_damage_warn_pct"
    still_true: "max(damage.front_left_wing, damage.front_right_wing) >= th.front_wing_damage_warn_pct"
    cooldown_s: 120
    requires: [car_damage]
    say:
      - "Front wing damage, {damage.front_left_wing} and {damage.front_right_wing} percent. Understeer."
      - "Wing damage, left {damage.front_left_wing}, right {damage.front_right_wing}. It'll push."
    escalate:
      - after: 2
        say:
          - "More wing damage, {damage.front_left_wing} and {damage.front_right_wing}. Thinking new nose."
          - "Wing worse, {damage.front_left_wing} and {damage.front_right_wing}. Off the kerbs."
  # Wing gone in a race: box for a nose unless the flag is too close.
  - id: front_wing_lost_box
    sessions: [race]
    priority: 1
    when: "phase in ('racing', 'sc', 'vsc') and max(damage.front_left_wing, damage.front_right_wing) >= th.front_wing_lost_pct and laps_remaining > th.pit_min_laps_left"
    clear_when: "max(damage.front_left_wing, damage.front_right_wing) < th.front_wing_lost_pct"
    still_true: "phase in ('racing', 'sc', 'vsc') and max(damage.front_left_wing, damage.front_right_wing) >= th.front_wing_lost_pct and laps_remaining > th.pit_min_laps_left"
    cooldown_s: 60
    conflict_group: front_wing_lost
    requires: [car_damage, lap_data]
    say:
      - "Front wing's gone. Box, box, new nose"
      - "Lost the front wing. Box this lap"
      - "Wing broken, {damage.front_left_wing} and {damage.front_right_wing}. Box"
  - id: front_wing_lost_nurse
    sessions: [race]
    priority: 1
    when: "phase in ('racing', 'sc', 'vsc') and max(damage.front_left_wing, damage.front_right_wing) >= th.front_wing_lost_pct and laps_remaining <= th.pit_min_laps_left"
    clear_when: "max(damage.front_left_wing, damage.front_right_wing) < th.front_wing_lost_pct"
    still_true: "phase in ('racing', 'sc', 'vsc') and max(damage.front_left_wing, damage.front_right_wing) >= th.front_wing_lost_pct and laps_remaining <= th.pit_min_laps_left"
    cooldown_s: 60
    conflict_group: front_wing_lost
    requires: [car_damage, lap_data]
    say:
      - "Wing's gone, too late to stop. Nurse it home"
      - "Wing damaged. No stop, brake early"
  - id: puncture
    sessions: [practice, qualifying, race]
    priority: 1
    when: "phase not in ('garage', 'in_lap', 'finished') and puncture_corner != ''"
    clear_when: "puncture_corner == ''"
    still_true: "puncture_corner != ''"
    cooldown_s: 60
    requires: [car_damage]
    say:
      - "Puncture, {puncture_corner}. Box, box. Steady"
      - "Puncture {puncture_corner}. Box, easy in fast corners"
      - "{puncture_corner} tyre's gone. Box, box, nurse it back"
  - id: rear_wing_damage
    sessions: [practice, qualifying, race]
    priority: 2
    when: "phase != 'garage' and damage.rear_wing >= th.damage_warn_pct"
    clear_when: "damage.rear_wing < th.damage_warn_pct"
    cooldown_s: 120
    requires: [car_damage]
    say:
      - "Rear wing damage, {damage.rear_wing} percent. Gentle throttle"
      - "{damage.rear_wing} percent rear wing damage. Watch exits"
  - id: floor_damage
    sessions: [practice, qualifying, race]
    priority: 2
    when: "phase != 'garage' and max(damage.floor, damage.diffuser, damage.sidepod) >= th.damage_warn_pct"
    clear_when: "max(damage.floor, damage.diffuser, damage.sidepod) < th.damage_warn_pct"
    cooldown_s: 120
    requires: [car_damage]
    say:
      - "Floor damage. Less downforce, brake earlier"
      - "Floor damage. Less grip in fast corners"
  - id: gearbox_damage
    sessions: [practice, qualifying, race]
    priority: 2
    when: "phase != 'garage' and damage.gearbox >= th.powertrain_damage_warn_pct"
    clear_when: "damage.gearbox < th.powertrain_damage_warn_pct"
    cooldown_s: 180
    requires: [car_damage]
    say:
      - "Gearbox damage, {damage.gearbox} percent. Short-shift"
      - "Gearbox {damage.gearbox} percent. Smooth shifts"
  - id: engine_damage
    sessions: [practice, qualifying, race]
    priority: 2
    when: "phase != 'garage' and damage.engine >= th.powertrain_damage_warn_pct"
    clear_when: "damage.engine < th.powertrain_damage_warn_pct"
    cooldown_s: 180
    requires: [car_damage]
    say:
      - "Engine damage, {damage.engine} percent. Lift and coast"
      - "Engine {damage.engine} percent damage. Short-shift"
  - id: drs_fault
    sessions: [practice, qualifying, race]
    priority: 2
    when: "phase != 'garage' and damage.drs_fault != 0"
    clear_when: "damage.drs_fault == 0"
    requires: [car_damage]
    say:
      - "DRS fault. Pass on the brakes"
      - "No DRS. Work the exits"
  - id: ers_fault
    sessions: [practice, qualifying, race]
    priority: 1
    when: "phase != 'garage' and damage.ers_fault != 0"
    clear_when: "damage.ers_fault == 0"
    requires: [car_damage]
    say:
      - "ERS fault. No deploy"
  # Boost still on when the driver lifts or brakes for a corner means full power on the exit.
  - id: boost_left_on
    sessions: [practice, qualifying, race]
    priority: 1
    when: "boost_on_s >= th.boost_warn_s and (brake >= th.boost_warn_brake or throttle <= th.boost_warn_lift)"
    clear_when: "boost_on_s == 0"
    still_true: "boost_on_s > 0"
    requires: [car_status, car_telemetry]
    say:
      - "Boost still on. Turn it off for the exit."
      - "Boost is on. Off before the power."
      - "You've left the boost on. Off for the exit."
    escalate:
      - after: 3
        say:
          - "Boost. Again. Off, please."
          - "Boost still on, {repeat} times now."
          - "Boost. You know the drill."
  - id: yellow_ahead
    sessions: [practice, qualifying, race]
    priority: 1
    when: "yellow_ahead_m <= th.yellow_warn_ahead_m"
    clear_when: "yellow_ahead_m > th.yellow_warn_ahead_m + 300"
    still_true: "yellow_ahead_m <= th.yellow_warn_ahead_m or yellow_here"
    requires: [session, lap_data]
    say:
      - "Yellow ahead, sector {yellow_ahead_sector}, {yellow_ahead_m:.0f} metres. No overtaking."
      - "Yellow, sector {yellow_ahead_sector}. Lift, hold position."
      - "Yellow, {yellow_ahead_m:.0f} metres. Car on track maybe."
  - id: yellow_behind
    sessions: [practice, qualifying, race]
    priority: 3
    when: "yellow_behind_m <= th.yellow_info_behind_m and phase not in ('sc', 'vsc', 'red_flag')"
    clear_when: "yellow_behind_m > th.yellow_info_behind_m"
    still_true: "yellow_behind_m <= th.yellow_info_behind_m and phase not in ('sc', 'vsc', 'red_flag')"
    cooldown_s: 30
    requires: [session, lap_data]
    say:
      - "Yellow behind, sector {yellow_behind_sector}. You're clear."
      - "Yellow behind you. Keep going."
      - "Car off behind. You're clear."
  # Same braking zone as on earlier laps: coach the corner, not the event.
  - id: lockup_front_same_spot
    sessions: [practice, qualifying, race]
    priority: 3
    when: "lockup == 'front' and lockup_spot_laps >= 1"
    clear_when: "lockup == ''"
    cooldown_s: 150
    cooldown_group: lockup_front
    requires: [motion_ex]
    say:
      - "Same lock-up as last lap. Brake earlier there."
      - "Same corner lock-up, {lockup_wheel}. Brake earlier."
      - "Locked there last time too. Softer pedal."
    escalate:
      - after: 3
        say:
          - "Same zone, {lockup_spot_laps} laps. Brake earlier or bias back from {front_brake_bias}."
          - "{lockup_spot_laps} laps same spot. New marker, or bias back from {front_brake_bias}."
  - id: lockup_front
    sessions: [practice, qualifying, race]
    priority: 2
    when: "lockup == 'front' and lockup_spot_laps == 0"
    clear_when: "lockup == ''"
    cooldown_s: 60
    cooldown_group: lockup_front
    requires: [motion_ex]
    say:
      - "Lock-up, {lockup_wheel}. Ease the pressure."
      - "Locked the {lockup_wheel}. Less pedal."
      - "{lockup_wheel} lock-up. Brake earlier."
      - "{lockup_wheel} locking. Softer initial hit."
    escalate:
      - after: 3
        say:
          - "Another lock-up, {repeat} in ten minutes."
          - "Fronts locking again. Tyres are counting."
          - "Lock-up. Save these tyres."
      - after: 6
        say:
          - "Lock-up number {repeat}."
          - "Again. Brake earlier."
          - "You know what I'm going to say."
  - id: lockup_rear
    sessions: [practice, qualifying, race]
    priority: 2
    when: "lockup == 'rear'"
    clear_when: "lockup == ''"
    cooldown_s: 45
    requires: [motion_ex]
    say:
      - "Rears locking, {lockup_wheel}. Bias forward from {front_brake_bias}."
      - "Rear locking. Bias forward from {front_brake_bias}."
      - "{lockup_wheel} locked. More front bias, now {front_brake_bias}."
    escalate:
      - after: 2
        say:
          - "Rears still loose. Bias forward from {front_brake_bias}."
      - after: 3
        say:
          - "Rears again. Bias forward, you're still on {front_brake_bias}."
          - "{repeat} rear lock-ups. Bias still {front_brake_bias}."
  # Spun: first check the mirrors. A car closing from behind means hold the
  # car until it has passed; once clear, rejoin gently on overheated rears.
  - id: spun_rejoin_traffic
    sessions: [practice, qualifying, race]
    priority: 1
    when: "spun and traffic_behind_s <= th.rejoin_traffic_s"
    clear_when: "not spun"
    still_true: "spun and traffic_behind_s <= th.rejoin_traffic_s + 1"
    requires: [motion_ex, lap_data]
    cooldown_s: 8
    say:
      - "Car coming, {traffic_behind_s:.1f} seconds. Hold it."
      - "Wait. Traffic, {traffic_behind_s:.1f} seconds."
      - "Hold. Car in {traffic_behind_s:.1f} seconds."
  # A slide the driver caught without spinning.
  - id: saved_moment
    sessions: [practice, qualifying, race]
    priority: 2
    when: "saved and phase not in ('finished', 'red_flag', 'sc', 'vsc')"
    clear_when: "not saved"
    requires: [motion_ex]
    cooldown_s: 30
    cooldown_group: incident
    say:
      - "Oh, nearly lost it there. Good catch"
      - "Ooh, that was a moment. Nicely saved"
      - "Big slide, well caught. Stay calm"
      - "Whoa, twitchy there. Good hands"
      - "Rear stepped out, you caught it. Keep going"
    severity:
      - when: "save_peak_deg >= 25"
        say:
          - "Wow, that was nearly around. Brilliant save"
          - "Massive save! Breathe"
          - "Nearly spun. Great reactions, ease the rears"
    escalate:
      - after: 3
        say:
          - "{saves} moments now. Smoother throttle"
          - "That's {saves}. Short-shift out of slow corners"
  - id: spun_rejoin
    sessions: [practice, qualifying, race]
    priority: 1
    when: "spun and traffic_behind_s > th.rejoin_traffic_s + 2"
    clear_when: "not spun"
    still_true: "spun and traffic_behind_s > th.rejoin_traffic_s + 2"
    requires: [motion_ex]
    cooldown_s: 8
    max_per_stint: 5
    say:
      - "Clear behind. Easy throttle, rears are hot."
      - "Clear to rejoin. Gentle on the power."
      - "Nobody coming. Short-shift, feather it."
    escalate:
      - after: 2
        say:
          - "Lost it again. Clear, gentle throttle."
          - "{repeat} moments. Clear, less throttle on exits."
          - "Number {repeat}. Clear. Let the rears cool."
  # Practice: a deleted lap is not a benchmark; say so once and give the reset.
  - id: practice_lap_invalid
    sessions: [practice]
    priority: 2
    when: "phase == 'flying' and current_lap_invalid and not cool_lap and not driving_wrong_way"
    clear_when: "not current_lap_invalid"
    requires: [lap_data]
    say:
      - "Lap deleted, track limits. Clean one next."
      - "Lap invalid. Next one, inside the white line."
      - "Lap deleted. Reset, clean one next."
  # Just out of the pit lane: a car closing on the merge.
  - id: pit_exit_traffic
    sessions: [practice, qualifying]
    priority: 1
    when: "pit_exit_s <= 3 and traffic_behind_s <= th.pit_exit_traffic_s"
    clear_when: "pit_exit_s > 10"
    still_true: "traffic_behind_s <= th.pit_exit_traffic_s + 1"
    cooldown_s: 30
    cooldown_group: car_behind
    requires: [lap_data]
    say:
      - "Car coming at exit, {traffic_behind_s:.1f} seconds. Off the line."
      - "Watch the merge, car {traffic_behind_s:.1f} behind."
      - "Traffic at exit. Let it go."
  # Out-lap, last sector: what the hot lap will start into. One per out-lap.
  - id: prep_car_behind
    sessions: [practice, qualifying]
    priority: 2
    when: "phase == 'out_lap' and dist_to_line_m <= th.prep_gap_m and traffic_behind_kind == 'flying' and traffic_behind_s <= th.prep_behind_s"
    clear_when: "phase != 'out_lap'"
    still_true: "phase == 'out_lap' and traffic_behind_kind == 'flying'"
    cooldown_s: 60
    cooldown_group: prep_gap
    requires: [lap_data]
    say:
      - "Push lap behind, {traffic_behind_s:.1f} seconds. Let it by."
      - "Push lap behind. Let it by."
      - "Car on a lap behind. Give room, then go."
  # Hot lap: a car that stays slow until you reach it. A cooling car that starts its lap before you catch it is not traffic.
  - id: slow_car_ahead
    sessions: [practice, qualifying]
    priority: 1
    when: "phase == 'flying' and run_lap_kind != 'cool' and traffic_ahead_closing_s <= th.slow_car_warn_s and traffic_ahead_m >= 80 and (traffic_ahead_state == 'in_lap' or (traffic_ahead_state == 'cooling' and traffic_ahead_closing_s < traffic_ahead_launch_s))"
    still_true: "traffic_ahead_state == 'in_lap' or (traffic_ahead_state == 'cooling' and traffic_ahead_closing_s < traffic_ahead_launch_s)"
    cooldown_s: 30
    conflict_group: slow_car
    requires: [lap_data, car_telemetry]
    say:
      - "Slow car ahead, {traffic_ahead_m:.0f} metres"
      - "Traffic ahead, {traffic_ahead_m:.0f} metres. Watch your line"
      - "Slow car, {traffic_ahead_m:.0f} metres"
  # Car crawling on the track surface ahead: stronger call than routine traffic.
  - id: slow_car_crawling
    sessions: [practice, qualifying]
    priority: 1
    when: "phase in ('flying', 'out_lap', 'on_track', 'in_lap') and traffic_ahead_state == 'aborted' and traffic_ahead_closing_s <= th.slow_car_warn_s and traffic_ahead_m >= 50"
    clear_when: "traffic_ahead_m > 400 or traffic_ahead_state != 'aborted'"
    still_true: "traffic_ahead_state == 'aborted'"
    cooldown_s: 20
    conflict_group: slow_car
    supersedes: [slow_car_ahead]
    requires: [lap_data, car_telemetry]
    say:
      - "Car crawling on track, {traffic_ahead_m:.0f} metres"
      - "Stopped car ahead, {traffic_ahead_m:.0f} metres. Careful"
      - "Car crawling, {traffic_ahead_m:.0f} metres. Lift"
  - id: prep_traffic_ahead
    sessions: [practice, qualifying]
    priority: 2
    when: "phase == 'out_lap' and dist_to_line_m <= th.prep_gap_m and traffic_ahead_kind != 'flying' and traffic_ahead_s <= th.prep_traffic_s"
    clear_when: "phase != 'out_lap'"
    still_true: "phase == 'out_lap' and traffic_ahead_s <= th.prep_traffic_s + 1"
    cooldown_s: 60
    cooldown_group: prep_gap
    requires: [lap_data]
    say:
      - "Slow car {traffic_ahead_s:.1f} ahead. Make a gap."
      - "Slow car {traffic_ahead_s:.1f} ahead. Drop back."
      - "You'll catch the car ahead. Ease off."
  - id: prep_dirty_air
    sessions: [practice, qualifying]
    priority: 2
    when: "phase == 'out_lap' and dist_to_line_m <= th.prep_gap_m and traffic_ahead_kind == 'flying' and traffic_ahead_s < th.tow_min_s"
    clear_when: "phase != 'out_lap'"
    still_true: "phase == 'out_lap' and traffic_ahead_s < th.tow_min_s + 0.3"
    cooldown_s: 60
    cooldown_group: prep_gap
    requires: [lap_data]
    say:
      - "Too close, {traffic_ahead_s:.1f}. Drop back, dirty air."
      - "Only {traffic_ahead_s:.1f} ahead. Drop back."
  - id: prep_tow
    sessions: [practice, qualifying]
    priority: 2
    when: "phase == 'out_lap' and dist_to_line_m <= th.prep_gap_m and traffic_ahead_kind == 'flying' and traffic_ahead_s >= th.tow_min_s and traffic_ahead_s <= th.tow_max_s"
    clear_when: "phase != 'out_lap'"
    still_true: "phase == 'out_lap' and traffic_ahead_kind == 'flying'"
    cooldown_s: 60
    cooldown_group: prep_gap
    requires: [lap_data]
    say:
      - "Car {traffic_ahead_s:.1f} ahead. Use the tow."
      - "Nice gap, {traffic_ahead_s:.1f}. Tow is there."
      - "Tow, {traffic_ahead_s:.1f} ahead. Stay in it."
  - id: prep_clear
    sessions: [practice, qualifying]
    priority: 3
    when: "phase == 'out_lap' and dist_to_line_m <= th.prep_gap_m and traffic_ahead_s > th.prep_clear_s and not (traffic_behind_kind == 'flying' and traffic_behind_s <= th.prep_behind_s)"
    clear_when: "phase != 'out_lap'"
    still_true: "phase == 'out_lap' and traffic_ahead_s > th.prep_clear_s"
    cooldown_s: 60
    cooldown_group: prep_gap
    requires: [lap_data]
    say:
      - "Clear ahead. Good gap for your lap."
      - "Clean air. All yours."
      - "Track's clear ahead. Good spacing."
  # Red flag: all sessions; repeats on cooldown while the flag stays out.
  - id: red_flag
    priority: 1
    when: "red_flag"
    clear_when: "not red_flag"
    say:
      - "Red flag. Red flag. Slow, back to pits"
      - "Red flag, red flag. Back to the pits"

  # Abnormal per-corner / per-axle wear (SessionState._note_corner_wear).
  # Loaded corner: front left and rear left carry the load in right-handers.
  - id: wear_front_left
    sessions: [practice, race]
    priority: 2
    when: "wear_hot_corner == 'front left'"
    clear_when: "wear_hot_corner != 'front left'"
    cooldown_s: 300
    requires: [car_damage, lap_data]
    say:
      - "Front left wearing {wear_hot_ratio:.1f} times faster. Less entry speed, right-handers"
      - "Front left {wear_hot_ratio:.1f} times the rest. Don't slide it in right-handers"
      - "Watch the front left. Slow in, fast out, right-handers"
  - id: wear_front_right
    sessions: [practice, race]
    priority: 2
    when: "wear_hot_corner == 'front right'"
    clear_when: "wear_hot_corner != 'front right'"
    cooldown_s: 300
    requires: [car_damage, lap_data]
    say:
      - "Front right wearing {wear_hot_ratio:.1f} times faster. Less entry speed, left-handers"
      - "Front right {wear_hot_ratio:.1f} times the rest. Don't slide it in left-handers"
      - "Watch the front right. Slow in, fast out, left-handers"
  - id: wear_rear_left
    sessions: [practice, race]
    priority: 2
    when: "wear_hot_corner == 'rear left'"
    clear_when: "wear_hot_corner != 'rear left'"
    cooldown_s: 300
    requires: [car_damage, lap_data]
    say:
      - "Rear left wearing {wear_hot_ratio:.1f} times faster. Smooth out of right-handers"
      - "Rear left {wear_hot_ratio:.1f} times the rest. No wheelspin, right-handers"
      - "Save the rear left. Short-shift out of right-handers"
  - id: wear_rear_right
    sessions: [practice, race]
    priority: 2
    when: "wear_hot_corner == 'rear right'"
    clear_when: "wear_hot_corner != 'rear right'"
    cooldown_s: 300
    requires: [car_damage, lap_data]
    say:
      - "Rear right wearing {wear_hot_ratio:.1f} times faster. Smooth out of left-handers"
      - "Rear right {wear_hot_ratio:.1f} times the rest. No wheelspin, left-handers"
      - "Save the rear right. Short-shift out of left-handers"
  - id: wear_fronts
    sessions: [practice, race]
    priority: 2
    when: "wear_hot_corner == 'fronts'"
    clear_when: "wear_hot_corner != 'fronts'"
    cooldown_s: 300
    requires: [car_damage, lap_data]
    say:
      - "Fronts wearing {wear_hot_ratio:.1f} times the rears. Slow in, fast out"
      - "Fronts {wear_hot_ratio:.1f} times faster. Less entry speed"
      - "Front limited. Brake straighter, let it rotate"
  - id: wear_rears
    sessions: [practice, race]
    priority: 2
    when: "wear_hot_corner == 'rears'"
    clear_when: "wear_hot_corner != 'rears'"
    cooldown_s: 300
    requires: [car_damage, lap_data]
    say:
      - "Rears wearing {wear_hot_ratio:.1f} times the fronts. Smooth throttle"
