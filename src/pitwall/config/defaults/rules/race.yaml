rules:
  # Named strategy plans A/B/C (docs/03 "Strategy plans"). The engine's plan
  # tracker owns the plan state; these rules only phrase it. plan_sc_box sits
  # after box_now in the pit group: it speaks only when box_now is gated out.
  - id: plan_switch
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and plan_switch_reason == 'pace' and plan_switch_lap == lap_num and plan_stops_left > 0"
    clear_when: "plan_switch_lap != lap_num"
    cooldown_s: 30
    cooldown_group: plan_switch
    requires: [lap_data]
    say:
      - "Plan {active_plan} now. {plan_spoken}, lap {plan_target_lap}"
      - "Going Plan {active_plan}. {plan_spoken}, lap {plan_target_lap}"
      - "New plan, {active_plan}. {plan_spoken}. Target lap {plan_target_lap}"
  - id: plan_switch_no_stop
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and plan_switch_reason == 'pace' and plan_switch_lap == lap_num and plan_stops_left == 0"
    clear_when: "plan_switch_lap != lap_num"
    cooldown_s: 30
    cooldown_group: plan_switch
    requires: [lap_data]
    say:
      - "Plan {active_plan}, {plan_spoken}. No more stops, save tyres"
      - "Change of plan, we're not stopping. {plan_spoken}"
      - "Plan {active_plan} now, {plan_spoken}. Tyres go to the flag"
  - id: plan_invalid
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and plan_switch_reason == 'invalid' and plan_switch_lap == lap_num"
    clear_when: "plan_switch_lap != lap_num"
    cooldown_s: 30
    cooldown_group: plan_switch
    requires: [lap_data]
    say:
      - "We're off Plan {plan_switched_from}. Plan {active_plan}, {plan_spoken}"
      - "Now off Plan {plan_switched_from}. Plan {active_plan}, {plan_spoken}"
      - "Going off Plan {plan_switched_from}. Plan {active_plan}, {plan_spoken}"
  - id: plan_off
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and active_plan != '' and not on_plan and plan_off_s >= th.plan_off_s"
    clear_when: "on_plan"
    cooldown_s: 90
    cooldown_group: plan_switch
    requires: [lap_data]
    say:
      - "Off Plan {active_plan}, losing {plan_off_s:.0f} seconds. Reviewing"
      - "Plan {active_plan} costs {plan_off_s:.0f} seconds. New plan coming"
      - "Off Plan {active_plan} by {plan_off_s:.0f} seconds. Checking"
  - id: plan_announce
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and active_plan == 'A' and plan_switch_count == 0 and plan_stops_left > 0 and (lap_num > 1 or lap_distance > th.plan_announce_after_m)"
    clear_when: "active_plan == ''"
    cooldown_s: 30
    cooldown_group: plan
    requires: [lap_data]
    say:
      - "Plan A, {plan_spoken}. Window {plan_window_start} to {plan_window_end}. Plan B, {plan_b_spoken}"
      - "Plan A is {plan_spoken}, target lap {plan_target_lap}. Plan B, {plan_b_spoken}"
      - "Plan A, {plan_spoken}. Plan B, {plan_b_spoken}"
  - id: plan_announce_no_stop
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and active_plan == 'A' and plan_switch_count == 0 and plan_stops_left == 0 and (lap_num > 1 or lap_distance > th.plan_announce_after_m)"
    clear_when: "active_plan == ''"
    cooldown_s: 30
    cooldown_group: plan
    requires: [lap_data]
    say:
      - "We're on Plan A, {plan_spoken}. We're going long"
      - "Plan A, {plan_spoken}. Look after the tyres"
      - "Plan A, {plan_spoken}. Tyres go the distance"
  - id: plan_status
    sessions: [race]
    priority: 3
    when: "phase == 'racing' and active_plan != '' and on_plan and plan_stops_left > 0 and sector == 1 and lap_num >= 2 and lap_num % th.plan_status_every_laps == 0 and lap_num < plan_window_start"
    clear_when: "sector != 1"
    cooldown_s: 60
    cooldown_group: plan
    requires: [lap_data]
    say:
      - "Still on Plan {active_plan}, window laps {plan_window_start} to {plan_window_end}"
      - "We're on Plan {active_plan}. Target lap {plan_target_lap}"
      - "Plan {active_plan} still good, window {plan_window_start} to {plan_window_end}"
  - id: plan_window_open
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and plan_window_open and on_plan and plan_target_lap > lap_num and (lap_num > 1 or lap_distance > th.plan_announce_after_m)"
    clear_when: "not plan_window_open"
    cooldown_s: 60
    cooldown_group: plan
    requires: [lap_data]
    say:
      - "Pit window is open. Plan {active_plan}, target lap {plan_target_lap}"
      - "Window open. We're targeting lap {plan_target_lap}, Plan {active_plan}"
      - "Window's open. Lap {plan_target_lap}, Plan {active_plan}"
  - id: plan_target_lap
    sessions: [race]
    priority: 1
    when: "phase == 'racing' and on_plan and plan_stops_left > 0 and plan_target_lap == lap_num and laps_remaining > th.pit_min_laps_left"
    clear_when: "plan_target_lap != lap_num"
    still_true: "phase == 'racing' and plan_target_lap == lap_num"
    cooldown_s: 45
    cooldown_group: pit
    requires: [lap_data]
    say:
      - "Target lap. Plan {active_plan}, box box, {plan_next_compound}s"
      - "Target lap. Box, {plan_next_compound}s, Plan {active_plan}"
      - "Box box, box box. Plan {active_plan}, {plan_next_compound}s"
    on_ack:
      - "Copy, box this lap"
    on_neg:
      - "Understood, extend. We'll look again next lap"
  # Pit calls read the optimiser's plan (docs/18). The gate fields sit in
  # `when` so the prediction and its confidence land in the decision log.
  - id: box_now
    sessions: [race]
    priority: 1
    when: "phase in ('racing', 'sc', 'vsc') and pit_plan in ('box_now', 'cheap_stop', 'free_stop', 'undercut') and (pit_plan_confidence >= mode.pit_confidence_min or laps_of_pace < 1) and pit_plan_risk <= mode.position_loss_risk_max and pit_plan_gain_s >= 0 and laps_remaining > th.pit_min_laps_left"
    clear_when: "phase not in ('racing', 'sc', 'vsc') or pit_plan not in ('box_now', 'cheap_stop', 'free_stop', 'undercut')"
    still_true: "phase in ('racing', 'sc', 'vsc') and pit_plan in ('box_now', 'cheap_stop', 'free_stop', 'undercut')"
    cooldown_s: 45
    cooldown_group: pit
    requires: [lap_data, car_status]
    say:
      - "Box, box. Plan {active_plan}. {pit_plan_reason}, {pit_plan_gain_s:.1f} seconds"
      - "Plan {active_plan}, box this lap. {pit_plan_reason}"
      - "Box this lap, box this lap. Plan {active_plan}, {pit_plan_reason}"
    on_ack:
      - "Copy, box this lap"
    on_neg:
      - "Copy, staying out. Window {pit_window_start} to {pit_window_end}"
  - id: plan_sc_box
    sessions: [race]
    priority: 1
    when: "phase in ('sc', 'vsc') and active_plan == 'C' and plan_switch_reason == 'sc' and plan_switch_lap == lap_num and laps_remaining > th.pit_min_laps_left"
    clear_when: "active_plan != 'C' or plan_switch_lap != lap_num"
    still_true: "phase in ('sc', 'vsc') and active_plan == 'C'"
    cooldown_s: 45
    cooldown_group: pit
    requires: [lap_data]
    say:
      - "Plan C, box box. {plan_next_compound}s, cheap stop"
      - "Plan C, Plan C. Box this lap for {plan_next_compound}s"
      - "Box box, Plan C. Cheap stop, {plan_next_compound}s"
    on_ack:
      - "Copy, Plan C, box this lap"
    on_neg:
      - "Understood, staying out. Plan {plan_switched_from} stays open"
  - id: box_in_n
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and pit_plan == 'box_in_n' and pit_plan_confidence >= mode.pit_confidence_min and pit_plan_gain_s >= mode.pit_gain_min_s"
    clear_when: "pit_plan != 'box_in_n'"
    still_true: "pit_plan == 'box_in_n'"
    cooldown_s: 60
    cooldown_group: pit
    requires: [lap_data, car_status]
    say:
      - "Plan is box lap {pit_plan_lap}. Window {pit_window_start} to {pit_window_end}"
      - "We're looking at lap {pit_plan_lap} for the stop"
      - "Stop lap {pit_plan_lap}. Window {pit_window_start} to {pit_window_end}"
  - id: overcut_stay_out
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and pit_plan == 'overcut' and pit_plan_confidence >= mode.pit_confidence_min"
    clear_when: "pit_plan != 'overcut'"
    cooldown_s: 60
    cooldown_group: pit
    requires: [lap_data, session_history]
    say:
      - "{pit_plan_rival_name} has boxed. Stay out and push, overcut is on"
      - "{pit_plan_rival_name} pitted. Push now, we go long"
      - "{pit_plan_rival_name}'s in. Stay out, give me some quick laps"
  - id: tyre_life
    sessions: [race]
    priority: 3
    when: "phase == 'racing' and sector == 1 and laps_of_pace >= 1 and laps_of_pace < laps_remaining and laps_of_pace < th.tyre_life_speak_laps and lap_num % mode.rival_info_every_n_laps == 0"
    clear_when: "sector != 1"
    cooldown_s: 60
    requires: [lap_data, car_damage]
    say:
      - "About {laps_of_pace:.0f} laps left in the tyres"
      - "Tyre check, roughly {laps_of_pace:.0f} laps of pace in them"
      - "About {laps_of_pace:.0f} laps of pace left in this set"
  - id: tyre_overheat
    sessions: [race]
    priority: 2
    when: "overheat and tyre_compound not in (7, 8)"
    clear_when: "not overheat"
    cooldown_s: 90
    requires: [car_telemetry]
    say:
      - "Tyres are running hot. Ease the slides"
      - "Temps are high, look after the rears"
      - "Tyre temps are climbing. Smooth on the throttle, fewer slides"
  - id: tyre_overheat_wet
    sessions: [race]
    priority: 2
    when: "overheat and tyre_compound in (7, 8)"
    clear_when: "not overheat"
    cooldown_s: 90
    requires: [car_telemetry]
    say:
      - "Tyres cooking. Find wet patches on the straights"
      - "Tyres overheating. Cool them off the dry line"
      - "Temps are high on these tyres. Use the wet bits to cool them"
  - id: tyre_switch
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and tyre_switch_to != '' and laps_remaining > 1"
    clear_when: "tyre_switch_to == ''"
    cooldown_s: 60
    requires: [lap_data]
    say:
      - "Box, box. {tyre_switch_to}. The field's quicker on them"
      - "Crossover. {tyre_switch_to} are the tyre, box this lap"
      - "Box this lap for {tyre_switch_to}. Confirm"
      - "Crossover. {tyre_switch_to} are quicker. Box, box"
  - id: tyre_graining
    sessions: [race]
    priority: 2
    when: "graining"
    clear_when: "not graining"
    cooldown_s: 90
    requires: [car_telemetry]
    say:
      - "Tyres are cold and graining. Work them, lean on the fronts"
      - "Graining. Load the fronts, it'll clean up"
      - "Graining on the tyres. Keep working them, it should come back"
  - id: tyre_blister
    sessions: [race]
    priority: 2
    when: "blister_max_pct >= th.blister_warn_pct"
    clear_when: "blister_max_pct < th.blister_warn_pct - th.blister_hysteresis_pct"
    cooldown_s: 120
    requires: [car_damage]
    say:
      - "Blistering at {blister_max_pct} percent. Manage the tyres"
      - "Blisters starting, {blister_max_pct} percent. Look after them"
      - "{blister_max_pct} percent blistering. Easy on the traction zones"
  - id: fuel_short
    sessions: [race]
    priority: 1
    when: "phase == 'racing' and fuel_per_lap_kg > 0 and fuel_margin_laps < -mode.lift_coast_trigger_laps and (laps_remaining > 1 or dist_to_line_m > th.fuel_final_call_m)"
    clear_when: "fuel_margin_laps >= 0"
    cooldown_s: 120
    cooldown_group: fuel
    requires: [car_status]
    say:
      - "Fuel {fuel_short_laps:.1f} laps short. Lift and coast"
      - "We're {fuel_short_laps:.1f} laps short on fuel. Start lifting"
      - "Fuel critical, {fuel_short_laps:.1f} laps short. Lift and coast now"
    severity:
      - when: "lap_num * 2 < total_laps"
        priority: 2
        say:
          - "Fuel {fuel_short_laps:.1f} laps short. Lift and coast"
          - "{fuel_short_laps:.1f} laps short on fuel. Lift into the big stops"
  - id: fuel_marginal
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and fuel_per_lap_kg > 0 and fuel_margin_laps <= th.fuel_tight_laps and fuel_margin_laps >= -mode.lift_coast_trigger_laps and (laps_remaining > 1 or dist_to_line_m > th.fuel_final_call_m)"
    clear_when: "fuel_margin_laps > th.fuel_tight_laps + th.fuel_hysteresis_laps"
    cooldown_s: 180
    cooldown_group: fuel
    requires: [car_status]
    say:
      - "Fuel is tight, margin {fuel_margin_r:+.1f} laps. Keep an eye on it"
      - "Fuel's on the edge, {fuel_margin_r:+.1f} laps. Save where you can"
      - "Fuel {fuel_margin_r:+.1f} laps. Lift where it's cheap"
    severity:
      - when: "fuel_margin_laps < 0 and lap_num * 2 >= total_laps"
        priority: 1
        say:
          - "Fuel short now, {fuel_margin_r:+.1f} laps. Lift every straight"
          - "Fuel {fuel_margin_r:+.1f} laps. Save now, lift before big stops"
      - when: "fuel_margin_laps < 0"
        say:
          - "Fuel {fuel_margin_r:+.1f} laps. Early days, save a little"
          - "Fuel a touch short, {fuel_margin_r:+.1f}. Bit of lift and coast"
  - id: fuel_spare
    sessions: [race]
    priority: 3
    when: "phase == 'racing' and fuel_per_lap_kg > 0 and fuel_margin_laps > th.fuel_spare_laps and sector == 1"
    clear_when: "fuel_margin_laps <= th.fuel_spare_laps"
    cooldown_s: 600
    cooldown_group: fuel
    requires: [car_status]
    say:
      - "Fuel is good, {fuel_margin_laps:.1f} laps spare. Use it"
      - "Fuel {fuel_margin_laps:.1f} laps spare. No saving"
      - "Fuel's fine, {fuel_margin_laps:.1f} laps spare. Push"
  - id: energy_over
    sessions: [race]
    min_lap: 3  # lap 1-2 spend the full launch charge
    priority: 2
    when: "phase == 'racing' and energy_mode == 'over' and sector == 2"
    clear_when: "energy_mode != 'over'"
    cooldown_s: 120
    cooldown_group: energy
    requires: [car_status]
    say:
      - "Energy {energy_lap_delta_mj:+.1f} MJ over. Harvest more"
      - "{energy_lap_delta_mj:+.1f} MJ over this lap. Harvest"
      - "Over energy budget, {energy_lap_delta_mj:+.1f} MJ. Harvest"
  - id: energy_under
    sessions: [race]
    min_lap: 3  # lap 1-2 spend the full launch charge
    priority: 3
    when: "phase == 'racing' and energy_mode == 'under' and sector == 2"
    clear_when: "energy_mode != 'under'"
    cooldown_s: 180
    cooldown_group: energy
    requires: [car_status]
    say:
      - "{energy_under_mj:.1f} MJ unused. Deploy more"
      - "{energy_under_mj:.1f} MJ left that lap. Use it"
      - "Battery spare, {energy_under_mj:.1f} MJ. Deploy"
  - id: overtake_mode
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and energy_mode == 'attack_ok' and gap_ahead_s <= mode.overtake_call_gap_s and drs_zone_ahead"
    clear_when: "gap_ahead_s > mode.overtake_call_gap_s + th.gap_hysteresis_s"
    cooldown_s: 60
    requires: [car_status, lap_data]
    say:
      - "Overtake mode is yours on {rival_ahead_name}. Use it"
      - "{gap_ahead_s:.1f} to {rival_ahead_name}. Energy is there, go"
      - "{rival_ahead_name}, {gap_ahead_s:.1f} ahead. Overtake mode, use it"
  - id: drs_attack
    sessions: [race]
    priority: 3
    when: "phase == 'racing' and drs_available and drs_zone_ahead"
    clear_when: "not drs_available"
    cooldown_s: 90
    requires: [car_status, lap_data]
    say:
      - "DRS on {rival_ahead_name}. {gap_ahead_s:.1f} seconds"
      - "DRS, {gap_ahead_s:.1f} to {rival_ahead_name}. Go get him"
      - "You've got DRS on {rival_ahead_name}, {gap_ahead_s:.1f}"
  # Battle coaching (docs/20 L3): push / attack / defend / manage / encourage,
  # driven by battle_mode (pitwall.strategy.battle) and the learned pass model.
  # Mode calls re-arm every lap (sector gate) so a budget-suppressed call is
  # retried; the shared `battle` cooldown group keeps them sparse.
  - id: battle_catching
    sessions: [race]
    min_lap: 2
    priority: 3
    when: "phase == 'racing' and sector == 1 and battle_mode == 'catching' and battle_catch_laps < laps_remaining"
    clear_when: "sector != 1"
    cooldown_s: 90
    cooldown_group: battle
    requires: [lap_data]
    say:
      - "{rival_ahead_name} ahead, {battle_pace_ahead}. {gap_ahead_s:.1f} to him"
      - "Car ahead is {battle_pace_ahead}. {gap_ahead_s:.1f}, keep pushing"
      - "{rival_ahead_name} is {battle_pace_ahead}. Reel him in"
    severity:
      - when: "battle_catch_laps <= 2"
        say:
          - "{rival_ahead_name}, {battle_pace_ahead}. On him in {battle_catch_laps:.0f} laps"
          - "Closing fast on {rival_ahead_name}. DRS soon"
  - id: battle_attack
    sessions: [race]
    min_lap: 2
    priority: 3
    when: "phase == 'racing' and sector == 1 and battle_mode == 'attacking' and battle_pass_prob >= th.battle_attack_prob_min"
    clear_when: "sector != 1"
    cooldown_s: 60
    cooldown_group: battle
    requires: [lap_data]
    say:
      - "You're in range of {rival_ahead_name}. Hammer time"
      - "{gap_ahead_s:.1f} to {rival_ahead_name}. Go for it"
      - "{rival_ahead_name} is {battle_pace_ahead}. Have a look"
    severity:
      - when: "laps_remaining <= 3"
        priority: 2
        say:
          - "{laps_remaining} to go. It's now or never on {rival_ahead_name}"
          - "Last chance at {rival_ahead_name}. Everything you've got"
  - id: battle_patience
    sessions: [race]
    min_lap: 2
    priority: 3
    when: "phase == 'racing' and sector == 1 and battle_mode == 'attacking' and battle_pass_prob < th.battle_attack_prob_min and battle_mode_laps >= th.battle_patience_laps and laps_remaining > th.battle_patience_laps"
    clear_when: "sector != 1"
    cooldown_s: 180
    cooldown_group: battle
    requires: [lap_data]
    say:
      - "Hard to pass. Stay with {rival_ahead_name}, save tyres"
      - "Patience with {rival_ahead_name}. Save the rears"
      - "No rush on {rival_ahead_name}. Keep him honest, pick your moment"
  - id: battle_defend
    sessions: [race]
    min_lap: 2
    priority: 2
    when: "phase == 'racing' and battle_mode == 'defending' and sector != 2"
    clear_when: "sector == 2 or battle_mode != 'defending'"
    cooldown_s: 60
    cooldown_group: battle
    requires: [lap_data]
    say:
      - "{rival_behind_name} {gap_behind_s:.1f} behind, {battle_pace_behind}"
      - "Car behind is {battle_pace_behind}. Keep the battery for the straight"
    severity:
      - when: "battle_closing_behind_s >= 0.3 and gap_behind_s <= 0.5 and battle_tyre_offset_behind >= 5"
        priority: 1
        say:
          - "{rival_behind_name} {gap_behind_s:.1f} behind on older tyres. He'll fade"
      - when: "battle_closing_behind_s >= 0.3 and gap_behind_s <= 0.5 and battle_tyre_offset_behind <= -5"
        priority: 1
        say:
          - "{rival_behind_name} {gap_behind_s:.1f} behind on fresher tyres. Battery {ers_store_pct:.0f}"
      - when: "battle_closing_behind_s >= 0.3 and gap_behind_s <= 0.5"
        priority: 1
        say:
          - "{rival_behind_name} {gap_behind_s:.1f} behind, {battle_pace_behind}. Battery {ers_store_pct:.0f}"
          - "{rival_behind_name} right on you, {gap_behind_s:.1f}. Battery {ers_store_pct:.0f}"
  - id: battle_under_threat
    sessions: [race]
    min_lap: 2
    priority: 3
    when: "phase == 'racing' and sector == 1 and battle_mode == 'under_threat' and battle_threat_laps < laps_remaining"
    clear_when: "sector != 1"
    cooldown_s: 120
    cooldown_group: battle
    requires: [lap_data]
    say:
      - "{rival_behind_name} behind, {battle_pace_behind}. {gap_behind_s:.1f} gap"
      - "Car behind is {battle_pace_behind}. Need a bit more pace"
      - "{rival_behind_name} coming, {battle_pace_behind}. Pick it up"
    severity:
      - when: "battle_threat_laps <= 2"
        priority: 2
        say:
          - "{rival_behind_name} in DRS in {battle_threat_laps:.0f} laps. Push"
          - "Gap behind {gap_behind_s:.1f}, falling. Push"
  - id: battle_manage
    sessions: [race]
    min_lap: 3
    priority: 3
    when: "phase == 'racing' and battle_mode == 'managing' and sector == 2 and battle_mode_laps >= th.battle_manage_every_laps and lap_num % th.battle_manage_every_laps == 0"
    cooldown_s: 240
    cooldown_group: battle
    requires: [lap_data]
    say:
      - "Gaps stable. Manage tyres"
      - "All under control. Save tyres"
      - "Gaps holding. Nice and tidy, save the tyres"
  - id: battle_passed
    sessions: [race]
    priority: 3
    when: "battle_result == 'passed' and battle_result_recent"
    clear_when: "not battle_result_recent"
    requires: [lap_data]
    say:
      - "Great move on {battle_result_name}. P{position}, now build the gap"
      - "Past {battle_result_name}. P{position}, clear his DRS"
      - "Past {battle_result_name}. P{position}, lovely"
    severity:
      - when: "position == 1"
        say:
          - "Get in! Past {battle_result_name}, you're leading this race"
          - "That's the lead! P1, clean air"
      - when: "position <= 3"
        say:
          - "Great move! P{position}, podium place"
          - "Get in! Past {battle_result_name}, P{position}"
  - id: battle_held
    sessions: [race]
    priority: 3
    when: "battle_result == 'held' and battle_result_recent"
    clear_when: "not battle_result_recent"
    requires: [lap_data]
    say:
      - "Good defending. Held off {battle_result_name}"
      - "Well held, {battle_result_name} dropped back"
      - "{battle_result_name} is out of DRS. Nice work"
  - id: battle_lost
    sessions: [race]
    priority: 3
    when: "battle_result == 'lost' and battle_result_recent"
    clear_when: "not battle_result_recent"
    requires: [lap_data]
    say:
      - "{battle_result_name}'s through. Stay with him, you'll have DRS"
      - "Lost it to {battle_result_name}. Stay close"
      - "{battle_result_name} got you. Head down, go again"
  # Place changes going back and forth with one car (or several): one call
  # about the fight instead of a pass / lost call every time.
  # Off the track and lost places; then got them back on the same lap.
  - id: off_track_lost
    sessions: [race]
    priority: 2
    when: "off_track_lost > 0 and phase == 'racing'"
    clear_when: "off_track_lost == 0"
    requires: [lap_data]
    cooldown_s: 20
    cooldown_group: incident
    say:
      - "Lost {off_track_lost}, P{position}. Still in reach"
      - "That cost {off_track_lost}, P{position}. Get them back"
      - "P{position}, {off_track_lost} lost. Clean laps now"
    severity:
      - when: "off_track_lost >= 3"
        say:
          - "{off_track_lost} places gone, P{position}. Long race"
          - "{off_track_lost} lost, P{position}. One car at a time"
  - id: off_track_recovered
    sessions: [race]
    priority: 3
    when: "off_track_recovered and phase == 'racing'"
    clear_when: "not off_track_recovered"
    requires: [lap_data]
    cooldown_s: 20
    say:
      - "And they're back. Good recovery, P{position}"
      - "All back already, P{position}. Great response"
      - "That's the places back, P{position}. Lovely recovery"
      - "Undone in one lap. P{position}, well fought"
  - id: battle_swap_ahead
    sessions: [race]
    priority: 3
    when: "battle_result == 'swap_ahead' and battle_result_recent"
    clear_when: "not battle_result_recent"
    cooldown_s: 60
    cooldown_group: battle_swap
    requires: [lap_data]
    say:
      - "Ahead of {battle_result_name}. Nail the exit, no DRS"
  - id: battle_swap_behind
    sessions: [race]
    priority: 3
    when: "battle_result == 'swap_behind' and battle_result_recent"
    clear_when: "not battle_result_recent"
    cooldown_s: 60
    cooldown_group: battle_swap
    requires: [lap_data]
    say:
      - "{battle_result_name} back ahead. Set up one clean move"
      - "He's back ahead. Pass where he can't DRS back"
      - "Swapping costs you both. Pick a pass that sticks"
  - id: battle_scrap
    sessions: [race]
    priority: 3
    when: "battle_result == 'scrap' and battle_result_recent"
    clear_when: "not battle_result_recent"
    cooldown_s: 90
    cooldown_group: battle_swap
    requires: [lap_data]
    say:
      - "Busy fight. P{position}, keep it clean"
      - "It's a scrap. P{position}. Pick your battles"
      - "Places changing. P{position}, stay out of trouble"
  - id: penalty
    sessions: [race]
    priority: 1
    when: "penalty_recent and penalty_kind == 'time' and penalty_time_s > 0 and penalty_infringement not in (7, 8, 9, 21)"
    clear_when: "not penalty_recent"
    cooldown_s: 15
    requires: [event]
    say:
      - "Penalty, {penalty_time_s} seconds. {penalty_s} total on the car now"
      - "We've been given {penalty_time_s} seconds. {penalty_s} total"
      - "{penalty_time_s} second penalty. {penalty_s} total now"
  - id: penalty_pit
    sessions: [race]
    priority: 1
    when: "penalty_recent and penalty_kind in ('drive_through', 'stop_go')"
    clear_when: "not penalty_recent"
    cooldown_s: 15
    requires: [event]
    say:
      - "We've got a {penalty_kind_text}. Serve it within three laps"
      - "{penalty_kind_text} penalty. We'll serve it, three laps to take it"
      - "{penalty_kind_text}. Three laps to serve it, we'll call it"
  - id: serve_penalty
    sessions: [race]
    priority: 2
    when: "unserved_drive_through + unserved_stop_go > 0 and pit_plan in ('box_now', 'box_in_n', 'cheap_stop')"
    clear_when: "unserved_drive_through + unserved_stop_go == 0"
    cooldown_s: 120
    requires: [lap_data]
    say:
      - "Unserved penalty on the car. We serve it at the stop"
      - "We'll take the penalty at the stop, it's still on the car"
      - "Reminder, penalty's unserved. It comes off at the stop"
  - id: penalty_track_limits
    sessions: [race]
    priority: 1
    when: "penalty_recent and penalty_kind == 'time' and penalty_time_s > 0 and penalty_infringement == 21"
    clear_when: "not penalty_recent"
    cooldown_s: 15
    requires: [event]
    say:
      - "{penalty_time_s} seconds, track limits. {penalty_s} total"
      - "{penalty_time_s} second penalty, track limits. {penalty_s} total"
      - "Track limits penalty, {penalty_time_s} seconds. {penalty_s} total"
      - "Track limits penalty, {penalty_time_s} seconds. {penalty_s} total"
  - id: penalty_corner_cut
    sessions: [race]
    priority: 1
    when: "penalty_recent and penalty_kind == 'time' and penalty_time_s > 0 and penalty_infringement in (7, 8, 9)"
    clear_when: "not penalty_recent"
    cooldown_s: 15
    requires: [event]
    say:
      - "{penalty_time_s} seconds, corner cut. {penalty_s} total"
      - "{penalty_time_s} second penalty, cutting. {penalty_s} total"
  - id: track_limit_warning
    sessions: [race]
    priority: 2
    when: "track_warning_recent and track_warning_kind in ('minor', 'significant', 'extreme') and track_warning_count % th.warnings_warn not in (0, th.warnings_warn - 1)"
    clear_when: "not track_warning_recent"
    cooldown_s: 10
    requires: [event]
    say:
      - "Track limits. The track's the grey bit, mate"
      - "Track limits warning. Stay inside the kerbs"
      - "Track limits warning. Lovely bit of grass you found there"
      - "Warning for track limits. Stewards noticed, so did we"
  - id: track_limit_last_warning
    sessions: [race]
    priority: 1
    when: "track_warning_recent and track_warning_kind in ('minor', 'significant', 'extreme') and track_warning_count % th.warnings_warn == th.warnings_warn - 1"
    clear_when: "not track_warning_recent"
    cooldown_s: 10
    requires: [event]
    say:
      - "Track limits, {track_warning_count} now. Next one's a penalty"
      - "Track limits, {track_warning_count}. Next one costs time"
      - "{track_warning_count} track limits. One more is a penalty"
  - id: corner_cut_warning
    sessions: [race]
    priority: 2
    when: "track_warning_recent and track_warning_kind == 'cut' and track_warning_count % th.warnings_warn not in (0, th.warnings_warn - 1)"
    clear_when: "not track_warning_recent"
    cooldown_s: 10
    requires: [event]
    say:
      - "Corner cut warning. Give the time back"
      - "Warning, cutting the corner. Stay on track"
  - id: corner_cut_last_warning
    sessions: [race]
    priority: 1
    when: "track_warning_recent and track_warning_kind == 'cut' and track_warning_count % th.warnings_warn == th.warnings_warn - 1"
    clear_when: "not track_warning_recent"
    cooldown_s: 10
    requires: [event]
    say:
      - "Corner cuts, {track_warning_count} now. Next one's a penalty"
      - "{track_warning_count} corner cuts. One more costs time"
  - id: track_limit_overtake
    sessions: [race]
    priority: 2
    when: "track_warning_recent and track_warning_kind == 'overtake'"
    clear_when: "not track_warning_recent"
    cooldown_s: 10
    requires: [event]
    say:
      - "Warning for passing off track. Nice move, wrong postcode"
      - "That pass was off track. Warning"
      - "Warning, pass off track. Keep it on"
  - id: blue_flag
    sessions: [race]
    priority: 1
    when: "blue_flag and phase not in ('red_flag', 'sc', 'vsc')"
    clear_when: "not blue_flag or phase in ('red_flag', 'sc', 'vsc')"
    cooldown_s: 20
    requires: [car_status]
    say:
      - "Blue flag. Let him by"
      - "Blues, leader behind. Give him the room"
      - "Blue flags. Let him through, cleanly"
  - id: rival_ahead_pitted
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and rival_ahead_pitted and pit_plan != 'overcut' and gap_ahead_s <= th.rival_pit_gap_s"
    clear_when: "not rival_ahead_pitted"
    cooldown_s: 45
    cooldown_group: rival_pit
    requires: [lap_data]
    say:
      - "{rival_ahead_name} ahead has boxed. Was {gap_ahead_s:.1f} up"
      - "{rival_ahead_name} pitted, {gap_ahead_s:.1f} ahead"
      - "Car ahead's boxing, {rival_ahead_name}. He was {gap_ahead_s:.1f} up"
  - id: rival_behind_pitted
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and rival_behind_pitted and tyre_age_laps >= 2"
    clear_when: "not rival_behind_pitted"
    cooldown_s: 45
    cooldown_group: rival_pit
    requires: [lap_data]
    say:
      - "{rival_behind_name} behind has boxed. Watch the undercut"
      - "{rival_behind_name} pitted. Undercut threat, push"
      - "{rival_behind_name} boxed. Push, cover the undercut"
  - id: weather_to_inter
    sessions: [race]
    priority: 2
    when: "weather_crossover == 'to_inter' and tyre_compound not in (0, 7)"
    clear_when: "weather_crossover != 'to_inter'"
    cooldown_s: 120
    cooldown_group: weather
    requires: [session]
    say:
      - "Rain {weather_crossover_pct} percent in {weather_crossover_min} minutes. Inters"
      - "Rain coming, {weather_crossover_pct} percent. Inters likely"
      - "{weather_crossover_pct} percent rain in {weather_crossover_min} minutes. Thinking inters"
  - id: weather_to_wet
    sessions: [race]
    priority: 2
    when: "weather_crossover == 'to_wet' and tyre_compound not in (0, 8)"
    clear_when: "weather_crossover != 'to_wet'"
    cooldown_s: 120
    cooldown_group: weather
    requires: [session]
    say:
      - "Rain {weather_crossover_pct} percent in {weather_crossover_min} minutes. Full wets"
      - "Heavy rain, {weather_crossover_pct} percent. Full wets likely"
      - "Big rain coming, {weather_crossover_pct} percent. Ready for wets"
  - id: weather_to_dry
    sessions: [race]
    priority: 2
    when: "weather_crossover == 'to_dry'"
    clear_when: "weather_crossover != 'to_dry'"
    cooldown_s: 120
    cooldown_group: weather
    requires: [session]
    say:
      - "Track drying, rain {weather_crossover_pct} percent. Slicks soon"
      - "Drying, {weather_crossover_pct} percent rain. Slicks soon"
      - "Drying out. Slicks coming"
  - id: sc_deployed
    sessions: [race]
    priority: 1
    when: "phase == 'sc'"
    clear_when: "phase != 'sc'"
    requires: [session]
    say:
      - "Safety car, safety car. Delta positive, stay above it"
      - "Safety car deployed. Keep the delta positive"
      - "Safety car, safety car. Watch the delta"
  - id: vsc_deployed
    sessions: [race]
    priority: 1
    when: "phase == 'vsc'"
    clear_when: "phase != 'vsc'"
    requires: [session]
    say:
      - "Virtual safety car. Stick to the delta"
      - "VSC, VSC. Stay on the delta"
      - "Virtual safety car deployed. Delta, keep it positive"
  - id: sc_ending
    sessions: [race]
    priority: 1
    when: "phase == 'sc' and sc_ending"
    clear_when: "not sc_ending"
    requires: [lap_data]
    say:
      - "Safety car in this lap. Heat the tyres"
      - "Safety car in. Tyres warm, restart coming"
      - "SC in this lap, SC in this lap. Stay close, be ready to go"
  - id: vsc_ending
    sessions: [race]
    priority: 1
    when: "phase == 'vsc' and sc_ending"
    clear_when: "not sc_ending"
    requires: [lap_data]
    say:
      - "VSC ending, VSC ending. Be ready to go"
      - "VSC ending. Stay on the delta until it goes green"
  - id: sc_restart
    sessions: [race]
    priority: 1
    when: "phase == 'racing' and neutral_ended_kind == 'sc' and neutral_ended_s < th.neutral_green_s"
    clear_when: "neutral_ended_s >= th.neutral_green_s"
    requires: [lap_data]
    say:
      - "Green flag, green flag. Racing again, push now"
      - "Green, green. We're racing, full attack"
      - "Safety car's in, green flag. Go"
  - id: vsc_restart
    sessions: [race]
    priority: 1
    when: "phase == 'racing' and neutral_ended_kind == 'vsc' and neutral_ended_s < th.neutral_green_s"
    clear_when: "neutral_ended_s >= th.neutral_green_s"
    requires: [lap_data]
    say:
      - "Green, green. VSC's over, full power"
      - "VSC over, go, go, go"
  # End of lap 1: report against the grid slot.
  - id: lap1_gained
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and lap_num == 2 and sector == 0 and grid_position > 0 and positions_gained > 0"
    clear_when: "lap_num != 2"
    max_per_stint: 1
    requires: [lap_data]
    say:
      - "Great start. P{position}, up {positions_gained}"
      - "Lap one, P{position}. {positions_gained} gained"
      - "Mega start! P{position}, {positions_gained} up"
  - id: lap1_lost
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and lap_num == 2 and sector == 0 and grid_position > 0 and positions_lost > 0"
    clear_when: "lap_num != 2"
    max_per_stint: 1
    requires: [lap_data]
    say:
      - "Lap one, P{position}. Lost {positions_lost}, long race"
      - "P{position}, {positions_lost} down. Stay calm"
  - id: lap1_held
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and lap_num == 2 and sector == 0 and grid_position > 0 and positions_gained == 0"
    clear_when: "lap_num != 2"
    max_per_stint: 1
    requires: [lap_data]
    say:
      - "Lap one, holding P{position}. {laps_remaining} to go"
      - "Clean first lap, P{position}. Settle in"
  - id: three_to_go
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and total_laps >= 6 and laps_remaining == 3 and sector == 0"
    clear_when: "laps_remaining != 3"
    max_per_stint: 1
    requires: [lap_data]
    say:
      - "Three laps to go. P{position}, keep it tidy"
      - "Three to go, P{position}. No mistakes now"
  - id: last_lap_defend
    sessions: [race]
    priority: 1
    when: "phase == 'racing' and total_laps > 1 and laps_remaining == 1 and sector == 0 and gap_behind_s < th.last_lap_fight_s"
    clear_when: "laps_remaining != 1"
    max_per_stint: 1
    requires: [lap_data]
    say:
      - "Final lap, {rival_behind_name} {gap_behind_s:.1f} back. Hold him off"
  - id: last_lap_attack
    sessions: [race]
    priority: 1
    when: "phase == 'racing' and total_laps > 1 and laps_remaining == 1 and sector == 0 and gap_ahead_s < th.last_lap_fight_s and not gap_behind_s < th.last_lap_fight_s"
    clear_when: "laps_remaining != 1"
    max_per_stint: 1
    requires: [lap_data]
    say:
      - "Last lap. {rival_ahead_name}, {gap_ahead_s:.1f}. Everything"
      - "Final lap, {gap_ahead_s:.1f} to {rival_ahead_name}. Go for it"
  - id: last_lap
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and total_laps > 1 and laps_remaining == 1 and sector == 0 and not gap_behind_s < th.last_lap_fight_s and not gap_ahead_s < th.last_lap_fight_s"
    clear_when: "laps_remaining != 1"
    max_per_stint: 1
    requires: [lap_data]
    say:
      - "Last lap. P{position}, bring it home"
      - "Final lap, P{position}. Nice and clean to the flag"
  # Fastest lap (FTLP event). The player's is always worth a word; a rival's
  # only late on, when the player's best is close enough to take it back.
  - id: fastest_lap_mine
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and fastest_lap_mine and fastest_lap_age_s < th.fastest_lap_fresh_s"
    clear_when: "not fastest_lap_mine or fastest_lap_age_s >= th.fastest_lap_fresh_s"
    still_true: "fastest_lap_mine"
    cooldown_s: 30
    requires: [lap_data]
    say:
      - "Fastest lap! {fastest_lap_spoken}, that's purple."
      - "Purple lap. {fastest_lap_spoken}, fastest of anyone."
      - "Fastest lap of the race, {fastest_lap_spoken}."
  - id: fastest_lap_taken
    sessions: [race]
    priority: 3
    when: "phase == 'racing' and not fastest_lap_mine and fastest_lap_age_s >= th.fastest_lap_settle_s and fastest_lap_age_s < th.fastest_lap_fresh_s and laps_remaining <= th.fastest_lap_chase_laps and fastest_lap_gap_s <= th.fastest_lap_chase_s"
    clear_when: "fastest_lap_mine or fastest_lap_age_s >= th.fastest_lap_fresh_s"
    still_true: "not fastest_lap_mine"
    cooldown_s: 60
    requires: [lap_data]
    say:
      - "{fastest_lap_name} fastest lap, {fastest_lap_spoken}. You're {fastest_lap_gap_s:.1f} off."
      - "Fastest lap, {fastest_lap_name}. {fastest_lap_gap_s:.1f} to find."
  # Time penalties decide the classified result: say where we really are.
  - id: penalty_cost
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and penalty_s > 0 and penalty_places > 0 and laps_remaining <= th.penalty_standing_laps"
    clear_when: "penalty_places == 0"
    cooldown_s: 120
    cooldown_group: penalty_standing
    requires: [lap_data]
    say:
      - "With penalty, P{penalty_position}. Need {penalty_need_s:.1f} on {penalty_threat_name}"
      - "Penalty makes it P{penalty_position}. {penalty_need_s:.1f} more on {penalty_threat_name}"
      - "{penalty_s} second penalty, P{penalty_position}. Find {penalty_need_s:.1f} on {penalty_threat_name}"
    severity:
      - when: "penalty_places >= 3"
        say:
          - "Penalty drops us to P{penalty_position}. {penalty_need_s:.1f} on {penalty_threat_name}"
          - "Penalty costs {penalty_places} places. {penalty_need_s:.1f} on {penalty_threat_name}"
  - id: penalty_covered
    sessions: [race]
    priority: 3
    when: "phase == 'racing' and penalty_s > 0 and penalty_position > 0 and penalty_places == 0 and laps_remaining <= th.penalty_standing_laps"
    clear_when: "penalty_places > 0"
    cooldown_s: 120
    cooldown_group: penalty_standing
    requires: [lap_data]
    say:
      - "Gap covers the penalty. P{position} safe"
      - "Penalty covered, {penalty_margin_s:.1f} in hand"
      - "P{position} with the penalty. {penalty_margin_s:.1f} margin"
  - id: finish_penalty
    sessions: [race]
    priority: 2
    when: "phase == 'finished' and penalty_places > 0"
    max_per_stint: 1
    requires: [lap_data]
    say:
      - "Flag. P{position} on the road, P{penalty_position} after penalty"
      - "Flag. P{penalty_position} with the penalty. Pace was there"
      - "Flag. Crossed P{position}, classified P{penalty_position}"
  - id: finish_gained
    sessions: [race]
    priority: 2
    when: "phase == 'finished' and grid_position > 0 and positions_gained > 0 and penalty_places == 0"
    max_per_stint: 1
    requires: [lap_data]
    say:
      - "Flag! P{position}, up {positions_gained} from P{grid_position}"
      - "Flag. P{position}, {positions_gained} gained. Brilliant"
  - id: finish_lost
    sessions: [race]
    priority: 2
    when: "phase == 'finished' and grid_position > 0 and positions_lost > 0 and penalty_places == 0"
    max_per_stint: 1
    requires: [lap_data]
    say:
      - "Flag. P{position}, from P{grid_position}. Debrief later"
      - "Flag, P{position}. Tough one"
  - id: finish_held
    sessions: [race]
    priority: 2
    when: "phase == 'finished' and grid_position > 0 and positions_gained == 0 and penalty_places == 0"
    max_per_stint: 1
    requires: [lap_data]
    say:
      - "Chequered flag. P{position}, same as the grid. Solid job"
      - "That's the flag, P{position}. Held the grid slot, good work"
  - id: finish_win
    sessions: [race]
    priority: 1
    when: "phase == 'finished' and position == 1 and penalty_places == 0"
    max_per_stint: 1
    requires: [lap_data]
    say:
      - "Yes! Yes! You've won the race!"
      - "Get in there! P1! Winner!"
      - "That's the win! Simply lovely. What a drive"
      - "Race winner! You beauty!"
      - "Flag, P1! What a job!"
      - "Get in there! P1!"
  - id: finish_podium
    sessions: [race]
    priority: 1
    when: "phase == 'finished' and position in (2, 3) and penalty_places == 0"
    max_per_stint: 1
    requires: [lap_data]
    say:
      - "That's it, you've done it! P{position}, on the podium!"
      - "P{position}! Podium! Get in there, brilliant job"
      - "Flag, P{position}. Podium! Well driven"
      - "Yes! P{position}, trophy time. Great stuff"
  - id: pit_exit_traffic_race
    sessions: [race]
    priority: 2
    when: "phase == 'out_lap' and rival_pit_exit_name != '' and abs(pit_exit_rival_gap_s) < th.pit_exit_traffic_s"
    clear_when: "phase != 'out_lap'"
    requires: [lap_data]
    say:
      - "{rival_pit_exit_name} right there at the pit exit. Hold the line"
      - "Careful at the exit, {rival_pit_exit_name} is right there"
      - "{rival_pit_exit_name} coming at the pit exit. Hold your line"
  # Team fight: free to race, keep it clean.
  - id: teammate_fight
    sessions: [race]
    priority: 2
    when: "phase == 'racing' and teammate_fight"
    clear_when: "not teammate_fight"
    cooldown_s: 300
    requires: [lap_data, participants]
    say:
      - "It's {teammate_name}. You're free to race, but keep it clean"
      - "Team-mate {teammate_name}. Free to fight, give room"
      - "{teammate_name}, {teammate_gap_s:.1f}. Race him, no contact"
      - "Fighting your team-mate. Race hard, race clean"
    escalate:
      - after: 2
        say:
          - "Still {teammate_name}. Race clean"
          - "{teammate_name} again. Careful, both cars home please"
          - "It's the team-mate. No risks"
  # Contact (COLL): check the car, then report once the damage data settles.
  # Repeat hits inside th.contact_merge_s are one contact.
  - id: contact_check_teammate
    sessions: [race]
    priority: 1
    when: "phase != 'garage' and contact_phase == 'checking' and contact_teammate"
    clear_when: "contact_phase == ''"
    cooldown_s: 20
    cooldown_group: contact_check
    requires: [participants]
    say:
      - "Contact with {contact_name}. Checking the car"
      - "That's your team-mate! Checking the car, keep it clean"
      - "Touch with {contact_name}. Checking damage"
  - id: contact_check
    sessions: [race]
    priority: 1
    when: "phase != 'garage' and contact_phase == 'checking' and not contact_teammate"
    clear_when: "contact_phase == ''"
    cooldown_s: 20
    cooldown_group: contact_check
    say:
      - "Contact there. Checking the car"
      - "Contact. Checking damage"
