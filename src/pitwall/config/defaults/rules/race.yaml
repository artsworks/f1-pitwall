    requires: [lap_data]
    say:
      - "Chequered flag. P{position} on the road, but the {penalty_s} seconds makes it P{penalty_position}. Strong drive, we'll clean up the penalties"
      - "That's the flag. P{position} on track, P{penalty_position} after the {penalty_s} seconds. Pace was there, the penalty cost us"
      - "Flag. Crossed the line P{position}, classified P{penalty_position} with the penalty. Plenty to take from that"
  - id: finish_gained
    sessions: [race]
    priority: 2
    when: "phase == 'finished' and grid_position > 0 and positions_gained > 0 and penalty_places == 0"
    max_per_stint: 1
    requires: [lap_data]
    say:
      - "Chequered flag. P{position}, up {positions_gained} from P{grid_position}. Great drive"
      - "That's the flag. P{position}, {positions_gained} places gained. Brilliant job"
  - id: finish_lost
    sessions: [race]
    priority: 2
    when: "phase == 'finished' and grid_position > 0 and positions_lost > 0 and penalty_places == 0"
    max_per_stint: 1
    requires: [lap_data]
    say:
      - "Chequered flag. P{position}, from P{grid_position}. We'll go through it in the debrief"
      - "That's the flag, P{position}. Tough one, we'll find the time in the debrief"
  - id: finish_held
    sessions: [race]
    priority: 2
    when: "phase == 'finished' and grid_position > 0 and positions_gained == 0 and penalty_places == 0"
    max_per_stint: 1
    requires: [lap_data]
    say:
      - "Chequered flag. P{position}, same as the grid. Solid job"
      - "That's the flag, P{position}. Held the grid slot, good work"
  - id: finish_win
