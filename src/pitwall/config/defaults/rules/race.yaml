      - "That's the win! Simply lovely. What a drive"
      - "Race winner! Oh, you beauty! Superb, absolutely superb"
      - "Chequered flag, P1! Get in there! Wow, what a job"
      - "Get in there, mate! What a way to do it. P1!"
  - id: finish_podium
