# Radio-call scheduling grades. Replayed by scripts/replay_radio_grades.py and tests/test_radio_grades.py.
#
# Each scenario freezes one moment. `queued` calls are all pending at `now` (100.0 unless the scene sets it).
# The harness submits them oldest first (age_s), then drains the dispatcher.
#
# Grade actions:
#   now    speaks first and cuts or follows silence
#   next   speaks first after the call already on air finishes
#   queue  speaks later
#   merge  folded into another spoken line (duplicate or digest)
#   drop   never speaks
# `order` lists the queued calls that speak, in order. "digest" stands for one digest line.
# "a|b" matches either id (see `rotate`). The call on air only appears in `order` if it was cut
# and spoke again.
#
# source: graded = from the owner's grading batches. reconstructed = rebuilt from the policy, regrade freely.
version: 1
kind: radio-grades
defaults:
  policy:
    deadlines_s: {1: 60.0, 2: 60.0, 3: 60.0}
    min_gap_s: 0.0
    p3_straight_only: false
    calls_per_lap: null
batches:
  - id: 1
    title: Practice and qualifying
    scenarios:
      - id: p01
        source: reconstructed
        session: practice
        scene: {phase: flying}
        currently_speaking: {id: lockup, rule: lockup_front, text: "Locking the fronts into Turn 1. Brake a touch earlier", age_s: 0.5}
        queued:
          - {id: crawl, rule: slow_car_crawling, text: "Slow car ahead, crawling. Careful"}
        grade: {lockup: drop, crawl: now}
        order: [crawl]
        notes: Safety cuts coaching mid-sentence. Coaching is not re-queued.
      - id: p02
        source: reconstructed
        session: practice
        scene: {phase: out_lap}
        queued:
          - {id: setup, rule: setup_bias, text: "Try brake bias two forward", age_s: 1.0}
          - {id: exit, rule: pit_exit_traffic, text: "Car coming at pit exit. Stay right"}
        grade: {setup: drop, exit: now}
        order: [exit]
        notes: Focus. Pit exit traffic drops the setup tip.
      - id: p03
        source: reconstructed
        session: practice
        scene: {phase: flying}
        currently_speaking: {id: wear, rule: wear_fronts, text: "Fronts at forty percent wear, still fine", age_s: 0.5}
        queued:
          - {id: boost, rule: boost_left_on, text: "Boost still on. Turn it off"}
        grade: {wear: drop, boost: now}
        order: [boost]
        notes: Safety cuts info mid-sentence.
      - id: p04
        source: reconstructed
        session: practice
        scene: {phase: flying}
        queued:
          - {id: wear, rule: wear_fronts, text: "Fronts at forty percent", age_s: 1.0}
          - {id: ers, rule: ers_fault, text: "ERS fault. Hold position, we're checking"}
        grade: {ers: now, wear: next}
        order: [ers, wear]
        notes: Systems warnings go first but do not trigger focus suppression.
      - id: p05
        source: reconstructed
        session: practice
        scene: {phase: flying}
        queued:
          - {id: lockup, rule: lockup_front, text: "Locking the fronts into Turn 4", age_s: 1.0}
          - {id: drs, rule: drs_fault, text: "DRS fault. Don't rely on it"}
        grade: {drs: now, lockup: next}
        order: [drs, lockup]
        notes: DRS fault is a systems warning. No focus drop.
      - id: p06
        source: graded
        session: practice
        scene: {phase: flying}
        queued:
          - {id: mistakes, rule: cool_mistakes, text: "Turn 9 cost you two tenths", age_s: 1.0}
          - {id: crawl, rule: slow_car_crawling, text: "Slow car ahead, crawling. Careful"}
        grade: {crawl: now, mistakes: drop}
        order: [crawl]
        notes: cool_mistakes dropped. After a hazard call, naming a corner implies the hazard is there.
      - id: p07
        source: graded
        session: practice
        scene: {phase: flying}
        queued:
          - {id: saved, rule: saved_moment, text: "Nice save there", age_s: 1.0}
          - {id: crawl, rule: slow_car_crawling, text: "Slow car ahead, crawling. Careful"}
        grade: {crawl: now, saved: drop}
        order: [crawl]
        notes: saved_moment dropped to keep focus on the slow car.
      - id: p08
        source: graded
        session: practice
        scene: {phase: flying}
        queued:
          - {id: slow1, rule: slow_car_ahead, text: "Slow car ahead. Careful", age_s: 1.0}
          - {id: slow2, rule: slow_car_ahead, text: "Slow car ahead. Careful"}
        grade: {slow1: now, slow2: merge}
        order: [slow1]
        expect_text: {slow1: "two"}
        notes: Duplicates merge into one count-aware line, "two slow cars ahead".
      - id: p09
        source: reconstructed
        session: practice
        scene: {phase: flying}
        currently_speaking: {id: wear, rule: wear_fronts, text: "Fronts at forty percent wear, still fine", age_s: 0.5}
        queued:
          - {id: lockup, rule: lockup_front, text: "Locking the fronts into Turn 1"}
        grade: {wear: now, lockup: next}
        order: [lockup]
        notes: Coaching never preempts.
      - id: p10
        source: reconstructed
        session: practice
        scene: {phase: flying}
        currently_speaking: {id: slow1, rule: slow_car_ahead, text: "Slow car ahead. Careful", age_s: 0.5}
        queued:
          - {id: slow2, rule: slow_car_ahead, text: "Slow car ahead. Careful"}
        grade: {slow1: now, slow2: drop}
        order: []
        notes: Existing dedupe still drops a repeat of the line on air.
      - id: q01
        source: reconstructed
        session: qualifying
        scene: {phase: garage}
        queued:
          - {id: status, rule: cool_status, text: "Track is clear, ninety seconds left", age_s: 1.0}
          - {id: go, rule: release_go, text: "Go, go, go"}
        grade: {go: now, status: next}
        order: [go, status]
        notes: Execution ahead of info.
      - id: q02
        source: reconstructed
        session: qualifying
        scene: {phase: garage}
        currently_speaking: {id: status, rule: cool_status, text: "Track is clear, ninety seconds left in the session", age_s: 0.5}
        queued:
          - {id: go, rule: release_go, text: "Go, go, go"}
        grade: {status: drop, go: now}
        order: [go]
        notes: Execution cuts info mid-sentence.
      - id: q03
        source: reconstructed
        session: qualifying
        scene: {phase: out_lap}
        queued:
          - {id: pole, rule: cool_vs_pole, text: "Pole is a one twenty-eight four", age_s: 1.0}
          - {id: behind, rule: cool_car_behind, text: "Car behind on a hot lap. Let him by"}
        grade: {behind: now, pole: drop}
        order: [behind]
        notes: Focus. Hot-lap traffic drops the pole info.
      - id: q04
        source: graded
        session: qualifying
        scene: {phase: in_lap}
        queued:
          - {id: deleted, rule: lap_deleted, text: "Lap deleted. Track limits at Turn 4", age_s: 2.0}
          - {id: abort, rule: abort_lap, text: "Abort the lap", age_s: 1.0}
          - {id: through, rule: quali_through, text: "You're through. Box, box"}
        grade: {through: now, deleted: drop, abort: drop}
        order: [through]
        notes: quali_through makes the deleted lap and the abort moot (resolved_by).
      - id: q05
        source: reconstructed
        session: qualifying
        scene: {phase: flying}
        currently_speaking: {id: traffic, rule: prep_traffic_ahead, text: "Traffic ahead in sector two", age_s: 0.5}
        queued:
          - {id: mistakes, rule: cool_mistakes, text: "Turn 9 cost you two tenths"}
        grade: {traffic: now, mistakes: drop}
        order: []
        notes: Sequential coherence. A corner callout right after a traffic call reads as "traffic at Turn 9".
      - id: q06
        source: reconstructed
        session: qualifying
        scene: {phase: out_lap}
        queued:
          - {id: status, rule: cool_status, text: "Track is clear", age_s: 1.0}
          - {id: hot, rule: cool_hot_mode, text: "Push now. This is the lap"}
        grade: {hot: now, status: next}
        order: [hot, status]
        notes: Execution ahead of info.
      - id: q07
        source: reconstructed
        session: qualifying
        scene: {phase: out_lap}
        queued:
          - {id: pole, rule: cool_vs_pole, text: "Pole is a one twenty-eight four", age_s: 1.0}
          - {id: reply, kind: reply, menu_item: tyres, rule: menu_reply, text: "Tyres are fine. Worst one twenty percent"}
        grade: {reply: now, pole: next}
        order: [reply, pole]
        notes: Driver reply goes ahead of info.
      - id: q08
        source: reconstructed
        session: qualifying
        scene: {phase: garage}
        queued:
          - {id: reply, kind: reply, menu_item: tyres, rule: menu_reply, text: "Tyres are fine", age_s: 1.0}
          - {id: hold, rule: release_hold, text: "Hold. Traffic in the pit lane"}
        grade: {hold: now, reply: next}
        order: [hold, reply]
        notes: Reply waits behind execution.
      - id: q09
        source: graded
        session: qualifying
        scene: {phase: garage, time_for_out_lap: true, session_time_left: 95.0, release_time_left_s: 25.0}
        queued:
          - {id: pole, rule: cool_vs_pole, text: "Pole is a one twenty-eight four", age_s: 1.0}
          - {id: closing, rule: release_window_closing, kind: execution, hypothetical: true, text: "Window closing. Go now or we miss the lap"}
        grade: {closing: now, pole: next}
        order: [closing, pole]
        notes: Keep the window-closing warning. release_too_late only covers the after-close "stay in" call.
      - id: q10
        source: reconstructed
        session: qualifying
        scene: {phase: flying}
        queued:
          - {id: mistakes, rule: cool_mistakes, text: "Turn 9 cost you two tenths", age_s: 1.0}
          - {id: last, rule: lap_deleted_last, text: "Lap deleted. That was the last one"}
        grade: {last: now, mistakes: next}
        order: [last, mistakes]
        notes: Execution ahead of coaching. No traffic call, so the corner callout is fine.
      - id: q11
        source: reconstructed
        session: qualifying
        scene: {phase: garage, time_for_out_lap: false, session_time_left: 40.0}
        queued:
          - {id: pole, rule: cool_vs_pole, text: "Pole is a one twenty-eight four", age_s: 1.0}
